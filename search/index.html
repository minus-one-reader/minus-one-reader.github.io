مراه‌کننده از آن جهت مفید است که به‌شکل سلبی به دعاوی واقعی هگل اشاره می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">از نگاه هگل، حرکت در هستی و اندیشه از رهگذر تناقض رخ می‌دهد - یعنی ناتوانی هر هویتی در برساختن خود بدون انکه هم‌زمان خود را نفی نکند. تناقض صرفا تقابل نیست. به زبان اوردن یک تز و یک انتی‌تز مخالف نیست. در عوض، تناقض وقتی رخ می‌دهد که یک موضع، منطق خودش را دنبال کند و از این راه خود را در تعارض با خویش بیابد. از نظر هگل، هیچ هویت یا موضعی وجود ندارد که بتواند در مقام تزی پایدار عمل کند. تز هرگز نقطه عزیمتی منزوی نیست که متعاقبا با انتی‌تزی روبه‌رو شود. برعکس، هر موضعی در نهایت با نمایاندن شکاف درونی خود، خویش را تضعیف می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">برای مثال، اگر من موضعی شکاکانه بگیرم و قطعیت هر نوع شناختی را رد کنم، منطق خودِ این موضع با برقرار کردن قطعیتی عام درباره فقدان قطعیت، خود را دچار تناقض می‌کند. یا اگر خواستار مدارایی همگانی برای تمام نظام‌های باور متفاوت باشم، ذاتا از مدارا با آن نظام‌های باوری که خود اجازه مدارا نمی‌دهند سر باز می‌زنم. از سوی دیگر، اگر با نظام نابردبار مدارا کنم، ان‌گاه از عمومیت‌بخشی به مدارا دست کشیده‌ام. در هر مورد، تز بر اساس مفصل‌بندیِ خودش با خودش در تعارض است، نه از طریق ظهور انتی‌تزی که پاسخی از نقطه‌ای مقابل می‌دهد. این‌ها مواردی استثنایی نیستند، بلکه نمونه‌هایی‌اند از انچه ناگزیر برای هر تزی رخ می‌دهد. برای هگل، تز همواره تناقض خودش را تولید می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">درست همان‌طور که برای هگل تز منزوی وجود ندارد، انتی‌تز بیرونی و خارجی هم وجود ندارد. هگل تقابل را از طریق تناقضی که در آن نهفته تفسیر می‌کند. تناقض همان واقعیت بنیادین هستی‌شناختی است که تقابل {بیرونی -م} در خدمت پنهان‌سازی آن درمی‌اید. هنگامی که مخالفان هگل این شکاف درونی را به تقابل تز و انتی‌تز تبدیل می‌کنند، فلسفه او را هم به هدفی اسان‌تر بدل می‌سازند و هم ژست ایدئولوژیک بنیادینی‌ای را می‌گیرند که این فلسفه در پی مبارزه با آن است {کل هدف فلسفه هگل نشان‌دادن ضرورت هستی‌شناختی تناقض درونی است، در صورتی که سه‌‎گانه دوستان، هگل را به طرفدارِ تقابل‌های بیرونی معرفت‌شناختی، مثلا در ساحت اندیشه تقلیل می‌دهند -م}.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">ایدئولوژی تناقض‌ها را به تقابل {بیرونی م-} بدل می‌کند تا به ما دشمنی بدهد که پرخاش ناشی از شکست خودمان را متوجه آن کنیم. تناقض‌ها موضع‌ها را از درون تضعیف می‌کنند و آشکار می‌سازند که چطور از طریق منطق خودشان از این‌همانی با خویش بازمی‌مانند. تقابل‌ها به سوژه تصویری از هویتی پایدار می‌دهند که این شکست را محو می‌کند. مدیریت تقابل‌ها بسیار ساده‌تر است و برای سوژه‌ای که ان‌ها را در نظر می‌گیرد بسیار کمتر از تناقض‌ها تهدیدکننده‌اند. تقابل‌ها، همچون تقابل میان تز و انتی‌تز، جهان را به دوست و دشمن تقسیم می‌کنند. فلسفه هگل رد تمام‌عیار تقابل دوست و دشمن است، تا انجا که تقابل را نه تقابلی اصیل، بلکه صرفا شکلی می‌داند که تناقض به خود می‌گیرد. تقابل، تناقض را بیان می‌کند و هم‌زمان خودویرانگری آن را در پرده پیچیده و پنهان می‌کند. تقابل شاید فرد را به جنگ بکشاند، اما دشمنی بیرونی برای نبرد فراهم می‌آورد و حسی منسجم از هویت برای خود فرد می‌سازد، که مهم‌ترین کارکرد ایدئولوژیک آن است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">امروز ما پیکره تروریست‌های بنیادگرا را همچون نیرویی متقابل در برابر جهان سرمایه‌داری جهانی که به آن حمله می‌کنند برمی‌افرازیم. این تقابل برای کسانی که درون این جهان قرار دارند حسی از هویت می‌سازد و هم‌زمان هدفی به ان‌ها می‌دهد که کینه خود را بر سرش خالی کنند. اما این تقابل، تناقض‌های نظام سرمایه‌داری جهانی را که نفس وجود تروریسم به ان‌ها اشاره دارد پنهان می‌کند. اندیشه هگل از ما می‌خواهد که تصویر تقابل میان یک تزِ سرمایه‌داری جهانی و انتی‌تز تروریست بنیادگرا را رد کنیم تا بتوانیم تناقضی را ببینیم که در هر دو موضع خانه دارد. این هدف بنیادین فلسفی اوست.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">بررسی هگلی نظام سرمایه‌داری جهانی و تروریست نشان می‌دهد که در هر دو مورد، دشمنان ان‌ها از دل تناقض‌های خودشان بیرون می‌ایند. نظام سرمایه‌داری جهانی وعده شمول عام می‌دهد اما برای حفظ خود بر طرد سیستماتیک تکیه می‌کند. وقتی پیکره تروریست سر برمی‌آورد، این تناقض در یک تقابل محو می‌شود. از سوی دیگر، تروریست‌های بنیادگرا به نظامی حمله می‌کنند که اساس هویتشان را فراهم می‌کند. بنیادگرایی وعده بازگشت به نوعی ارزش‌های سنتی را می‌دهد، اما این ارزش‌ها اهمیت خود را تنها از طریق غیابشان در جهان سرمایه‌داری جهانی به دست می‌اورند. سرمایه‌داری جهانی با نابود کردن ارزش‌های سنتی، به این ارزش‌ها برای بنیادگرا اهمیت می‌بخشد. بازشناسی این امر ما را قادر می‌سازد ایدئولوژی تقابل را به چالش بکشیم. فلسفه تناقض هگل سوژه‌ها را از دشمنانشان محروم می‌کند، و این خود ان‌ها را از تصویر این‌همانی با خویش نیز محروم می‌سازد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">فلسفه هگل به‌شکلی نظام‌مند تناقضی را که در دل تقابل کمین کرده آشکار می‌کند. این فلسفه به ما امکان می‌دهد ببینیم که تقابل‌ها در واقع همان تناقض‌ها در لباس مبدل‌اند. کسانی که به چشم دشمن می‌بینیم اغلب روایت‌هایی از خودمان از اب درمی‌ایند (که این ضرورت مبارزه با ان‌ها را از بین نمی‌برد، بلکه فقط شرایط مبارزه را عوض می‌کند). هگل با تاکید بر تقدم تناقض نسبت به تقابل، از تمام فلسفه‌هایی می‌گسلد که هویت را از طریق تضاد میان خود و دیگری یا دوست و دشمن برقرار می‌کنند. در نتیجه، خوانش رایج از هگل که تناقض را بر حسب انتی‌تز تصور می‌کند، رادیکالیته او را به‌تمامی وامی‌نهد و به ما امکان می‌دهد دوباره به پیکره دشمن بازگردیم که هویت ما در تقابل با آن تعریف می‌شود.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اما مشکل اصلی با عنصر سوم شروع می‌شود. سنتز هم پرطرفدارترین اصطلاحی است که با نام هگل گره خورده و هم بیگانه‌ترین مفهوم با فلسفه او. از نظر هگل، حرکتی که از تناقض حاصل می‌شود، حرکتی ترکیب‌گرانه نیست. انچه هگل حل (Auflösung) تناقض می‌نامد، چنان‌که ایده سنتز القا می‌کند، از میان برداشتن تناقض از طریق عنصری سوم نیست. بلکه پذیرش (Versöhnung) تناقض است، بازشناسی این نکته که تناقض نه مسئله‌ای برای حذف شدن، بلکه نیروی محرکه تمام حرکت در هستی است. نمی‌توان به سنتزی رسید که تناقض را از میان بردارد، چون تناقض بنیادی‌ترین واقعیت تمام هستی است. این قلب فلسفه هگل است، همان چیزی که فرمول «تز، انتی‌تز، سنتز» یکسره به آن خیانت می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">برای کار کردن بر روی تناقض‌ها و رسیدن به این پذیرش، هگل ناگزیر باید از همان منطق صوری‌ای استفاده کند که در نهایت متناقض بودنش را آشکار می‌کند. این امر چنین القا می‌کند که فلسفهِ تناقضِ او خودش را تضعیف می‌کند - یا اینکه هگل از روی بی‌اعتقادی از گریزناپذیری تناقض دفاع می‌کند. اما استفاده او از منطق سنتی نه نمونه‌ای از خود-تناقض‌گویی است و نه ریاکاری فلسفی. علیرغم اینکه هر گزاره‌ای به تناقض می‌انجامد، ما همچنان می‌توانیم بیندیشیم و گزاره‌هایی صورتبندی کنیم که در چارچوب منطق صوری معنادار باشند. هگل برای توضیح این ناسازگاری، میان گزاره‌های عادی و گزاره‌های نظرورزانه<a href=\"#1\">[1]</a> تمایز قائل می‌شود: گزاره‌هایی که این‌همانیِ صوری را بیان می‌کنند و گزاره‌هایی که تناقض را بیان می‌کنند. گزاره‌های عادی از قواعد منطق صوری پیروی می‌کنند، حال‌انکه گزاره‌های نظرورزانه، این‌همانی در دل تفاوت را انتقال می‌دهند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">ما می‌توانیم این تمایز را در فصل آغازین علم منطق در حال کار ببینیم. هگل با گزاره‌ای عادی درباره نامتعینیِ هستی ناب شروع می‌کند. او می‌گوید: «هستی ناب در بی‌واسطگی نامتعین خود تنها با خود برابر است و نیز نسبت به دیگری نابرابر نیست؛ هیچ تفاوتی در درون خود ندارد، و هیچ تفاوتی رو به بیرون ندارد.». هستی ناب با خود این‌همان است و هیچ تفاوتی را شامل نمی‌شود. اما وقتی این گزاره را به شیوه عادی می‌خوانیم، تمایزِ هستیِ ناب از نیستی ناممکن می‌شود، نیستی‌ای که آن نیز هیچ تفاوتی در درون خود ندارد. این ناتوانی در تمایز گذاشتن میان هستی و نیستی، خوانشی نظرورزانه از گزاره اصلی ایجاد می‌کند، خوانشی که در آن می‌بینیم هستی ناب نفی خود را در درون خود جای داده است. هگل سپس نسخه نظرورزانه این گزاره را این‌گونه بیان می‌کند: «هستی ناب و نیستی ناب بنابراین یکسان‌اند.» این بیان این‌همانی هستی و نیستی، هم‌زمان بیانی از تفاوت ان‌هاست. ادعای یکسان بودن هستی و نیستی متناقض است، اما ما تنها با خواندن گزاره اولیه درباره خلوص هستی به‌مثابه گزاره‌ای عادی می‌توانیم به این تناقض برسیم. گزاره عادی ما را به سوی گزاره نظرورزانه هدایت می‌کند، درست همان‌طور که اصل عدم تناقض ما را به ضرورت تناقض می‌رساند. ما تناقض را در مسیر حرکت از گزاره عادی به گزاره نظرورزانه کشف می‌کنیم.&nbsp;</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">به‌جای سنتز کردن، منطق حرکت در اثار هگل عبارت است از دراماتیزه کردن یک موضع تا تناقض آن آشکار شود. در نمایشی که فلسفه او به راه می‌اندازد، هر موضعی گسست خود را آشکار می‌کند و نشان می‌دهد که به‌جای این‌همانی با خویش، با خودش در تعارض است. دراماتیزه کردن هر موضع را در معرض بحران خودش قرار می‌دهد. وقتی تناقض آشکار می‌شود، هگل به سراغ موضع بعدی می‌رود که از این تناقض خاص احتراز می‌کند. موضع جدید نه یک سنتز، بلکه چشم‌انداز دیگری است که از آن منظر، تناقض پیشین دیگر متناقض به نظر نمی‌رسد. این امر تناقضی سرسخت‌تر از کار درمی‌آورد، نه حذف تناقض را. در طول بسط نظام هگل، حل‌وفصل تناقض نه اسان‌تر، بلکه به‌طرز فزاینده‌ای دشوارتر می‌شود، تا انکه سرانجام به این بازشناسی می‌رسد که خودِ اندیشه - و در نهایت هستی - متناقض است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل علم منطق را با ایده مطلق به پایان می‌برد، که همان تصدیق اجتناب‌ناپذیر بودن تناقض است. او در این بحث دقیقا به همین نکته نظر دارد وقتی می‌گوید: «در واقع، اندیشیدنِ تناقض همان لحظه ذاتی مفهوم است.» همین که فرد ببیند تناقض دامی برای پرهیز نیست، بلکه «لحظه ذاتی مفهوم» است، کل رویکردش به طور ناگریزی تغییر خواهد کرد. فلسفه هگل با اندیشیدن در دل تناقض‌های پی‌درپی، به سوی بازشناسی این امر پیش می‌رود که تناقض مطلق است. این همان محتوای ایده مطلق است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">تفاوت میان گزاره عادی و گزاره نظرورزانه، تفاوتی عینی نیست. دو شیوه متفاوت برای نزدیک شدن به گزاره‌ها وجود دارد: می‌شود گزاره‌ها را یا عادی خواند یا نظرورزانه. گزاره‌های عادی که از تناقض می‌پرهیزند حتی برای فیلسوف نظری‌ای که قصد آشکار کردن ضرورت تناقض را دارد نیز ضروری‌اند. فرد باید کار را با عادی در نظر گرفتن گزاره‌ها آغاز کند تا بتواند کشف کند که ان‌ها در واقع نظرورزانه هستند. اگر کسی کار را با نظرورزانه گرفتن تمام گزاره‌ها (یعنی بیانگر تناقض بودن ان‌ها) شروع کند، به‌شکلی پارادوکسیکال تناقض را از دست می‌دهد، چون آن را همه‌جا می‌یابد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل در وهله نخست اعتبار گزاره‌های عادی را بر اساس شرایط خودشان می‌پذیرد. بدون این ژست، اصولا بیان هیچ ادعایی ناممکن می‌شد. به همین دلیل است که هگل در مقدمه پدیدارشناسی روح اصرار می‌ورزد که «اندیشه غیرنظرورزانه نیز حق خود را دارد.». این فقط یک امتیاز از سر اکراه به موضعی نیست که ترجیح می‌دهد نادیده‌اش بگیرد. او می‌بیند که تنها با گردن نهادن به اهمیت گزاره‌های عادی است که فرد گریزناپذیری تناقض را کشف می‌کند. بدون این مسیر انحرافی، هیچ دسترسی مستقیمی به تناقض یا اندیشه نظرورزانه وجود ندارد. جدی گرفتن گزاره عادی فیلسوف را به گزاره نظری می‌رساند. فرد منطق گزاره عادی را تا آن نقطه‌ای دنبال می‌کند که این گزاره در نهایت خود را تضعیف می‌کند و بنابراین دیگر عادی نیست. انجام این کار آشکار می‌کند که هر گزاره عادی در درون خود تناقض یک گزاره نظرورزانه را جای داده است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">تناقض به نظام هگل جان می‌بخشد. هدف حذف تناقض نیست، بلکه یافتن مسیری است برای حفظ آن. با این حال، حفظ آن مستلزم اندیشیدن در تمام مسیرهای بالقوه برای حذف آن است. فرد باید شکست تمام راه‌حل‌ها را بیندیشد تا بتواند تناقض را همچون امری فرارونده بازشناسد. تنها تصویر ممکن برای فراروی حقیقی از تناقض، مرگِ گرمایی جهان خواهد بود - پایان نهایی تمام حرکت و تغییر. این تنها راه برای تصور این‌همانیِ نا-متناقض است. اما اگر این رویداد رخ می‌داد، هیچ‌کس قادر به اندیشیدن به آن نمی‌بود. برخلاف کسانی که تناقض را خطایی در اندیشه و ناممکنی‌ای در هستی می‌بینند، هگل آن را واقعیتی گریزناپذیر در اندیشه و هستی می‌نگرد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>جان‌بخشی فلسفی</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">بنا بر تعریف هگل، تناقض عبارت است از ناتوانی هر چیز در این‌همان بودن با خودش. قانون این‌همانی، A = A، در جهان هگلی برقرار نیست. از نگاه هگل، دو A در این گزاره نمی‌توانند این‌همان باشند. صورت‌بندی این‌همانی ناگزیر خود این‌همانی را تضعیف می‌کند، چرا که تفاوت را وارد می‌کند، تفاوتی که نه بیرونی نسبت به این‌همانی، بلکه درونی آن است. این‌همانی از رهگذر تفاوت شکل می‌گیرد، و این همان چیزی است که قانون این‌همانی پنهان می‌کند. موجودیت‌ها، این‌همانی خود را از رهگذر کنشِ همان چیزی شدن به دست می‌اورند که نیستند، نه از طریق این‌همان با خود ماندن. برای یک موجودیت ناممکن است که صرفا همان چیزی که هست باقی بماند. درگیری با دیگربودگی برای انچه یک موجودیت هست و برای توانایی ما در اندیشیدن به آن موجودیت ذاتی است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">پذیرش تناقض از سوی هگل از این بازشناسی او ناشی می‌شود که هیچ موجودیت یا اندیشه‌ای از یک موجودیت را نمی‌توان از دیگربودگیِ او جدا کرد. در نتیجه، این‌همانی کامل ناممکن است، و حتی نحوه‌ای که ما قانون این‌همانی یعنی A = A را بیان می‌کنیم نیز این را لو می‌دهد. همان‌طور که رابرت هنا اشاره می‌کند، «هگل به تحلیلی بودن یا همان‌گویانه بودن قانون این‌همانی بدگمان است، زیرا معتقد است که خودِ فرم گزاره‌ای که یک این‌همانی در آن بیان می‌شود کافی است تا بر غیرتحلیلی بودن یا \"ترکیبی بودن\" گزاره دلالت کند.». درحالی‌که کانت بر تمایز قاطع میان گزاره‌های تحلیلی، که در ان‌ها محمول در موضوع مندرج است، و گزاره‌های ترکیبی، که در آن‌ها مندرج نیست، تکیه می‌کند، هگل مدعی است که تمام گزاره‌ها به معنایی ضرورتا ترکیبی‌اند. تایید این‌همانی با خود ناممکن است. حتی قانون این‌همانی نیز بی‌آنکه بداند خودش را نقض می‌کند.{کانت بین گزاره‌های تحلیلی و ترکیبی تمایز می‌گذارد. گزاره تحلیلی، گزاره‌ای است که دانش جدیدی ایجاد نمی‌کند، مثلا \"تمام افراد مجرد ازدواج نکرده‌اند.\". در صورتی که گزاره ترکیبی نیاز به این دارد که بررسی شود، مثل \"این فرد مجرد کچل است\". نبوغ هگل در این است که نشان دهد حتی گزاره‌های تحلیلی نیز ضرورتا ترکیبی هستند. مثلا در گزاره \"سگ، سگ است\"، \"است\" متضمن شکاف بین سگ اولی و سگ دومی است: برای اینکه اصلا بتوانیم گزاره‌ای درباره سگ بیان کنیم، از پیش سگ را یگانه فرض نکرده‌ایم، چون اگر سگ از پیش یگانه بود، دیگر نمی‌توانستیم گزاره‌ای درباره یگانه بودن او صادر کنیم. قانون هویت، خودش را لو می‌دهد، زیرا با برداشتن گام اول در نشان دادن معادل بودن یک چیز با خودش، از پیش فرض می‌گیرد که یک چیز با خودش برابر نیست، و سپس می‌تواند برابر نشان داده شود. -م}.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">وقتی مسئله هگل با قانون این‌همانی و اصل عدم تناقض را به این نحو بفهمیم، موضع او بسیار کمتر غیرقابل دفاع به نظر می‌رسد. اما این امر پیچشی در منطق سنتی ایجاد می‌کند که بااین‌حال بسیاری هضمش را دشوار می‌یابند. دقیقا همین رد قانون این‌همانی و اصل عدم تناقض از سوی هگل است که او را به چهره‌ای تفرقه‌انگیز در تاریخ فلسفه بدل می‌کند. اما این در عین حال کلید اهمیت اوست. مداخله هگل تفرقه‌انگیز است چرا که او نمایانگر گسستی مطلق با منطق و هستی‌شناسی سنتی است. سرمایه‌گذاری او بر گریزناپذیری تناقض آشکار می‌کند که منطق و هستی‌شناسی را نمی‌توان از هم جدا نگه داشت، اینکه منطق دلالت‌های هستی‌شناختی دارد و برعکس.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">پروژه او نه ساختن موقعیتی هرچه مستحکم‌تر برای خود از طریق فتح تناقض‌های پیاپی، بلکه به‌طور پیوسته از بین بردن امکان‌های گریز از تناقض است. اندیشه ما نه برای آن پیش می‌رود که از تناقضی که با آن روبروست بگریزد، بلکه از آن رو که دیگر نمی‌تواند آن تناقض را همچون تناقض حفظ کند. همین‌که با هر تناقضی درگیر می‌شویم و به چگونگی ظهورش می‌اندیشیم، آن تناقض به‌قدر کافی مسئله‌ساز بودنش را از دست می‌دهد و دیگر توجه اندیشه را جلب نمی‌کند. حل شدن هر تناقض نشانه نهایتا تهی‌بودگی و نابسندگی آن برای اندیشه است. حل‌های پیاپی به تناقض‌هایی هرچه جذاب‌تر می‌انجامند. اندیشه از این رو پیش می‌رود که بتواند همچنان درگیر تناقض بماند. خود هگل هرگز این را مستقیما به‌عنوان پروژه خود بیان نکرد، اما اگر به ساختار اندیشه‌اش توجه کنیم، ندیدنش ناممکن می‌شود. تناقض برای هگل حتی مهم‌تر از آن است که خود می‌پنداشت.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">می‌توانیم این را در حرکت گسترده‌ای که به علم منطق جان می‌بخشد در حال کار ببینیم. هگل از بحث درباره تعین‌های مختلف هستی در بخش بزرگ نخست کتاب به بحث درباره ذاتی که در زیر هستیِ صرف نهفته است در بخش دوم حرکت می‌کند. هستی تنها به تعین‌های بی‌واسطه‌ای چون کمیت و کیفیت اشاره دارد، حال‌آنکه ذات<a href=\"#2\">[2]</a>&nbsp;شامل تعین‌هایی است که پایدار می‌مانند و تمایز بیشتری ایجاد می‌کنند. می‌توان تناقض‌های هستی را آسان‌تر از تناقض‌های ذات حل کرد، و به همین دلیل است که بحث ذات پس از بحث هستی در کتاب می‌اید.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">ذات همچون مقوله‌ای سر برمی‌آورد که تناقض‌های اندیشیدن به موجودیت‌ها صرفا بر حسب هستی‌شان را حل می‌کند. ذات پایدارتر از هستی است؛ در طول زمان می‌پاید. در نخستین فصل «آموزه ذات»، هگل ذات را در رابطه با نمود (Schein) نظریه‌پردازی می‌کند، که همان نحوه‌ای است که ذات خود را به‌طور بیرونی آشکار می‌کند. ذات همچون نفی متعین هستی آغاز می‌شود، اما این نفی نیازمند هستی‌ای بی‌واسطه یا نمودی است که خود را در برابر آن تعریف کند. این تمایزگذاری، جزئی جدایی‌ناپذیر از ذات است. نمود بیرون از ذات نیست، حتی اگر ما نسبت نمود و ذات را بر حسب تقابل بیندیشیم. یعنی شاید بگوییم این چیز نمود یک میز پاتختی را دارد، اما ذاتا یک میز قهوه است. بااین‌حال، بدون نمود، نمی‌توان ذات را کشف کرد. برای وضع ذات یک میز، باید آن را از نحوه‌ای که میز به نظر می‌رسد متمایز کرد، وگرنه تمایز ذات بی‌معنا خواهد بود.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">تناقض از آنجا سر برمی‌آورد که بنا بر منطق ذات، نمود هیچ ارزشی ندارد. و با این حال، نمود همان نحوه‌ای است که ذات خود را آشکار می‌کند. برای اندیشیدن به ذات میز، فرد باید بتواند آن را در تقابل با نمود قرار دهد. بدون نمودِ غیرذاتی، ذاتی در کار نیست. منطق ذات، نمود بی‌واسطه را در نفس خود هیچ می‌انگارد، اما با این حال آن را برای آشکار شدن ذات ضروری می‌داند. این همان تناقضی است که ذات در نخستین مفصل‌بندی خود با آن روبرو می‌شود. حل این تناقض از رهگذر چرخش به سوی بازتاب رخ می‌دهد، چرخشی که در آن ذات، همان هستی بی‌واسطه‌ای را وضع می‌کند که همچون نمود آن عمل می‌کند. پس از این چرخش، بازتاب نمود را در درون فعالیت ذات جای می‌دهد. وقتی به بازتاب می‌رسیم، این واقعیت که میز قهوه نمودی از یک میز پاتختی دارد، دیگر نه امری کاملا منفک از ذات میز قهوه، بلکه بخشی از ذات آن است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">بدین ترتیب، آموزه ذات از نمود به سوی انچه هگل تعین‌های بازتاب می‌نامد حرکت می‌کند، جایی که نمود در ذات مندرج می‌شود. حلی که بازتاب برای تناقض نمود عرضه می‌کند، خود به تناقضی بعدی می‌انجامد که حل آن دشوارتر است. {ذات، در گام اول تصور می‌کند که چیزی است فرای پدیدارِ صرف هستی. اما با مثال میزها می‌توان نشان داد که اینطور نیست: زمانی که فردی مثلا در تاریکی، تصور می‌کند که میز پاتختی است که جلوی او قرار گرفته و نه میز قهوه. اشتباه گرفتن نمودها، جزئی از ذات است، زیرا ذات با خودش این‌همان نیست. تمایز و افتراق نمودها هستند که چیستی ذات را بیان می‌کنند. فقط با اشتباه کردن در تشخیص درستِ میز پاتختی بود که فرد می‌فهمد چیزی که جلوی او قرار دارد، میز قهوه است. ذات میز قهوه، به تمایزی در سطح نمود چیزها وابسته است که در وهله اول تصور می‌کرد نسبت به آن خارجی است. همین نکته، ذات را وابسته به چیزی می‌کند که قصد داشت خودش را فرای آن قرار دهد: ذات به نمود وابسته می‌شود. روندی که طی آن ذات وابستگی خویش را به نمود به رسمیت می‌شناسد، بازتاب نام دارد. اما این تناقض جدیدی را بوجود می‌آورد، تناقضی که هگل را مجبور می‌کند از منطق ذات به منطق مفهوم برود. -م}.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">پدیدارشناسی روح نیز درست همین ساختار کلی را به نمایش می‌گذارد. کتاب هرچه پیش می‌رود دشوارتر می‌شود، چرا که حل تناقض‌ها نیز به‌طرز فزاینده‌ای دشوارتر می‌گردد. هگل با اگاهی آغاز می‌کند، که تناقض‌هایی دارد به‌اسانی قابل حل. در فصل آغازین بخش «اگاهی»، یقین حسی از امور عام می‌پرهیزد و با این حال ناگزیر است برای بیان مدعیات خود به ان‌ها تکیه کند. در اینجا تناقض و نیز حل آن از رهگذر چرخش به ادراک آشکار است. «خوداگاهی» تناقض‌های دشوارتری پیش می‌کشد، چرا که میل سوژه باید با سرمایه‌گذاری‌اش بر دیگری کنار بیاید. پیشروی‌ها از خلال «عقل» و «روح»، بخش‌های بزرگ بعدی، سوژه را به‌نحوی فزاینده در تعارض با خودش آشکار می‌کنند، تا انکه به فصل پایانی بخش «دین» می‌رسیم. هگل در بحث خود از «دین مکشوف»، غایی‌ترین تناقض قابل تصور را توصیف می‌کند. مسیر بخش‌های بزرگ پدیدارشناسی روح از تناقض‌های ساده به سوی تناقض‌هایی می‌رود که هرچه بیشتر در برابر حل شدن مقاومت می‌کنند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">این پویایی در درون هر بخش نیز قابل مشاهده است. برای نمونه، هگل در بحث خود از خوداگاهی، حرکت از رواقی‌گری به شکاکیت را همچون تغییری در رابطه با جهان بیرونی توصیف می‌کند. رواقی‌گری از جهان بیرونی عقب‌نشینی می‌کند و آن را در قیاس با جهان درونی، که تمام ارزش را در آن می‌نهد، بی‌ارزش می‌شمارد. بدین ترتیب، یک رواقی، همچون اپیکتتوس، می‌تواند برده باشد و کاملا خرسند بماند. اپیکتتوس بردگی خود را صرفا بیرونی و در نتیجه بی‌اهمیت می‌بیند. اما جهان بیرونیِ به‌ظاهر بی‌ارزش در واقع تمام محتوای جهان درونی را فراهم می‌کند. رواقی‌گری منحصرا بر انچه نفی می‌کند متمرکز می‌شود و از این راه به جهان بیرونی ارزشی مطلق می‌بخشد. اپیکتتوس با تمرکز بر اینکه بردگی‌اش چقدر برایش بی‌اهمیت است، ناخواسته به آن اهمیت می‌دهد. این نحوه ارزش‌گذاری با انچه رواقی درباره موضع خود مدعی است تناقض دارد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">درست همان‌طور که در منطق، بازتاب، تناقضِ نمود را حل می‌کند، چرخش به شکاکیت درباره جهان بیرونی - این موضع که ما نمی‌توانیم این جهان را بشناسیم - تناقض رواقی‌گری را حل می‌کند. این چرخش جهان بیرونی را در معرض تردید قرار می‌دهد تا وابستگی سوژه را به آن قطع کند. برخلاف رواقی، شکاک محتوای تجربه خود را در جهان بیرونی کشف نمی‌کند، چرا که از هرگونه تلاش برای شناخت آن جهان دست می‌شوید. شکاک همچنان دلمشغول جهانی است که مدعی است نمی‌شناسد، هرچند این دلمشغولی کمتر از مورد رواقی آشکار است. شکاک ادعا می‌کند که جهان بیرونی شناخت‌ناپذیر است، نه اینکه صرفا مانند رواقی از آن روی برگرداند. در نتیجه، تناقضی پدید می‌اید که حل آن دشوارتر است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">این حرکت به سوی تناقض‌هایی که به‌طرز فزاینده‌ای سرسخت‌تر می‌شوند، در بحث هگل از هنر به روشن‌ترین شکل خود می‌رسد. هگل در تحلیل خود از فرم‌های خاص هنر، با معماری آغاز می‌کند و با شعر به پایان می‌برد. معماری نه از آن رو نقطه آغاز هنر است که به‌لحاظ تاریخی نخستین باشد - هگل اصلا به این پرسش توجهی ندارد - بلکه از آن رو که روشن‌ترین شکل تناقض را فراهم می‌کند. در مورد معماری حتی لازم نیست فیلسوف باشی تا آن را بازشناسی کنی. هر کسی می‌تواند خود-شکافتگیِ اثر هنری معماری را ببیند: همچون تمام اثار هنری، معماران مسئله سوبژکتیویته را از رهگذر اثر هنری بیان می‌کنند، اما در مورد معماری این بیان در فرمی مادی رخ می‌دهد که کاملا با سوبژکتیویته بیگانه است. خطوط ساختمان مادی باید نا-مادیت سوژه را آشکار سازد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">مجسمه‌سازی نیز سوبژکتیویته را همچنان در فرمی مادی بیان می‌کند. بااین‌حال، این فرم، به فرمِ خود سوژه بدل می‌شود، که همین تناقض را دشواریاب‌تر و حل آن را دشوارتر می‌کند. در نقاشی، تکینگی سوژه در تقابل با انتزاع مجسمه‌سازی سر برمی‌آورد. سپس موسیقی تجلی مادی را یکسره حذف می‌کند. در مسیر پیشروی از خلال هر یک از این هنرها، مانعی میان سوبژکتیویته و تجلی آن از میان برداشته می‌شود. در نتیجه، تناقض کمتر آشکار و در عین حال سرسخت‌تر می‌گردد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل فلسفه هنر خود را با شعر به پایان می‌برد. شعر هیچ مانعی میان سوژه و تجلی هنری‌اش باقی نمی‌گذارد. شاید چنان انتظار برود که نتیجه بیان کامل سوبژکتیویته توسط شعر یا سوبژکتیویته بودن شعر است، اما شعر ما را قادر می‌سازد تا این نکته را بازشناسیم که ازخودبیگانگیِ سوژه محصول فرم هنری‌ای نیست که به کار می‌گیرد. سوژه حتی در فرمی که کاملا در خانه خود است نیز از خود جدا افتاده. حتی در زبان، بدون هیچ زیرلایه مادی، سوژه در اثر هنری با خود بیگانه می‌ماند. اما در این فرم، تناقض دیگر همچون معماری بدیهی نیست. تناقض در درون خود فرم ظاهر می‌شود - برای نمونه در نبرد میان انتیگونه و کرئون - و برای آشکار شدن نیازمند تفسیر است. شعر تناقض معماری را حذف نمی‌کند، بلکه آشکار می‌سازد که غلبه بر تناقض به‌مثابه تناقض، ناممکن است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">یک پیشروی دیالکتیکی، آنگونه که هگل تصور می‌کند، گامی است در جهت تناقض مطلق، نه حرکتی ترقی‌جویانه به سوی حذف تناقض. یگانگی‌ای که در پایان هر فرایند دیالکتیکی رخ می‌دهد، تناقض را از میان برنمی‌دارد، بلکه پذیرشی با آن برقرار می‌کند. انچه هگل یگانگی می‌نامد، به‌جای ترکیب دو موضع متقابل، متضمن این بازشناسی است که موضع، اساسا با خودش در تقابل است، که خود را در چیزی که نیست درگیر می‌کند. یگانگی، تناقض را همچون فرم برسازنده‌ای که این‌همانی به خود می‌گیرد تثبیت می‌کند. تناقض هم این‌همانی سوژه را تضعیف می‌کند و هم آن را تعریف می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هنگامی که اندیشه به مطلق می‌رسد و بدین ترتیب به تمامیت‌بخشی دست می‌یابد، وضعیت تناقض دستخوش دگرگونی‌ای بنیادین می‌شود. در نقطه مطلق، اندیشه دیگر نمی‌تواند از طریق یک حرکت دیالکتیکی دیگرِ اندیشه به دنبال حل تناقض باشد. در پایان فلسفه هگل، دیگر جایی برای رفتن باقی نمانده، چرا که هگل تمام حل‌های منطقی ممکن را کاویده است. هرچند بی‌گمان امکانات تجربی دیگری وجود دارند، هیچ‌یک نوید راه‌حلی تازه برای برون‌رفت از تناقض نمی‌دهند. مطلق چیزی جز این تصدیق نیست که تناقض غیر قابل غلبه است. در موضع مطلق، ما بازمی‌شناسیم که هرگز نمی‌توانیم تناقض را حذف کنیم، هرچقدر هم که برای این کار طولانی یا سخت تلاش کنیم.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">مطلق در اثار هگل فرم‌های مختلفی به خود می‌گیرد، اما نکته‌ای که اعلام می‌کند همواره یکسان است. در پدیدارشناسی، شناخت مطلق، بازشناسی این است که فرد هرگز نمی‌تواند بر تناقض غلبه کند، چرا که تناقض در درون خودِ هستی جای دارد، که تناقض نه فقط شکست خود سوژه، بلکه شکستی در هستی است. در منطق، ایده مطلق این ایده است که تناقض برای این‌همانی ذاتی است. فریب بنیادینی که هگل با مطلق آشکار می‌کند این است که اندیشه به دنبال حل تناقض‌هایی است که با ان‌ها روبرو می‌شود. اندیشه به‌جای جستجوی رهایی از تناقض، راهی برای حفظ و تشدید تناقض می‌یابد. ما هگل را کاملا بد می‌فهمیم وقتی او را فیلسوفی می‌بینیم که حرکت اندیشه را از طریق حذف تناقض تبیین می‌کند. اندیشه از این رو حرکت می‌کند که تناقضی جدید کشف کند که در برابر حل شدن مقاوم‌تر از تناقض پیشین باشد. مطلق پایان این جست‌وجوست.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>گام نهادن و ننهادن در رودخانه</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">فلسفه تناقض هگل، خودبه‌خود و بی‌هیچ پیشینه‌ای سر برنمی‌آورد. هرچند تاریخ فلسفه از ارسطو به بعد به اصل عدم تناقض همچون بنیاد خود اندیشه می‌چسبد، هگل متفکری پیش از ارسطو می‌یابد که درک خود او از اینکه چگونه تناقض، تمام این‌همانی را تضعیف می‌کند و در واقع اندیشه را ممکن می‌سازد، پیشاپیش در اندیشه او حضور دارد. همین توضیح می‌دهد که چرا هگل وقتی در روایت خود از تاریخ فلسفه به هراکلیتوس می‌رسد، تا این اندازه سرخوش به نظر می‌رسد. هگل ورود فلسفه هراکلیتوس را با شور و شوقی اعلام می‌کند که برای هیچ فیلسوف دیگری از خود نشان نمی‌دهد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل نه‌تنها معتقد است که هراکلیتوس نمایانگر جهشی رو به جلو فراسوی پارمنیدس و زنون (هم‌عصران فلسفی‌اش) است، بلکه او را منبع‌ای بارور برای بسط نظام فلسفی خود می‌بیند. هگل وقتی شروع به بحث درباره هراکلیتوس در تاریخ فلسفه می‌کند، بانگ برمی‌آورد: «اینجا زمین را می‌بینیم: هیچ گزاره‌ای از هراکلیتوس نیست که من آن را در منطق خود اتخاذ نکرده باشم.» هرچند تنها پاره‌هایی اندک از فلسفه او باقی مانده، و هرچند او بیش از بیست‌وسه قرن پیش از هگل می‌زیست، بااین‌حال هراکلیتوس از نظر هگل متفکری است که می‌تواند به جهان مدرن چیزی عرضه کند. هراکلیتوس مدلی برای اندیشه نظرورزانه فراهم می‌کند - اندیشه‌ای که این‌همانی متناقضِ این‌همانی و نااین‌همانی را درمی‌یابد - مدلی که هگل آن را به کار خواهد گرفت.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اما هگل برای اینکه بتواند در فلسفه هراکلیتوس مدلی برای فلسفه خود بیابد، باید از برداشت رایج از او همچون متفکر سیلان عام فراتر برود. شیوع این برداشت عمدتا از نقشی ناشی می‌شود که پاره ۹۱ در تصور ما از هراکلیتوس ایفا می‌کند. در این پاره مشهور، او می‌گوید: «نمی‌توان دو بار در یک رودخانه قدم گذاشت.» مشکلِ در نظر گرفتن این پاره همچون پاره‌ای نمونه این است که آن را تاییدی ساده بر جریان زمان جلوه می‌دهد، نه بیانی از گریزناپذیری تناقض. در تغییر دائمی هیچ چیز متناقضی وجود ندارد، به‌ویژه وقتی به این نحو بیان شود. این گزاره بیشتر عقل سلیم به نظر می‌رسد تا فلسفه. اما وقتی فرد به دیگر پاره‌های هراکلیتوس که با همین کنش سروکار دارند نگاه کند، تناقضی که او نظریه‌پردازی می‌کند روشن‌تر می‌شود.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">پاره مشهور ۹۱ به تناقض اشاره می‌کند اما بر آن تاکید نمی‌گذارد. می‌شود این پاره را خواند و نتیجه گرفت که اساسا هیچ این‌همانی‌ای وجود ندارد، و تمام ادعاهای این‌همانی صرفا توهمات ما هستند. اما در پاره کمتر شناخته‌شده اما مرتبط ۴۹a، هراکلیتوس اصرار می‌ورزد که این‌همانی وجود دارد، هرچند این این‌همانی خود را در تفاوت درگیر می‌کند. با نگاه به این پاره به‌جای همتای مشهورترش، می‌توانیم بینشی درباره پیوند میان هراکلیتوس و هگل به دست اوریم که در غیر این صورت پنهان می‌ماند. هراکلیتوس می‌گوید: «ما در یک رودخانه‌ها، هم قدم می‌گذاریم و هم نمی‌گذاریم؛ ما هستیم و نیستیم.». در اینجا، هراکلیتوس تناقض را مستقیما بیان می‌کند. او این‌همانی را از رهگذر تناقضی که تضعیفش می‌کند بیان می‌کند، به‌جای انکه این‌همانی را کاملا در سیلان تفاوت‌ها مستحیل کند، چنان‌که پاره مشهورتر القا می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">وقتی هگل از نحوه بدفهمی تاریخی فیلسوفان از هراکلیتوس سخن می‌گوید، گویی دارد از بدفهمی‌ای حرف می‌زند که بعدها گرد اندیشه خود او را خواهد گرفت. دیگر فیلسوفان از ابهام فلسفه هراکلیتوس و دشواری فهم آن ناله می‌کنند، درست همان‌طور که فیلسوفان بعدی از دست هگل ناله کرده‌اند. ارسطو، ابهام سبک هراکلیتوس را به حساب فقدان نشانه‌گذاری درست می‌گذارد که دلالت را سخت می‌کند، درحالی‌که سیسرون معتقد است هراکلیتوس از قصد جوری می‌نویسد تا مبهم باشد. اما برای هگل، راه‌حل روشن است. هراکلیتوس، مانند خود هگل، از این رو مبهم است که فیلسوفی نظرورزانه است، فیلسوفی که ناممکنیِ حفظ هرگونه اصل انتزاعی‌ای را می‌بیند که در نهایت متناقض از اب درنیاید.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">پیشرفت بزرگی که هراکلیتوس رقم می‌زند این است که تناقض را به فلسفه وارد می‌کند و بدین ترتیب از موضع این‌همانی انتزاعی‌ای که در میان هم‌عصران پیشاسقراطی‌اش غالب است می‌گسلد. هراکلیتوس به‌جای انکه مانند اناکسیماندر وجود جوهری عام بدون کیفیات را تصدیق کند، یا مانند پارمنیدس یگانگی تمام هستی را، فلسفه را همچون بازشناسی این امر درمی‌یابد که تناقض به هستی جان می‌بخشد. او اصلی بنیادین ندارد که اندیشه‌اش با آن آغاز شود، بلکه در عوض به تناقض‌هایی توجه می‌کند که هر اصل بنیادینی را در بر می‌گیرند، رویه‌ای که هگل بعدها آن را نظام‌مند خواهد کرد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اما با وجود تمام اهمیتی که هراکلیتوس در بسط فلسفه خود هگل دارد، او از محدودیت‌های یک متفکر پیشامدرن رنج می‌برد. هرچند هگل تصریح می‌کند که «با هراکلیتوس، ایده فلسفی را باید در فرم نظرورزانه‌اش یافت،» اما او همچنین می‌بیند که باید فرم اندیشه هراکلیتوس را اصلاح کند - ناتوانی آن در اندیشیدن به مفهوم. هراکلیتوس در حرکت از بازشناسی تناقض به بازشناسیِ اینکه این، ساختارِ خودِ مفهوم است ناکام می‌ماند. در فلسفه هراکلیتوس هیچ نظریه‌پردازی‌ای درباره ظرفیت سوژه برای تصدیق تناقض وجود ندارد. این نظریه‌پردازی به نقطه عزیمت نظام هگل بدل می‌شود. هگل تناقض را از رهگذر سوبژکتیویته تفسیر می‌کند، نه اینکه آن را مستقیما در جهان طبیعی بخواند، چنان‌که هراکلیتوس می‌کند. توانایی سوژه در بازشناسی تناقض، او را از ابژه‌های درون جهان متمایز می‌کند. کنش بازشناسی تناقض، سوژه را به نحوی تغییر می‌دهد که هراکلیتوس پیش‌بینی‌اش نمی‌کند و هگل آن را بسط می‌دهد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>معاشقه هگل با حماقت</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اصرار هگل بر واقعیت تناقض، او را در معرض نقدی کوبنده قرار می‌دهد: این کار بنیاد منطق را نقض می‌کند. برتراند راسل در چندین اثر مختلف، مشخصا هگل را به خاطر انحراف از قواعد منطق صوری و نتایج بی‌معنای حاصل از آن هدف می‌گیرد. راسل به چندین خطا اشاره می‌کند، اما یک اشتباه خاص تعیین‌کننده است - و آن هم اشتباهی ابتدایی است. به گفته راسل، تمام بنای فلسفی هگل نتیجه خلط یک کاربرد رابط (حمل<a href=\"#3\">[3]</a>) با کاربردی دیگر (این‌همانی<a href=\"#4\">[4]</a>) است، درحالی‌که راسل بر تمایز مطلق میان این دو اصرار دارد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">راسل استدلال می‌کند که وقتی ما از رابط برای حمل بر موضوع استفاده می‌کنیم (مثل گفتن اینکه سقراط فانی است)، کاری کاملا متفاوت انجام می‌دهیم تا وقتی که از رابط برای نامیدن یک این‌همانی استفاده می‌کنیم (مثل این‌همان‌سازی سقراط با یک فیلسوف یونان باستان). راسل در شناخت ما از جهان بیرونی ادعا می‌کند که هگل این دو کاربرد را با هم خلط می‌کند و «به سبب همین خلط است که فکر می‌کند \"سقراط\" و \"فانی\" باید این‌همان باشند. از آنجا که می‌بیند این‌ها متفاوتند، نتیجه نمی‌گیرد، آنچنان که دیگران می‌گیرند، که یک جای کار اشتباه است، بلکه نتیجه می‌گیرد که \"این‌همانی در تفاوت\" را به نمایش می‌گذارند.». راسل «این‌همانی در تفاوت» را نه فقط به این دلیل در گیومه می‌گذارد که دارد از هگل نقل قول می‌کند، بلکه به این دلیل که می‌خواهد نشان دهد این طرز فکر چقدر مسخره است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">منطق ضدهگلی راسل می‌کوشد حمل را از این‌همانی جدا کند. بنا بر منطق صوری راسل، ادعای اینکه «لئونارد نیموی فانی است» نمونه‌ای از حمل است، حال‌انکه گفتنِ «لئونارد نیموی بازیگری است که نقش اسپاک را بازی کرد» موردی از این‌همانی است. این تمایز به راسل امکان می‌دهد از تناقضی که هگل در گزاره «لئونارد نیموی فانی است» در کار می‌بیند احتراز کند. برای راسل، این تصور که اصلا بشود چنین چیزی را تناقض در نظر گرفت، گویای اشفتگی مطلق خود هگل درباره شیوه‌های متمایز عملکرد رابط است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">شاید بشود به دفاع از هگل چنین گفت که هر گزاره حملی متضمن این‌همانی‌ای پیشینی است که پیش‌فرض گرفته شده. فرد باید بداند دارد درباره چه چیزی حرف می‌زند پیش از انکه محمولی به آن حمل کند، و این مستلزم این‌همان‌سازی آن است. همان‌طور که هگل در بحث «یقین حسی» در پدیدارشناسی روح نشان می‌دهد، اشاره کردن به یک موجودیت به هیچ‌وجه این مسئله این‌همان‌سازی را که تمام حمل بر آن استوار است حل نمی‌کند. فرد همواره باید بداند به کدام ابژه مشخص اشاره می‌کند، و این مستلزم کنش این‌همان‌سازی است. افزون‌براین، فرد باید بتواند محمولی را که به کار می‌گیرد نیز این‌همان‌سازی کند. راسل هم این‌همانی موجودیت و هم این‌همانی محمول را پیش‌فرض می‌گیرد، در نتیجه تلاش او - تلاشی همراه با تمام منطق صوری - برای فهم گزاره بیرون از هر بستر اجتماعی-تاریخی. حمل به‌هیچ‌روی امری ساده نیست. وابستگی آن به بستر، درگیری‌ای است در تناقض، هرچقدر هم که راسل دلش بخواهد چنین نباشد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">مسئله این است که گزاره‌های ساده حملی، برخلاف ادعای راسل، به ما نمی‌گویند یک چیز چیست. این اساس دفاع رابرت پیپین از هگل در برابر حمله راسل است. پیپین مدعی است که گزاره‌های حملی «بی‌دانش» هستند و برای دانش‌دار شدن نیازمند متمم یک گزاره این‌همانی‌اند. از نظر پیپین، گزاره این‌همانی پیش‌شرط ضروری گزاره حملی است. ما فقط می‌توانیم چیزی را حمل کنیم که پیشاپیش این‌همان‌سازی‌اش کرده‌ایم. در نتیجه، تلاش راسل برای احتراز از تناقض با جدا کردن حمل و این‌همانی فرو می‌پاشد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هرچند این دفاع از هگل قانع‌کننده است (و با موفقیت نقد راسل را دفع می‌کند)، اما اثر آن به حداقل رساندن رادیکالیته تلقی هگل از این‌همانی است. برای هگل، اصلا چیزی به نام گزاره‌ای که با موفقیت این‌همانی را بیان کند وجود ندارد. تمام گزاره‌ها گزاره‌های حملی‌اند، حتی ان‌هایی که در کسوت گزاره‌های این‌همانی ظاهر می‌شوند، چرا که هر گزاره‌ای به دیگربودگی ارجاع می‌دهد. یا به بیانی دیگر، هیچ حقیقت تحلیلیِ نابی وجود ندارد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">گزاره‌های حملی، برخلاف گزاره‌های این‌همانی، به‌روشنی متضمن تفاوت‌اند. گفتن اینکه «لئونارد نیموی فانی است» یا «لئونارد نیموی قدبلند است» یعنی وارد کردن تفاوت از رهگذر محمول. فانی‌بودگی و قدبلندی مقولاتی هستند که بر موجودیت‌هایی غیر از لئونارد نیموی نیز اطلاق می‌شوند. برای اینکه بفهمیم این‌ها چه نسبتی با او دارند، باید ان‌ها را در بسترهای مختلفی درک کنیم. ما به دیگر فانی‌ها و دیگر موجودات قدبلند می‌اندیشیم، همگی در این محمول‌ها که بر لئونارد نیموی حمل می‌شوند مستترند. حمل، برای هگل، اگر واقعا به آن توجه کنیم، کاری پیچیده است. این واقعیت که محمول‌ها باید در بسترهای دیگر نیز به کار روند تا وقتی بر لئونارد نیموی حمل می‌شوند معنادار باشند، آشکار می‌کند که حمل نمی‌تواند از دیگربودگی بپرهیزد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">وقتی به گزاره‌های به‌اصطلاح این‌همانی روی می‌اوریم، بنا بر منطق هگل همان پویایی را می‌یابیم. «لئونارد نیموی بازیگری است که نقش اسپاک را بازی می‌کند» فرم استانداردی از گزاره این‌همانی است (شبیه مثال مورد علاقه خود راسل: «اسکات نویسنده ویورلی است»). لئونارد نیموی صرفا همان بازیگری است که نقش اسپاک را بازی می‌کند، و این گزاره هیچ تعین اضافه‌ای به موضوعِ لئونارد نیموی نمی‌افزاید. اما در واقع، بازی نیموی در نقش اسپاک مستلزم حمل و در نتیجه مستلزم تفاوت هست. هرچند نیموی و بازیگری که نقش اسپاک را بازی می‌کند دقیقا همان شخص واحدند، گزاره به‌اصطلاح این‌همانی بااین‌حال تفاوت حمل را وارد می‌کند، از آن جهت که به‌طور ضمنی او را به دیگر بازیگرانی که نقش‌های دیگر را بازی می‌کنند ربط می‌دهد. این نه ویژگی تصادفی این مثال، بلکه در مورد تمام گزاره‌های این‌همانی، از جمله مثال خود راسل درباره والتر اسکات، صادق است. برای هگل، این‌همانی نمی‌تواند از رهگذر یک گزاره یا قضیه حاصل شود، چرا که این فرم از بیان کافیِ ساختار متناقض این‌همانی ناتوان است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">این‌همانی نه در نتیجه یک گزاره این‌همانی یا چندین گزاره حملی، بلکه از رهگذر شکست گزاره‌های حملی سر برمی‌آورد. این همان نتیجه تکان‌دهنده رد گزاره این‌همانی از سوی هگل است. محمول‌ها ویژگی‌هایی را که یک موجودیت دارد به ما می‌گویند، اما آن را این‌همان‌سازی نمی‌کنند. یک موجودیت می‌تواند همه ویژگی‌های موجودیت دیگری را (مثلا در کلون‌های کامل یا دیگر تمایزناپذیرها) داشته باشد بی‌انکه با آن این‌همان باشد. این نحوه خاص شکست حمل است که به موجودیت، این‌همانی‌اش را می‌دهد. هگل در منطق می‌نویسد: «این‌همانی عبارت است از جدایی به‌مثابه جدایی، یا بودنِ اساسا در جدایی، یعنی برای خود هیچ نیست، بلکه لحظه جدایی است.» ان‌گاه که محمول‌ها شکست می‌خورند، جدایی از ان‌ها رخ می‌دهد و این‌همانی سر برمی‌آورد. به این معنا، این‌همانی تنها از رهگذر تناقض فرا می‌رسد و هرگز از طریق یک گزاره ایجابی فرا نمی‌رسد. این‌همانی نفی محمول‌های یک موجودیت است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">نکته اصلی این نیست که هیچ محمولی نمی‌تواند غنای یک موجودیت را تسخیر کند، بلکه این است که هیچ موجودیتی نمی‌تواند هیچ‌یک از محمول‌هایش را به‌تمامی تجسم ببخشد. به همین دلیل است که شکست حمل، این‌همانی را فراهم می‌کند. فرد آنچه را یک موجودیت هست از رهگذر نحوه خاصی که آن موجودیت در انچه برسازنده‌اش است ناکام می‌ماند کشف می‌کند. پس بجاست که لئونارد نیموی وقتی خواست خود را به جهان بشناساند، این کار را با کتابی به نام من اسپاک نیستم انجام داد. این‌همانی نیموی عبارت است از ناتوانی‌اش در اسپاک بودن، در جدایی‌اش از این محمول.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل این‌همانی را به‌جای گزاره‌های ایجابی در جدایی جای می‌دهد، زیرا محدودیت‌های تمام این‌گونه گزاره‌ها را بازمی‌شناسد. تلاش برای این‌همان‌سازی مستقیم یک موجودیت یا حتی توصیف کامل آن همواره به مسیر کژاین‌همان‌سازی می‌انجامد. هگل به‌جای انکه در پی اصلاح براید، کژاین‌همان‌سازی را همچون تنها شکل ممکنی که این‌همان‌سازی می‌تواند به خود بگیرد می‌پذیرد. او بدین ترتیب می‌کوشد روشن سازد که صرفا چرند نمی‌بافد، حتی اگر راسل از دیدن این ناتوان باشد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>دقتِ بیشتر در انتخاب کلمات</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">وقتی منطق تناقضی را که هگل بسط می‌دهد بررسی کنیم، پرسشی ابتدایی درباره اصطلاح‌شناسی و روش خیلی زود به ذهن می‌آید. اگر منطق سنتی و تفکر صوری همواره به تناقض می‌انجامد، چرا هگل صرفا منطقی جدید ابداع نمی‌کند که این‌قدر دست‌وپاگیر نباشد؟ به بیان دیگر، شاید او باید به جای رضایت دادن به هگل بودن، گوتلوب فرگه می‌شد. فرگه وقتی به نظام فراخ منطق سنتی می‌نگرد، درست مانند هگل از انچه می‌بیند ناراضی است. اما به جای انکه این اصطلاحات فرسوده را علیه خودشان به کار گیرد، فرگه کاری بسیار سازنده‌تر می‌کند: او به‌سادگی اصطلاحات جدیدی می‌سازد، اصطلاحاتی که حتی امروز هم به کار می‌روند. این معمایی است که چرا هگل راه مشابهی را در پیش نمی‌گیرد. هرچند منطق هگل نتایج منطق سنتی را تغییر می‌دهد، اما اصطلاحاتش را می‌پذیرد. هگل به تغییر این منطق از درون رضایت می‌دهد، به جای انکه به ژست انقلابی فرگه چشم داشته باشد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">گرچه هگل هرگز توجیهی صریح برای این انتخاب ارائه نمی‌کند، اما به‌راحتی می‌شود حدس زد که آن توجیه چه می‌توانست باشد. ابداع منطقی جدید که حول فهم هگل از تناقض سازمان یابد، کل هدف پروژه فلسفی او را نقض می‌کرد. او تفکر صوری را نه از سر لجاجت، بلکه برای این به کار می‌گیرد تا نشان دهد اندیشه همواره با خودش در تعارض است. هیچ اصلاحی ممکن نیست، هیچ فرم جدیدی از منطق نیست که بشود ساخت تا از آن خود-تضعیف‌گری‌ای که در تفکر صوری و منطق سنتی رخ می‌دهد احتراز کرد. این بدان معنا نیست که برخی خطاهای منطق سنتی قابل اصلاح نیستند، بلکه فقط به این معناست که در هر صورت تناقض در نقاط جدیدی از نظام جدید همچنان به ظهور خود ادامه خواهد داد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل می‌بیند که ابداع یک نظام منطقی جدید همواره به پارادوکس راسل خواهد انجامید - یعنی به نقطه‌ای که در آن تناقض، انسجام منطقی‌اش را تضعیف می‌کند. این فقط تفکر صوری نیست که شکست می‌خورد، بلکه تمام تفکر است. ارزوی جایگزینی که بتواند تناقض را نه همچون اختلال، بلکه همچون بخشی عادی از کارکرد نظام ثبت کند، پیِ کاری بیهوده رفتن است. و این کاری است که هگل نمی‌خواهد در پی آن برود. اختلال‌افرینی تناقض در مرکز ارزش آن قرار دارد. تناقض اگر بناست منبع تمام فعالیت بماند، باید جایگاه یک اختلال را حفظ کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اما این پرسش دیگری درباره اصطلاح‌شناسی هگل پیش می‌کشد. چرا او ناتوانی یک موجودیت در این‌همانیِ صرف با خود بودن را «تناقض<a href=\"#5\">[5]</a>» می‌نامد؟ ایا اصطلاح بهتر - و بسیار کم‌اشوب‌تر - برای این کار «سرزندگی<a href=\"#6\">[6]</a>» نبود؟ شاید استفاده هگل از اصطلاح تناقض چیزی جز یک خطای مقوله‌ای نباشد. جایگزین کردن آن با سرزندگی، پویایی اندیشه و زندگی را بدون آن بار اضافه‌ای که تناقض با خود می‌آورد تسخیر می‌کرد. هگل در این مسیر گام برنمی‌دارد و اصطلاح تناقض را حفظ می‌کند تا اختلال‌افرینیِ تمام فعالیت را ثبت کند. تناقض (Widerspruch) معنای علیه خود سخن گفتن را با خود حمل می‌کند، نوعی خود-خیانت که هر موجودیتی از سر می‌گذراند. سوژه‌ها در تلاش برای اعلام این‌همانی خود، خویش را همچون چیزی در تعارض با خود افشا می‌کنند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اگر من خود را فردی بسیار فروتن اعلام کنم، آشکار می‌کنم که اصلا فروتن نیستم. حتی اگر، برعکس، اعتراف کنم که لاف‌زن هستم، همین خود-تحقیرگری انچه درباره خودم می‌گویم را نقض می‌کند. انچه می‌گویم یا انجام می‌دهم، انچه هستم را تضعیف می‌کند. من چیزی جز همین تناقض نیستم، جز همین کنش پیوسته آشکار کردن اینکه انچه نیستم، نقشی محوری در این‌همانی من ایفا می‌کند. وضعیت برای موجودیت‌هایی که نمی‌توانند سخن بگویند بهتر به نظر می‌رسد - ان‌ها لازم نیست نگران گفتن چیزی باشند که با انچه هستند تناقض داشته باشد - اما برای هگل، وضعیت بسیار بدتر است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">سوژه‌های سخنگو، خود-خیانتِ خویش را به اجرا درمی‌اورند، حال‌انکه تمام موجودیت‌های دیگر آن را از بیرون تحمل می‌کنند. زمین پیوسته از خشونتی بیرونی رنج می‌برد که این‌همانی‌اش را مختل می‌کند. نیروی گرانشی خورشید پیوسته بر آن عمل می‌کند. زمین، بمباران پیوسته شهاب‌ها از فضا را تحمل می‌کند. هم‌زمان، انسان‌ها سطح آن را از لحظه‌ای به لحظه دیگر، به‌ طور چشمگیری تغییر می‌دهند. هرچند زمین برای ما شالوده‌ای استوار به نظر می‌رسد، در واقع حتی بیش از ما در معرض خشونت این‌همانی‌ای است که با خود در تعارض است. هگل از تناقض استفاده می‌کند تا این خشونت را انتقال دهد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">صرفا یک سرزندگیِ ایجابی نیست که خود را به‌نحوی پیوسته و یکنواخت ابراز کند. در عوض، تمام فعالیت از رهگذر نفی، نابودی و ستیز رخ می‌دهد. تغییری دائمی در کار است، اما هیچ تغییری هماهنگ‌شده و سازگار نیست. اگر هگل پویایی‌ای را که به هستی جان می‌بخشد با اصطلاحاتی جز اصطلاحات تناقض توصیف می‌کرد، به دام سرزندگی‌گرایی<a href=\"#7\">[7]</a> می‌لغزیدیم، که برای او بزرگ‌ترین خطر است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">سرزندگی‌گرایی مدعی است که نوعی از بهره‌وریِ ناب در جهان طبیعی وجود دارد. این گرایش سرچشمه صیرورت و تغییر را در درون همین بهره‌وری ناب جای می‌دهد. برای سرزندگی‌گرا، تغییر رویدادی طبیعی است که به خود هستی گره خورده است. تغییر از رهگذر نفی رخ نمی‌دهد - نفی در جهانِ سرزندگی‌گرا، جز به‌مثابه کژشناسی‌ای از تغییر وجود ندارد - بلکه از رهگذر بسط ایجابی هستی رخ می‌دهد. باراوریِ طبیعی‌ای هست که پیوسته در جهان، تازگی تولید می‌کند. وظیفه متفکر سرزندگی‌گرا این است که این باراوری را از ابهامی که به‌دست تفکر مفهومی دریافت می‌کند بیرون بکشد. هگل با تاکیدی که بر صیرورت دارد، می‌توانست این راه را در پیش گیرد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اما هگل به اصطلاح تناقض می‌چسبد تا خشونت ژرفی را نشان دهد که به تمام هستی جان می‌بخشد. سرزندگی به ما امکان می‌دهد خشونت را بیرونی تصور کنیم و در نتیجه اختلال‌افرینی‌اش را نیز قابل اجتناب بدانیم. تا زمانی که این مسیر را دنبال کنیم، نه‌تنها در خودفریبی، بلکه در جست‌وجویی بی‌ثمر برای رهایی از این خشونت گم خواهیم شد. اصطلاح تناقض ما را قادر می‌سازد خشونتی را که همچون چیزی گسست‌ناپذیر از سرزندگی‌مان تجربه می‌کنیم بفهمیم. این اصطلاح، جان‌بخشی‌ای را که از انچه زخمی‌مان می‌کند دریافت می‌کنیم، آشکار می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>خطرات A = A&nbsp;</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">مشکل این ادعا که عقل توانایی اندیشیدن به تناقض را دارد، این است که پیامدهای آن ممکن است عقل را یکسره نابود کند. اگر عقل تناقض‌ها را توجیه کند، ان‌گاه هیچ چیز مانع از آن نخواهد شد که کسی ادعاهایی درباره جهان بکند که اساسا با یکدیگر در تعارض‌اند. وقتی ایده اینکه عقل تناقض‌های هستی را بازمی‌شناسد بپذیرم، می‌توانم بگویم که همه درختان سنگ هستند یا همه سگ‌ها گربه هستند. به محض اینکه ورود تناقض را به عملکردهای اندیشه مجاز بشمارم، سدها گشوده می‌شوند و تمام ضابطه‌مندسازیِ انچه می‌توانم ادعا کنم فرو می‌ریزد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اگر واقعا گریزناپذیری تناقض را جدی بگیرم، ان‌گاه اساسا نمی‌توانم هیچ ادعایی بکنم - حتی ادعایی درباره گریزناپذیری تناقض. هر ادعایی بی‌درنگ خود را نقض خواهد کرد. هیچ میزانی از دقت و مراقبت هم نمی‌تواند ادعاهای مرا در برابر این خطر مصون نگه دارد. اگر در باب تناقض، حق با هگل می‌بود، او هرگز نمی‌توانست آن را به‌شکلی قانع‌کننده بگوید، بلکه در عوض در دریایی از ادعاهای متقابل سرگردان می‌ماند. گریزناپذیری تناقض ظاهرا طلسم مرگ فلسفه است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اگر این را در بحث‌های سیاسی در نظر بگیریم، خطر روشن‌تر خواهد شد: می‌شود کسی را تصور کرد که استدلال می‌کند مهاجران تهدیدی برای نابودی بافت جامعه ما هستند، و هم‌زمان معتقد است ما جامعه‌ای پذیرنده هستیم که از مهاجران تشکیل شده می‌باشد. بدبختانه حتی لازم نیست به تخیل متوسل شویم تا چهره‌ای سیاسی را به ذهن اوریم که اصل عدم تناقض را برای اهداف شوم زیر پا می‌گذارد. این راهبرد سیاسی پایه دونالد ترامپ است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">ترامپ در سراسر کارزار انتخاباتی و دوران ریاست‌جمهوری‌اش پیوسته خودش را نقض می‌کرد و از پذیرش تناقض سر باز می‌زد. او ادعا می‌کرد که هرگز از جنگ عراق حمایت نکرده، با وجود شواهدِ صوتی بر خلاف این ادعا. او اخراج جیمز کامی، رئیس اف‌بی‌ای، به دلیل تحقیقات درباره روسیه را انکار می‌کرد، پس از انکه علنا همین را دلیل آن اعلام کرده بود. انگار ترامپ در دانشگاه فریبکاریِ ترامپی دوره‌ای درباره فلسفه هگل گذرانده باشد که او را قادر ساخته نتیجه بگیرد همه موضع‌ها متناقض‌اند و بنابراین در برابر هر نقدی از این حیث اسیب‌ناپذیرند. چنان‌که مورد ترامپ نشان می‌دهد، اصل عدم تناقض نه‌فقط یک سنگر منطقی، بلکه یک سنگر سیاسی نیز هست. وقتی هگل آن را رد می‌کند، به نظر می‌رسد در را به روی خطری بزرگ می‌گشاید.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اما ترامپ هگلی نیست. ظهور تناقض‌امیز او نه خطری برخاسته از نقد هگل به اصل عدم تناقض، که نتیجه چیز دیگری بود. فلسفه هگل به سوژه این حق را نمی‌دهد که هر چه دلش خواست بگوید و بعد انکارش کند. هرچند هگل در نهایت اصل عدم تناقض را رد می‌کند، اما صرفا به طرح ادعاهای متناقض یا ساختن نظامی متناقض دست نمی‌زند. او به‌جای زیر پا گذاشتن اصل عدم تناقض در فلسفه‌اش، پیامدهای پایبندی دقیق به آن را به تصویر می‌کشد. از رهگذر استدلالی غیرمتناقض است که آشکار می‌شود «تناقض ریشه تمام حرکت و سرزندگی است؛ تنها تا جایی که چیزی در خود تناقضی داشته باشد حرکت می‌کند، کشش و فعالیت دارد.» خودداری از پذیرش تناقض‌هایی که دیگر فیلسوفان می‌پذیرند - مثل وابستگیِ قانون این‌همانی به نااین‌همانی - هگل را به این کشف می‌رساند که تناقض نه خطایی در منطق، بلکه واقعیتی در هستی است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">استفاده گستاخانه ترامپ از تناقض در واقع تلاشی است برای پرهیز از هرگونه رویارویی با اختلال‌افرینیِ سرسختی تناقض. متناقض‌گویی عمدی، فرد را نسبت به ضرورت تناقض کور می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">می‌توانیم به نمونه‌ای از بخش آغازین علم منطق نگاه کنیم. هگل در بحث خود از تعین یک چیز ساده (Etwas)، متوجه می‌شود که ما می‌توانیم این چیز را تنها از رهگذر دیگربودگی‌اش تعریف کنیم. بدون تعریف یک دیگربودگی، یک چیز اصلا هیچ تمایزی ندارد و با همه‌چیزهای دیگر درمی‌امیزد. دیگربودگی در تعریف یک چیز مداخله می‌کند تا تمایزی را که برسازنده آن است ایجاد کند. اما مشکل این است که این دیگربودگی به جزئی جدایی‌ناپذیر از آن چیز بدل می‌شود. چیز و دیگری، نمودی از استقلال دارند که وابستگی متقابل ان‌ها را پنهان می‌کند. در نتیجه، دیگربودگی دیگر صرفا دیگربودگی نیست، و چیز نیز دیگر یک چیز متمایز در برابر دیگربودگی نیست. یا چنان‌که هگل می‌گوید: «هستی-برای-دیگری در یگانگی چیز با خودش، این‌همان با در-خود آن است؛ بنابراین هستی-برای-دیگری در چیز است.» دیگربودگی در آغاز صرفا یک نقطه ارجاع بیرونی است و در نهایت به چیزی تعیین‌کننده برای نحوه این‌همان‌سازی ما از چیز بدل می‌شود. تمایز به‌ظاهر روشن میان چیز و دیگری، همین‌که هگل از نزدیک بررسی‌اش می‌کند، شفافیت خود را از دست می‌دهد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">می‌توانیم موردی آشکار از این رابطه میان چیز و دیگربودگی را در پلیس ببینیم. درحالی‌که پلیس با متمایز کردن خود از دیگریِ تبهکار به یک چیز بدل می‌شود، افسران پلیس برای انکه به‌طور مؤثر ‌دهد و نشان می‌دهد که این قانون مجوز غارتگرانه‌ترین شکل سرمایه‌داری را صادر می‌کند. اهمیت فلسفی رند در توانایی‌اش برای افشای این پیوند میان قانون این‌همانی و سرمایه‌داری است، پیوندی که به نظر می‌رسد هیچ نسبت درونی با یکدیگر ندارند. او نشان می‌دهد که قانون این‌همانی حتی از نقض آشکار اصل عدم تناقض نیز شوم‌تر است. می‌شود تناقض‌های ترامپ را شناسایی کرد و از ان‌ها برای بی‌اعتبار کردن او بهره برد، درحالی‌که فلسفه سیاسی رند بی‌سروصدا به هژمونی خود در کسوت عقل سلیم ادامه می‌دهد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اما در واقعیت این مواضع اصلا در تقابل با یکدیگر نیستند. علیرغم احترام ظاهری رند برای قانون این‌همانی، او برای پیش‌برد چشم‌انداز سرمایه‌دارانه‌اش به چهره‌هایی مثل ترامپ نیاز دارد که با خوش‌حالی تناقض را به خدمت می‌گیرند. دولت ترامپ نقض‌های آشکار اصل عدم تناقض را با پذیرش قانون این‌همانی از سوی رند درهم‌می‌امیزد. ترامپ خودش را نقض می‌کند تا پوششی برای کاهش مالیات ثروتمندان، مقررات‌زدایی گسترده و برچیدن منابع عمومی فراهم کند - یعنی درست همان فلسفه سیاسی این رند - چیزهایی که مردم بدون دروغ‌هایی مثل «ما مالیات ثروتمندان را کم می‌کنیم تا کم‌درامدترین کارگران درامد بیشتری داشته باشند» نمی‌پذیرفتند. هیچ‌کس نمی‌تواند آشکارا یک رندی باشد و حمایت عمومی جلب کند. هیچ‌کس نمی‌تواند از نظر سیاسی قانون این‌همانی را فرابخواند بی‌انکه هم‌زمان بر تناقض‌های آشکار تکیه کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">بر اساس قانون این‌همانی (که رند آن را به ارسطو نسبت می‌دهد)، او اصرار می‌ورزد که تولیدکنندگانِ سرمایه‌دار هیچ مسئولیتی در قبال کارمندان خود یا جامعه‌ای که در آن زندگی می‌کنند ندارند. هر تولیدکننده موجودی مستقل و منزوی است که از رهگذر کنش خلاقانه به جهان ارزش می‌آورد. از آنجا که هیچ تناقضی ممکن نیست، ارزشی که سرمایه‌دار می‌افریند باید منحصرا به خود او تعلق داشته باشد و نه هیچ‌کس دیگر. تولید سرمایه‌دارانه ارزش را بدون هیچ ازخودگذشتگی‌ای خلق می‌کند، درست همان‌طور که کالا در انزوا از کاری که آن را تولید کرده وجود دارد. برای رند، خلق ارزش سرمایه‌دارانه لزوما بر به خاک سیاه نشاندن کارگران متکی نیست، آنگونه که برای مارکس هست. تولید ارزش هیچ ربطی به نفی ندارد، چرا که A = A.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">عنوان بخش سوم شاهکار این رند، اطلس شانه‌هایش را بالا انداخت،«A = A»&nbsp; است، که خط اصلی پیونددهنده سخنرانی طولانی رادیویی قهرمان داستان، جان گالت، در اواخر رمان را فراهم می‌کند. گالت در سخنرانی‌اش ارسطو را می‌ستاید و وجود تناقض را رد می‌کند. این رد صرفا یک خصلت عجیب فلسفی نزد رند نیست، بلکه هسته اساسی هر فلسفه سیاسی سرمایه‌دارانه است. سرمایه‌داری بر این وابسته است که سوژه‌ها خود را موجوداتی منزوی ببینند که این‌همانی‌شان دیگربودگی را در بر نمی‌گیرد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">حتی ادام اسمیت نیز، با وجود انکه فاقد صراحت رند است، سرمایه‌داری را بر اساس قانون این‌همانی نظریه‌پردازی می‌کند. اسمیت بازمی‌شناسد که کار منبع ارزش است، اما مبادله میان کارگر و سرمایه‌دار را همچون مبادله‌ای میان دو موجود مستقل خود-بسنده مفهوم‌پردازی می‌کند. در نتیجه، سرمایه‌دار هیچ مسئولیتی در قبال وضعیت اسفناک کارگر ندارد. به همین ترتیب، مصرف‌کننده نیز می‌تواند از کالایی لذت ببرد بی‌انکه هیچ مسئولیتی در قبال کاری که آن را تولید کرده داشته باشد. انزوای این‌همانی با خود - این باور که A = A - نظام سرمایه‌داری را سرِ پا نگه می‌دارد. رند این را به نحوی عریان می‌کند که دیگران نمی‌کنند. او پیوند پنهان میان منطق سنتی و توجیه سرمایه‌داری را آشکار می‌کند. پذیرش تمام‌عیار او از قانون این‌همانی و سرمایه‌داری، تقابلی آشکار با هگل را رقم می‌زند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">فلسفه تناقض هگل راه را بر بسط برنامه سیاسی رند می‌بندد. پذیرفتن ضرورت نقش متناقضی که دیگربودگی در این‌همانی ایفا می‌کند، چنان‌که هگل بر آن اصرار دارد، ما را در برابر اغواهای چشم‌انداز رند واکسینه می‌کند. ما بازمی‌شناسیم که رد تمام تناقض از سوی رند، در واقع رد تمام اندیشه است. اما تا زمانی که به تخطی‌ناپذیری قانون این‌همانی و اصل عدم تناقض بچسبیم، خطر این رند همواره در کمین خواهد بود. از آنجا که این خطر خود را در پوشش منطق سنتی پنهان می‌کند، تهدیدی بسیار شوم‌تر از تناقض‌های آشکار دونالد ترامپ است. اندیشه هگل نه‌تنها راه را برای دونالد ترامپ هموار نمی‌کند، بلکه این فایده مضاعف را نیز دارد که ردیه‌ای بر این رند، پیشاپیشِ ظهور او، فراهم می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>دشواری‌های خود-متناقض‌گویی</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل با نتیجه‌گیری از اینکه تناقض نه‌تنها می‌تواند اندیشیده شود، بلکه وجودی بالفعل نیز دارد، اصل موضوعه بنیادین فلسفه باستان و مدرن را به چالش می‌کشد. خطر این است که هر انچه فرد بگوید از ضد خود تمایزناپذیر شود. اما هگل راهی برای رد اصل عدم تناقض می‌یابد، در عین حال که همچنان می‌توان حرفش را فهمید. او این کار را با نشان دادنِ اینکه خود این اصل به گریزناپذیری تناقض می‌انجامد انجام می‌دهد. فرد نمی‌تواند به‌سادگی اصل عدم تناقض را کنار بگذارد و خود را نقض کند، و نیز نمی‌تواند بی‌پرده و به‌شیوه‌ای غیرمتناقض اعلام کند که تناقض وجود دارد. اگر هگل چنین می‌کرد، تلویحا همان اصلی را می‌پذیرفت که نشان می‌دهد پذیرفتنی نیست. خلاصه اینکه هگل نمی‌تواند والت ویتمن باشد. با اینکه ویتمن هگل را به‌عنوان الهامی اصلی در اغوش می‌گیرد، هگل‌گرایی ویتمن تاییدی ضمنی به این قاعده است که بزرگ‌ترین تهدید برای یک متفکر، مریدانش هستند، نه دشمنانش. ویتمن در «سرود خودم» می‌کوشد تقابل هگل با اصل عدم تناقض را بیان کند، آنجا که می‌نویسد: «ایا خود را نقض می‌کنم؟ / بسیار خوب، پس خود را نقض می‌کنم، / (من بزرگم، انبوه جمعیت‌ها را در خود دارم).» در قیاس با نثر هگل، کمتر خواننده‌ای برای فهم انچه ویتمن اینجا می‌گوید به تقلا می‌افتد. روشنیِ موضع ویتمن از توانایی او در اتخاذ موضعی سرراست درباره اصل عدم تناقض ناشی می‌شود. درحالی‌که این ممکن است شعری جذاب بیافریند، پذیرش بی‌پرده تناقض از سوی ویتمن برای هگل در مقام فیلسوف پذیرفتنی نخواهد بود. ترفند، برای هگل، این است که او باید اصل عدم تناقض را بپذیرد تا نشان دهد که این اصل در نهایت برقرار نیست.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هگل گاه مدعیات سرراستی درباره تناقض بیان می‌کند که همچون تابلوهای راهنما برای فلسفه‌اش عمل می‌کنند. برای نمونه، او در علم منطق جایگاه بنیادین تناقض را روشن می‌کند، آنجا که می‌گوید: «همه چیزها در خود متناقض‌اند.» این نوع گزاره نادر است و کارکردی اکتشافی دارد. این گزاره‌ای عادی است که برای کمک به خواننده در دستیابی به گزاره‌های نظرورزانه هگل که تناقض را به اجرا درمی‌اورند ضروری است. به زبان اوردن اینکه موجودیت‌ها متناقض‌اند اسان است، اما انچه دشوار است - و انچه بدفهمی‌های اندیشه هگل را تولید می‌کند - نشان دادن ضرورت تناقض در عین پیروی از اصل عدم تناقض است. هرچند هگل می‌بیند که باید گه‌گاه گزاره‌هایی درباره تناقض عرضه کند، این گزاره‌ها به‌خودی‌خود می‌توانند گمراه‌کننده باشند. ان‌ها خطر دامن زدن به این باور را در خود دارند که فرد می‌تواند بیرون از تناقض بایستد و گزاره بیانیِ سرراست درباره آن صادر کند، چیزی که ناممکن است. فرد باید این خطر را به جان بخرد، وگرنه فلسفه‌اش کاملا نفوذناپذیر خواهد شد. بااین‌حال، هگل در بیشتر موارد خود را به به اجرا دراوردن تناقض محدود می‌کند، به آشکار کردن تناقض همچون امری گریزناپذیر.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">این نکته وقتی هگل درباره درد بحث می‌کند آشکار می‌شود. هگل در دو مورد در علم منطق درد را همچون امتیازی می‌شناسد که موجودات زنده دارند و ماده بی‌جان فاقد آن است. صرفِ ادعای اینکه درد یک امتیاز است برای خواننده متناقض به نظر می‌رسد. هیچ‌کس که درد می‌کشد آن را امتیاز نمی‌پندارد. اما در درد بودن یعنی خود را غوطه‌ور در تناقض یافتن، و این در قیاس با بدیل‌ها وضعیتی خوش‌یمن است. هگل می‌گوید: «موجود زنده برای خود همان گسست است، احساس این تناقض را دارد که درد است. بنابراین درد حق ویژه طبیعت‌های زنده است... گفته می‌شود که تناقض را نمی‌توان اندیشید؛ اما در درد موجود زنده، تناقض حتی وجودی بالفعل و انضمامی است.» چرا درد «وجود انضمامی» تناقض است؟ هگل درد را در اینجا همچون نفی موجود زنده در نظر می‌گیرد: درد پاسخی است به محرک‌هایی که به موجود اسیب می‌زنند و حتی تهدید به نابودی آن می‌کنند. وقتی یک موجود غیرزنده با نابودی روبرو می‌شود (برای نمونه، وقتی یک ابرنواختر تهدید می‌کند که سیاره‌ای را در خود فروبلعد)، این موجود هیچ دردی پیش از نابودی‌اش متحمل نمی‌شود. هیچ سیاره‌ای در لحظاتی که ستاره‌اش منفجر می‌شود از فرط درد به خود نمی‌پیچد، چرا که نفی کاملا بیرون از آن است. در تجربه درد، برعکس، موجود زنده از اسیبی که دارد می‌بیند اگاهی دارد. این اگاهی از اسیب‌دیدن، همان معنای زنده بودن است. فرد تنها به بهای تجربه آن زندگی همچون چیزی اسیب‌دیده زنده است، و این همان جایی است که هگل تناقض را در کار می‌بیند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">البته، فرد می‌تواند ارزو کند که در درد نباشد - این همان چیزی است که اغلب موجودات زنده ارزو می‌کنند - اما حذف کامل درد مستلزم حذف زندگی نیز خواهد بود. توانایی احساس زندگی همچون چیزی اسیب‌دیده، به سوی پایان زندگی اشاره دارد، اما در عین حال، خودِ زندگی است. بدون ظرفیت اگاهی از این اسیب، فرد احساس‌مندی را از دست می‌دهد. درد کلید فهم نحوه تلقی هگل از تناقض را فراهم می‌کند، چرا که نفی و افرینش را گرد هم می‌آورد و آشکار می‌کند که تجربه‌ای که موجود زنده را نفی می‌کند، برای موجود زنده برسازنده است. بدون نفی زندگی، فرد نمی‌توانست زنده باشد. این برای هگل صرفا یک استعاره نیست، ادعایی درباره اینکه فرد نزدیک به مرگ بیشترین احساس زنده بودن را می‌کند، بلکه ادعایی واقعا هستی‌شناختی است درباره نقش ضروری‌ای که مردن در زندگی ایفا می‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">نظریه هگل درباره ظهور سوبژکتیویته از دل حیوانیت، بر لحظه‌ای متمرکز است که حیوانیت اسیب‌ می‌بیند. هگل در فلسفه واقع اولیه دوره ینا می‌گوید: «بیماری حیوان، تولد روح است.» تنها از رهگذر نوعی اختلال در حیوانیت است که سوبژکتیویته می‌تواند سر براورد. به این معنا، سوژه، حیوانی بیمار است، حیوانی که از عهده زندگی سالم حیوانی برنمی‌اید. اگر امتیازی در سوبژکتیویته وجود داشته باشد، این امتیاز در چیزی است که به‌درستی کار نمی‌کند.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">هر تناقضی که هگل می‌کاود، به همان نحو درد و بیماری عمل می‌کند، حتی وقتی فراتر از موجود زنده گسترش می‌یابد. برای هگل، تناقض‌های اندیشه ما را به تناقض‌های هستی می‌رسانند. از نگاه هگل، تناقض منطقی متضمن تناقض هستی‌شناختی است. نفی در هر موجودیت ایجابی نفوذ می‌کند، نه همچون مهاجمی بیگانه، بلکه همچون بنیاد ضروری برای وجود آن موجودیت. تناقض ناممکن نیست. این غیاب تناقض است که تصورش ناممکن است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">اینکه کژفهمی غالب از هگل او را فیلسوف سنتز می‌دید، شگفت‌انگیز نیست. ما فلسفه تناقض را به فلسفه‌ای بدل می‌کنیم که در پی حذف تناقض است، تا از رویارویی با پیامدهای تروماتیک آن بپرهیزیم. به‌جای رسیدن به فروکاست‌ناپذیری تناقض، با اطمینان به یک سنتز نتیجه‌گیری می‌کنیم. بدین‌سان، ما اگاهانه مسئله‌ای را که هگل پیش می‌نهد حل می‌کنیم. ما کژنماییِ اندیشه هگل را پذیرفته‌ایم تا از کژنمایی‌ای که این اندیشه در تفکر {ما} وارد می‌کند بپرهیزیم.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>یادداشت‌ها</b></p><p class=\"\" dir=\"RTL\" style=\"direction: ltr; text-align: left; unicode-bidi: embed;\"><a href=\"#back1\">1.</a> speculative</p><p class=\"\" dir=\"RTL\" style=\"direction: ltr; text-align: left; unicode-bidi: embed;\"><a href=\"#back2\">2.</a> essence</p><p class=\"\" dir=\"RTL\" style=\"direction: ltr; text-align: left; unicode-bidi: embed;\"><a href=\"#back3\">3.</a> predication</p><p class=\"\" dir=\"RTL\" style=\"direction: ltr; text-align: left; unicode-bidi: embed;\"><a href=\"#back4\">4.</a> identification</p><p class=\"\" dir=\"RTL\" style=\"direction: ltr; text-align: left; unicode-bidi: embed;\"><a href=\"#back5\">5.</a> contradiction</p><p class=\"\" dir=\"RTL\" style=\"direction: ltr; text-align: left; unicode-bidi: embed;\"><a href=\"#back6\">6.</a> vitality</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><a href=\"#back7\">7.</a> یا حیات‌گرایی، چون قبل از این واژه سرزندگی استفاده شد، اینجا به سرزندگی‌گرایی ترجمه می‌شود.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>منبع</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">ترجمه‌ فصل اول کتاب رها
