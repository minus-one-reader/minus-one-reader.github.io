4.93l-1.41 1.41"/></svg></button> <button data-theme="dark" class="theme-btn p-2 rounded border border-transparent"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button> <button data-theme="papery" class="theme-btn p-2 rounded border border-transparent"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></button> </div> </div> </header>  <main class="flex-grow">  <div class="container max-w-5xl mx-auto px-4 py-12 md:py-20"> <div class="max-w-2xl mx-auto mb-16 text-center"> <h1 class="text-4xl md:text-5xl font-kufam font-black mb-6">جستجو در منفی یک</h1> <p class="text-muted-foreground text-lg mb-8 font-vazirmatn">به دنبال موضوع خاصی می‌گردید؟ همین حالا جستجو کنید.</p> <div class="relative group"> <input id="search-input" type="text" placeholder="کلمه‌ای برای جستجو بنویسید..." class="w-full h-16 pl-6 pr-14 rounded-2xl border-2 border-border bg-card text-foreground focus:outline-none focus:border-primary text-lg transition-all shadow-sm group-hover:border-primary/50 font-vazirmatn"> <div class="absolute right-5 top-5 text-muted-foreground group-focus-within:text-primary transition-colors"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> </div> </div> </div> <div id="search-container" class="flex flex-col gap-6"> <!-- JS renders results here --> </div> </div> <script>(function(){const posts = [{"id":"6","slug":"superego-by-default","title":"سوپرایگو به طور پیشفرض: قانون عمومی، سوپرایگو و ایدئولوژی","excerpt":"روش درست نزدیک شدن به موضوع «روانکاوی و قانون» این است که بپرسیم: روانکاوی با چه نوع قانونی سروکار دارد؟ پاسخ، البته، سوپرایگو است. سوپرایگو انجا سر برمی‌اورد که قانون - قانون عمومی، همان قانونی که در گفتمان عمومی بیان می‌شود - ناکام می‌ماند؛ در همین نقطه شکست، قانون عمومی ناچار می‌شود برای پشتیبانی به لذتی نامشروع متوسل شود. سوپرایگو همان قانون مستهجن «شبانه» است که به ضرورت، قانون «عمومی» را همچون سایه‌ای دوبرابر می‌کند و همراهش می‌شود. این شکاف درونی و برسازنده در قانون، موضوع فیلم «چند مرد خوب» ساخته راب راینر است، درامی دادگاهی-نظامی درباره دو تفنگدار دریایی متهم به قتل یکی از همقطارانشان. دادستان نظامی ادعا می‌کند که عمل آن دو تفنگدار قتلی عمدی بوده، درحالی‌که دفاعیه موفق می‌شود ثابت کند متهمان صرفا از چیزی به نام «کد قرمز» پیروی کرده‌اند، کدی که تنبیه شبانه و پنهانی همقطاری را که به نظر همقطاران یا افسر مافوق، کد اخلاقی تفنگداران را زیر پا گذاشته مجاز می‌شمارد.","content":"<p style=\"direction: rtl; \"><b>مقدمه مترجم</b></p><p style=\"direction: rtl; \">نوشته‌ای که خواهید خواند، ترجمه‌ی فصل سوم کتابِ متاستازهای لذت: شش جستار درباره زن و علیت، نوشته اسلاوی ژیژک است. ژیژک در فصل سومِ این کتاب، نظریه خودش از سوپرایگو را ارائه می‌دهد، سوپرایگویی که چسبِ مستهجن اجتماع است و قانون عمومی بدون آن، نمی‌تواند عمل کند. این نوشته همچنین، فهمِ آلتوسری از ایدئولوژی را تصحیح و تکمیل می‌کند، و در آخر، تفاوت کارکردِ سوپرایگوی سنتی و توتالیتر را نشان می‌دهد.</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>متن اصلی</b></p><p style=\"direction: rtl; \"><b>قانونی که از خود لذت می‌برد</b></p><p style=\"direction: rtl; \">روش درست نزدیک شدن به موضوع «روانکاوی و قانون» این است که بپرسیم: روانکاوی با چه نوع قانونی سروکار دارد؟ پاسخ، البته، سوپرایگو است. سوپرایگو انجا سر برمی‌اورد که قانون - قانون عمومی، همان قانونی که در گفتمان عمومی بیان می‌شود - ناکام می‌ماند؛ در همین نقطه شکست، قانون عمومی ناچار می‌شود برای پشتیبانی به لذتی نامشروع متوسل شود. سوپرایگو همان قانون مستهجن «شبانه» است که به ضرورت، قانون «عمومی» را همچون سایه‌ای دوبرابر می‌کند و همراهش می‌شود. این شکاف درونی و برسازنده در قانون، موضوع فیلم «چند مرد خوب» ساخته راب راینر است، درامی دادگاهی-نظامی درباره دو تفنگدار دریایی متهم به قتل یکی از همقطارانشان. دادستان نظامی ادعا می‌کند که عمل آن دو تفنگدار قتلی عمدی بوده، درحالی‌که دفاعیه موفق می‌شود ثابت کند متهمان صرفا از چیزی به نام «کد قرمز» پیروی کرده‌اند، کدی که تنبیه شبانه و پنهانی همقطاری را که به نظر همقطاران یا افسر مافوق، کد اخلاقی تفنگداران را زیر پا گذاشته مجاز می‌شمارد.</p><p style=\"direction: rtl; \">کارکرد این «کد قرمز» فوق‌العاده جالب است: عملی خطاکارانه - تنبیه غیرقانونی یک همقطار - را مجاز می‌کند، بااین‌حال همزمان انسجام گروه را بازتایید می‌کند - خواهان کنشی از سر همذات‌پنداری عالی با ارزش‌های گروهی است. چنین کدی باید زیر پوشش شب، ناگفته و ناگفتنی بماند - در ملاعام، همه وانمود می‌کنند که از آن بی‌خبرند، یا حتی فعالانه وجودش را انکار می‌کنند. این کد نمایانگر «روح جامعه» در ناب‌ترین شکل آن است و قوی‌ترین فشار را بر فرد وارد می‌کند تا به فرمان همذات‌پنداری گروهی تن دهد. بااین‌حال، همزمان قواعد صریح زندگی جمعی را نقض می‌کند. (وضعیت بغرنج دو سرباز متهم این است که نمی‌توانند این کنار گذاشته شدن «کد قرمز» از «دیگری بزرگ»، یعنی قلمروی قانون عمومی را درک کنند: ان‌ها مستاصلانه از خود می‌پرسند «ما چه اشتباهی کردیم؟»، چرا که صرفا از فرمان افسر مافوق پیروی کرده بودند.)</p><p style=\"direction: rtl; \">این شکاف و دوتکه شدن در قانون به قانون مکتوب عمومی و سویه پنهان آن، یعنی کد مستهجن نانوشته، از کجا می‌اید؟ از سرشت ناتمام و «نه‌همه» قانون عمومی: قواعد صریح و عمومی کافی نیستند، بنابراین باید با یک کد نانوشته پنهانی تکمیل شوند که هدفش کسانی‌اند که، گرچه هیچ قانون عمومی‌ای را نقض نمی‌کنند، اما نوعی فاصله درونی را حفظ می‌کنند و واقعا با «روح جامعه» همذات‌پنداری نمی‌کنند.</p><p style=\"direction: rtl; \">سادیسم بنابراین بر این شکافِ میدان قانون متکی است؛ شکافی میان قانون در مقام «اگو-ایدئال» - یعنی نظم نمادینی که زندگی اجتماعی را تنظیم می‌کند و صلح اجتماعی را حفظ می‌کند - و سویه معکوس مستهجن و سوپرایگویی آن. چنان‌که تحلیل‌های پرشماری از باختین به بعد نشان داده‌اند، تخطی‌های دوره‌ای از قانون عمومی برای نظم اجتماعی ذاتی‌اند؛ ان‌ها همچون شرط پایداری این نظم عمل می‌کنند. (اشتباه باختین - یا دقیق‌تر، برخی از پیروانش - این بود که تصویری ارمانی‌شده از این «تخطی‌ها» ارائه دادند، و در سکوت از پارتی‌های لینچ کردن {اشاره به اعدام و کشتن خشونت‌امیز سیاه‌پوستان در جنوب امریکا خصوصا به دست KKK، عملی که قانونا غیرمجاز بود ولی طبق استدلال ژیژک \"چسب اجتماع سفیدپوستان جنوب\" بود -م} و چیزهایی از این دست، همچون شکل اساسی «تعلیق کارناوالی سلسله‌مراتب اجتماعی» گذشتند.)</p><p style=\"direction: rtl; \">انچه عمیق‌تر از همه یک جامعه را «منسجم نگه می‌دارد»، نه همذات‌پنداری با قانونی که مدار «عادی» روزمره جامعه را تنظیم می‌کند، بلکه همذات‌پنداری با شکلی خاص از تخطی از قانون، از تعلیق قانون است (به زبان روانکاوی، با شکلی خاص از لذت).</p><p style=\"direction: rtl; \">بگذارید به آن جوامع سفیدپوست شهرهای کوچک در جنوب امریکا در دهه ۱۹۲۰ برگردیم، جایی که سلطه قانون رسمی و عمومی با همزاد سایه‌وارش، ترور شبانه کوکلاکس‌کلان (KKK) با لینچ کردن سیاهان بی‌دفاع، همراه می‌شود. یک مرد (سفیدپوست) به‌راحتی بابت تخطی‌های جزئی از قانون بخشیده می‌شود، به‌ویژه وقتی بشود با «مَنش شرافتمندانه» توجیهشان کرد؛ جامعه هنوز او را «یکی از خودمان» می‌شناسد. بااین‌حال، همان مرد عملا طرد می‌شود، دیگر «از خودمان» به حساب نمی‌اید، درست لحظه‌ای که آن شکل خاص از تخطی را که متعلق به این جامعه است انکار کند - مثلا لحظه‌ای که از شرکت در لینچ‌های ایینی کلان سر باز زند، یا حتی ان‌ها را به قانون گزارش کند (قانونی که البته خودش هم نمی‌خواهد چیزی از اینها بشنود، چون این لینچ‌ها نمونه همان سویه پنهان خود قانون‌اند). جامعه {المان} نازی نیز بر همین همبستگی-در-گناه که از مشارکت در یک تخطی مشترک ناشی می‌شود تکیه داشت: کسانی را طرد می‌کرد که حاضر نبودند سویه تاریک فولکیِ‌ گماینشافتِ بت‌واره را بپذیرند - کشتارهای شبانه، کتک زدن مخالفان سیاسی - خلاصه، تمام آن چیزهایی که «همه می‌دانستند، اما کسی نمی‌خواست بلند درباره‌شان حرف بزند».</p><p style=\"direction: rtl; \">وقتی فضای عمومی در نتیجه قدرت‌یافتن ایدئولوژی برابری‌طلب بورژوایی، خصلت مستقیم پدرسالارانه‌اش را از دست می‌دهد، رابطه میان قانون عمومی و سویه مستهجن سوپرایگویی‌اش نیز دستخوش تغییری رادیکال می‌شود. در جامعه سنتی پدرسالار، تخطی درونی از قانون شکل یک واژگونی کارناوالیِ اقتدار را به خود می‌گیرد: پادشاه گدا می‌شود، دیوانگی خود را عقل جا می‌زند، و چیزهایی از این دست. نمونه مثال‌زدنی این واژگونی، رسمی است که تا نیمه قرن حاضر {قرن بیستم} در روستاهای شمال یونان اجرا می‌شد: برای یک روز، زن‌ها کنترل را به دست می‌گرفتند - مردها مجبور بودند خانه بمانند و از بچه‌ها نگهداری کنند، درحالی‌که زن‌ها در مسافرخانه محلی جمع می‌شدند، تا خرخره می‌نوشیدند و دادگاه‌های ساختگی برای مردها راه می‌انداختند... پس انچه در این تعلیق تخطی‌امیزِ قانون پدرسالارِ حاکم فوران می‌کند، فانتزی قدرت زنانه است. وقتی لکان توجه ما را به این نکته جلب می‌کند که یکی از واژه‌های رایج برای «زن» در فرانسویِ روزمره la bourgeoise است - یعنی همان کسی که در پس نقاب سلطه مردانه، در واقع نخ‌ها را می‌کشد - این را به‌هیچ‌روی نمی‌شود به روایتی از طنزهای رایج مردسالارانه درباره اینکه اخرش سلطه پدرسالارانه چندان هم برای زن‌ها بد نیست، چون - دست‌کم در حلقه بسته خانواده - این زن‌ها هستند که همه‌کاره‌اند، فروکاست.</p><p style=\"direction: rtl; \">مسئله عمیق‌تر از این حرف‌هاست: یکی از پیامدهای این واقعیت که ارباب همیشه شیادی بیش نیست، دوگانگیِ ارباب است - کارگزاریِ ارباب همواره همچون نقابی فهمیده می‌شود که اربابی دیگر، ارباب «واقعی» را پنهان می‌کند. کافی است قصه ادورنو در مینیمامورالیا را به یاد اورد: قصه زنی که ظاهرا خود را تابع شوهرش می‌کند و وقتی می‌خواهند مهمانی را ترک کنند، مطیعانه پالتوی او را نگه می‌دارد، اما همان‌طور که این کار را می‌کند، پشت سر شوهرش، نگاه‌های طعنه‌امیز حاکی از ترحم با میهمان‌های دیگر رد‌وبدل می‌کند که این پیام را می‌رساند: «ضعیفه بیچاره، بگذار خیال کند او ارباب است!» تقابل قدرت مردانه و زنانه بنابراین همچون تقابل نقاب و قدرت بالفعل فهمیده می‌شود: مرد شیادی بیش نیست، محکوم به اجرای ژست‌های نمادین تهی، درحالی‌که مسئولیت بالفعل بر دوش زن‌هاست. بااین‌حال، نکته‌ای که نباید در اینجا از قلم بیفتد این است که این شبح قدرت زنانه به‌لحاظ ساختاری به سلطه مردانه وابسته است: این شبح همزاد سایه‌وار آن، اثر واپسنگرانه‌اش و به همین سان، لحظه درونی‌اش باقی می‌ماند. به همین دلیل، ایده اشکار کردن قدرت سایه‌وار زنانه و به رسمیت شناختن علنی موقعیت محوری آن، ظریف‌ترین راه برای افتادن به دام پدرسالاری است.</p><p style=\"direction: rtl; \">بااین‌حال، همین‌که قانون عمومی ردای مستقیم پدرسالارانه‌اش را کنار بگذارد و خود را بی‌طرف-برابری‌طلب عرضه کند، خصلت همزاد مستهجن آن {سوپرایگو} نیز دستخوش تغییری رادیکال می‌شود: انچه اکنون در تعلیق کارناوالیِ قانون عمومیِ «برابری‌طلب» فوران می‌کند، دقیقا همان منطق اقتدارگرایانه-پدرسالارانه‌ای است که کماکان به نگرش‌های ما شکل می‌دهد، هرچند بیان علنی مستقیم آن دیگر مجاز نیست. «کارناوال» بدین ترتیب به مجرایی برای ژوئیسانس سرکوب‌شده اجتماعی بدل می‌شود: شورش‌های یهودی‌کوبی، تجاوزهای گروهی...</p><p style=\"direction: rtl; \">از ان‌جا که سوپرایگو ورود لذت به میدان ایدئولوژی را رقم می‌زند، می‌توانیم بگوییم که تقابل قانون نمادین و سوپرایگو به تنش میان معنای ایدئولوژیک و لذت اشاره دارد: قانون نمادین ضامن معناست، درحالی‌که سوپرایگو لذتی را فراهم می‌کند که پشتیبان ناگفته معناست. امروز، در دوران به‌اصطلاح «پساایدئولوژیک»، ضروری است که فانتزیِ پشتیبان یک بنای ایدئولوژیک را با معنای ایدئولوژیک اشتباه نگیریم - وگرنه چطور می‌توانیم اتحاد پارادوکسیکال پساکمونیسم و ملی‌گرایی فاشیستی را (در صربستان، روسیه و جاهای دیگر) توضیح دهیم؟ در سطح معنا، رابطه این دو طرد متقابل است؛ بااین‌حال پشتیبانیِ فانتزی مشترکی دارند (وقتی کمونیسم گفتمان قدرت بود، ماهرانه با فانتزی‌های ملی‌گرایانه بازی می‌کرد - از استالین تا چائوشسکو). در نتیجه، میان نگرش «پست‌مدرن» کلبی‌مسلکِ ناهم‌ذات‌پنداری و فاصله‌گیری از هر ایدئولوژی، و وسواس ملی‌گرایانه نسبت به چیزِ قومی نیز، ناسازگاری‌ای وجود ندارد. چیز<a href=\"#1\">[1]</a>&nbsp; همان جوهر لذت است: بنا بر نظر لکان، کلبی‌مسلک کسی است که تنها به لذت باور دارد - و ایا روشن‌ترین نمونه آن دقیقا همان کلبی‌مسلکی نیست که وسواس چیزِ ملی را دارد؟</p><p style=\"direction: rtl; \">تفاوت میان قانون و سوپرایگو همچنین با تفاوت میان نوشتار و صدا هم‌پوشانی دارد. قانون عمومی اساسا مکتوب است - دقیقا و تنها به این دلیل که «مکتوب است»، نااگاهی ما از قانون نمی‌تواند بهانه‌ای موجه باشد و در چشم قانون ما را تبرئه نمی‌کند. در مقابل، جایگاه سوپرایگو جایگاه صدایی تروماتیک است، مزاحمی که ما را مورد ازار قرار می‌دهد و تعادل روانی‌مان را بر هم می‌زند. در اینجا نسبت دریداییِ معیارِ میان صدا و نوشتار وارونه می‌شود: این صدا است که نوشتار را تکمیل می‌کند، و همچون لکه‌ای کدر عمل می‌کند که میدان قانون را می‌بُرد، درحالی‌که برای تمامیت آن ضروری است.</p><p style=\"direction: rtl; \">جنبه دیگری از این سویه مستهجن قانون را رسومی نشان می‌دهد که در میان نخبگان قدرت در امریکا رایج است. شایعه‌ای فراگیر وجود دارد که هر سال، تمام نخبگان قدرت (سیاست‌مداران ارشد، مدیران، نظامیان، روزنامه‌نگاران، ثروتمندترین‌ها...) یک هفته در یک تفرجگاه بسته در جنوب سانفرانسیسکو گرد هم می‌ایند تا «اجتماعی» شوند. انچه ان‌ها واقعا در انجا انجام می‌دهند، عمدتا غرق شدن در بازی‌های مستهجنی است که شان مناسک اجتماعی را به حالت تعلیق درمی‌اورد - می‌گساری سنگین، رقصیدن و خواندن اوازهای مبتذل با لباس زنانه، گفتن داستان‌های مستهجن و ....</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>سوژه دوپاره‌ی استیضاح</b></p><p style=\"direction: rtl; \">می‌توانیم همچنین بگوییم که این قانون شبانه و مستهجن عبارت است از پروتون پسئودوس، همان دروغ نخستینی که یک جامعه را بنیان می‌نهد. به بیان دیگر، همذات‌پنداری با جامعه در نهایت همواره بر نوعی گناه مشترک یا، دقیق‌تر، بر انکار فتیشیستی این گناه استوار است. برای نمونه، وقتی یک کمونیست در اتحاد جماهیر شوروی دهه ۱۹۳۰ با این سرزنش روبرو می‌شود که رژیم کمونیستی در حال وقوعِ تروری بی‌مانند است، هزاران نفر بدون اثبات گناه محکوم و اعدام می‌شوند، و اینکه کشاورزی یکسره ویران شده است، راهبرد واقعی او در پاسخ نه در انکار مستقیم این واقعیت‌ها، بلکه در این ادعاست که گویندگان این سرزنش‌ها «ناتوان از نفوذ به جوهر انچه در حال وقوع است» هستند و نمی‌توانند ظهور انسان نو، همبستگی بی‌طبقه را ببینند - یک کمونیست به‌خوبی می‌داند که میلیون‌ها نفر در اردوگاه‌ها جان می‌دهند، بااین‌حال این اگاهی فقط باور او را تایید می‌کند که «مردم واقعی» والا، شادمانه و پرشور سوسیالیسم را می‌سازند... هرچه واقعیت نکبت‌بارتر و افسرده‌کننده‌تر باشد، کمونیست استالینیستی راستین، محکم‌تر به فتیش خود می‌چسبد.</p><p style=\"direction: rtl; \">هر وفاداری به یک اجتماع در نهایت متضمن چنین فتیشی است که همچون انکار جرم بنیادین آن عمل می‌کند: آیا «آمریکا» فتیش فضایی بی‌نهایت گشوده نیست که به هر فرد امکان می‌دهد شادکامی را به شیوه خود دنبال کند؟ ماهیت این همبستگی-در-گناه می‌تواند بسیار خاص‌تر نیز باشد؛ مثلا وقتی رهبر در موقعیتی رسوایی‌آمیز گرفتار می‌شود، همبستگی گروه با انکار مشترک آن بدبیاری که ناکامی یا ناتوانی رهبر را برملا کرده تقویت می‌شود - یک دروغ مشترک به مراتب پیوند موثرتری برای گروه است تا حقیقت. شاید باید داستان «لباس جدید امپراتور» هانس کریستین آندرسن را از این منظر بازخوانی کرد: البته که همه می‌دانستند امپراتور برهنه است، اما دقیقا همین انکار این واقعیت بود که سوژه‌ها را کنار هم نگه می‌داشت - کودک بی‌نوا با بیان این واقعیت، پیوند اجتماعی را عملا از هم گسست.</p><p style=\"direction: rtl; \">بااین‌حال، این پارادوکس همبستگی-در-گناه به هیچ‌روی فقط در جوامع تمامیت‌خواه صادق نیست - کافی است به جوامع «مترقی» امروزی فکر کنیم: آیا ژست بنیادین ان‌ها ارتقای فتیشیستی نویسنده‌ای نیست (کاندیداهای معمول: الفرد هیچکاک، جین استین، ویرجینیا وولف...) که تمام خطاهای «سیاستِ ‌نادرست»شان از پیش بخشیده شده یا به‌عنوان براندازانه-مترقی به شیوه‌ای بی‌سابقه و پنهان بازتفسیر می‌شود... لذت این جامعه را دقیقا همین انکار جمعی تامین می‌کند - برای مثال، اصرار ما بر شخصیت «مترقی» هیچکاک، که کارایی نمادین آنچه آشکارا در این چارچوب نمی‌گنجد را به حالت تعلیق درمی‌آورد.</p><p style=\"direction: rtl; \">از این منظر، ما در نهایت همان کاری را می‌کنیم که کمونیست استالینیست غربی در دهه ۱۹۳۰ می‌کرد: او صادقانه از چرخش‌های خط حزب پیروی می‌کرد و نخست دشمن اصلی را در فاشیسم می‌دید، سپس به صلح‌طلبی متعهدی بدل می‌شد که مشتاقانه از پیمان شوروی و المان پشتیبانی می‌کرد و در برابر نظامی‌گری انگلیسی یا فرانسوی هشدار می‌داد، و سرانجام خواهان جبهه‌ای مشترک از تمام نیروهای «مترقی»، کمونیست‌ها و دموکرات‌های بورژوا، علیه فاشیسم می‌شد - این چرخش‌ها، به‌جای آنکه او را به دردسر بیندازند، تنها ایمان کمونیستی‌اش را تایید می‌کردند. یا - چنان‌که ژان-کلود میلنر می‌گوید - شاید کارکرد اصلی ارباب این باشد که دروغی را تثبیت کند که بتواند همبستگی گروه را حفظ کند: سوژه‌ها را با اظهاراتی که اشکارا با واقعیات در تضادند غافلگیر کند، و بارها و بارها ادعا کند که «سیاه سفید است»... در نتیجه، گفتن «کشور من، درست یا غلط!» کافی نیست - کشور من تنها تا انجا واقعا از آن من است که در نقطه‌ای تعیین‌کننده، در اشتباه باشد.</p><p style=\"direction: rtl; \">این تنش میان قانون عمومی و سویه مستهجن سوپرایگویی آن همچنین به ما امکان می‌دهد به مفهوم آلتوسری استیضاح ایدئولوژیک به شیوه‌ای تازه نزدیک شویم. نظریه آلتوسری «اپاراتوس‌های ایدئولوژیک دولت» و استیضاح ایدئولوژیک پیچیده‌تر از آن است که به نظر می‌رسد: وقتی آلتوسر به پیروی از پاسکال تکرار می‌کند «چنان رفتار کن که گویی باور داری، دعا کن، زانو بزن، و باور خواهی کرد، ایمان خودبه‌خود خواهد آمد»، او سازوکاری بازتابی و پیچیده از شالوده‌ریزی واپس‌نگرانه «خود-زاینده» را ترسیم می‌کند که بسیار فراتر از این ادعای تقلیل‌گرایانه است که باور درونی به رفتار بیرونی وابسته است. به بیان دیگر، منطق ضمنی استدلال او این است: زانو بزن و باور خواهی کرد که به خاطر باورت زانو زده‌ای - یعنی اینکه پیروی تو از آئین، بیان/اثر باور درونی توست. خلاصه اینکه، آئین «بیرونی» به‌طور اجراگرانه شالوده ایدئولوژیک خود را تولید می‌کند. در همین‌جاست که پیوند میان آئینی که به «آپاراتوس‌های ایدئولوژیک دولت» تعلق دارد و کنش استیضاح نهفته است: وقتی باور می‌کنم که به خاطر باورم زانو زده‌ام، هم‌زمان خود را در فراخوان دیگری که به من حکم کرده زانو بزنم \"بازمی‌شناسم\"....</p><p style=\"direction: rtl; \">در مورد استیضاح، ماجرا حتی پیچیده‌تر از این هم هست - «مثال» آلتوسر بیش از انچه نظریه‌پردازی خود او از آن بیرون می‌کشد در خود دارد. آلتوسر فردی را به تصویر می‌کشد که در حال قدم زدن بی‌خیالانه در خیابان، ناگهان پلیسی او را خطاب قرار می‌دهد: «هی، تو آنجا!». فرد با پاسخ دادن به این خطاب - یعنی با ایستادن و برگشتن به سوی پلیس - خود را همچون سوژه قدرت، سوژه دیگری بزرگ، بازشناسی کرده و برمی‌سازد:</p><p style=\"direction: rtl; \">\"ایدئولوژی «افراد را به سوژه تبدیل می‌کند (همه را تبدیل می‌کند) درست با همان عمل دقیقی که من آن را استیضاح یا فراخوانی نامیده‌ام، و می‌توان آن را بر اساس خطاب‌های روزمره پلیس (یا موارد مشابه) تصور کرد: \"هی، تو آنجا!\"</p><p style=\"direction: rtl; \">با فرض اینکه این صحنه نظری‌ای که تصور کرده‌ام در خیابان رخ دهد، فرد خطاب‌شده برمی‌گردد. با همین چرخش فیزیکی صدوهشتاد درجه‌ای، او سوژه می‌شود. چرا؟ چون بازشناخته که این خطاب «واقعا» متوجه او بوده، و اینکه «واقعا او بوده که مورد خطاب قرار گرفته» (و نه کسی دیگر). تجربه نشان می‌دهد که انتقال عملی خطاب‌ها چنان است که به ندرت فرد مورد نظر را از دست می‌دهند: فراخوان کلامی یا سوت، کسی که خطاب می‌شود همیشه بازمی‌شناسد که واقعا او بوده که خطاب شده است. و بااین‌حال این پدیده‌ای غریب است، پدیده‌ای که صرفا با «احساس گناه» قابل توضیح نیست، علیرغم شمار زیاد کسانی که \"چیزی وجدانشان را آزار می‌دهد\".</p><p style=\"direction: rtl; \">طبیعتا برای راحتی و وضوح این تئاتر نظری کوچکم ناچار بوده‌ام چیزها را در قالب یک توالی، با قبل و بعد، و بنابراین به شکل توالی زمانی ارائه دهم. افرادی در حال قدم زدن هستند. جایی (معمولا پشت سرشان) خطاب طنین می‌اندازد: «هی، تو آنجا!» یک فرد (در نُه مورد از ده مورد همان کسی است که باید باشد) برمی‌گردد، با این باور/ظن/آگاهی که این خطاب برای اوست، یعنی بازمی‌شناسد که «واقعا اوست» که مورد نظر خطاب بوده. اما در واقعیت این چیزها بدون هیچ توالی‌ای رخ می‌دهند. وجود ایدئولوژی و فراخوانی یا استیضاح افراد همچون سوژه‌ها یک چیز واحدند.\"</p><p style=\"direction: rtl; \">نخستین چیزی که در این قطعه به چشم می‌اید، ارجاع ضمنی آلتوسر به تز لکان درباره نامه‌ای است که «همیشه به مقصد می‌رسد»: نامه استیضاحی نمی‌تواند مخاطب خود را از دست بدهد، چرا که به دلیل سرشت «بی‌زمان» خود، تنها بازشناسی-پذیرش مخاطب است که آن را همچون یک نامه برمی‌سازد. بااین‌حال، ویژگی کلیدی قطعه نقل‌شده، انکار مضاعفی است که در آن در کار است: انکار تبیین بازشناسی استیضاحی با توسل به «احساس گناه»، و نیز انکار زمانمندی فرایند استیضاح (به‌طور دقیق، افراد «سوژه نمی‌شوند»، بلکه «همیشه پیشاپیش» سوژه‌اند). این انکار مضاعف را باید همچون انکاری فرویدی خواند: آنچه سرشت «بی‌زمان» استیضاح نادیدنی می‌کند، نوعی توالی نازمانمند است که بسیار پیچیده‌تر از «تئاتر نظری»‌ای است که آلتوسر به بهانه مشکوک «راحتی و وضوح» به صحنه می‌اورد.</p><p style=\"direction: rtl; \">این توالی «واپس‌رانده» به «احساس گناه»‌ای مربوط می‌شود که سرشتی صرفا صوری و «غیرپاتولوژیک» (به معنای کانتی) دارد، گناهی که، دقیقا به همین دلیل، سنگین‌ترین بار را بر دوش آن افرادی می‌نهد که «چیزی روی وجدانشان ندارند». به بیان دیگر، نخستین واکنش فرد به «هی، تو انجا!» پلیس دقیقا از چه تشکیل می‌شود؟ از ترکیبی ناسازگار از دو عنصر: (۱) چرا من، پلیس از من چه می‌خواهد؟ من بی‌گناهم، داشتم کار خودم را می‌کردم و قدم می‌زدم...؛ بااین‌حال، این اعتراض سرگشته بی‌گناهی همواره با (۲) نوعی احساس کافکایی نامعین از گناه «انتزاعی» همراه است، احساسی که، در چشم قدرت، من به‌طور پیشینی به‌طرز وحشتناکی گناهکار چیزی هستم، هرچند نمی‌توانم بدانم دقیقا گناه چه چیزی را دارم، و به همین دلیل - چون نمی‌دانم گناه چه چیزی را دارم - حتی گناهکارترم؛ یا، دقیق‌تر، گناه واقعی من درست در همین نااگاهی من نهفته است.</p><p style=\"direction: rtl; \">پس آنچه در اینجا داریم، تمامیت ساختار لکانی سوژه‌ای است که میان بی‌گناهی و گناه انتزاعی و نامعین دوپاره شده، و با فراخوانی غیرشفاف و غیرواضح که از سوی دیگری («هی، تو آنجا!») صادر می‌شود روبروست، فراخوانی که در آن برای سوژه روشن نیست که دیگری واقعا از او چه می‌خواهد Che vuoi؟ {از من چه می‌خواهی؟ -م} به‌طور خلاصه، آنچه در اینجا با آن روبروییم، استیضاح پیش از همذات‌پنداری است. پیش از بازشناسی در فراخوانِ دیگری که از رهگذر آن فرد خود را همچون سوژه‌یِ «همیشه پیشاپیش» برمی‌سازد، ناگزیر از تصدیق این لحظه «بی‌زمان» بن‌بست هستیم که در آن بی‌گناهی با گناه نامعین هم‌زمان می‌شود: همذات‌پنداری ایدئولوژیکی که از رهگذر آن یک ماموریت نمادین را بر عهده می‌گیرم و خود را همچون سوژه قدرت بازمی‌شناسم، تنها همچون پاسخی به این بن‌بست رخ می‌دهد.</p><p style=\"direction: rtl; \">پس دوباره به تنش میان قانون عمومی و سویه مستهجن سوپرایگویی آن بازمی‌گردیم: بازشناسی ایدئولوژیک در فراخوان دیگری، کنش همذات‌پنداری است، همذات‌پنداریِ خود همچون سوژه قانون عمومی، به عهده گرفتن جایگاه خود در نظم نمادین؛ حال‌ آنکه «گناه» انتزاعی و نامعین، سوژه را با فراخوانی نفوذناپذیری روبرو می‌کند که دقیقا مانع همذات‌پنداری، بازشناسی ماموریت نمادین فرد می‌شود. پارادوکس در اینجا این است که سویه مستهجن سوپرایگویی، در یک ژست واحد، هم پشتیبان ضروری قانون نمادین عمومی است و هم دور باطل تروماتیک، همان بن‌بستی که سوژه با پناه بردن به قانون عمومی می‌کوشد از آن بگریزد - قانون عمومی برای انکه خود را تثبیت کند، باید در برابر شالوده خود مقاومت کند و آن را نادیدنی سازد.</p><p style=\"direction: rtl; \">پس انچه در نظریه استیضاح آلتوسر «نیندیشیده» باقی می‌ماند، این واقعیت است که پیش از بازشناسی ایدئولوژیک، لحظه‌ای میانی از استیضاح مستهجن و نفوذناپذیر بدون همذات‌پنداری داریم، نوعی «واسطه محوشونده<a href=\"#2\">[2]</a>» که اگر سوژه بخواهد به هویت نمادین دست یابد - یعنی ژست سوبژکتیوسازی را به انجام رساند - باید نادیدنی شود. به‌طور خلاصه، امر«نیندیشیده» در آلتوسر این است که پیشاپیش سوژه‌ای غریب وجود دارد که مقدم بر ژست سوبژکتیوسازی است. ایا این «سوژه پیش از سوبژکتیوسازی» برساختی صرفا نظری و در نتیجه بی‌فایده برای تحلیل اجتماعی انضمامی نیست؟ شواهد خلاف آن را می‌توان در آن ترکیب زبانی‌ای یافت که مددکاران اجتماعی به‌طور مکرر برای بیان تجربه‌شان از بزهکار نوجوان «ضداجتماعی» به کار می‌برند که فاقد چیزی است که ما به‌لحاظ ایدئولوژیک «حس ابتدایی شفقت و مسئولیت اخلاقی» می‌نامیم: وقتی به چشمانش نگاه می‌کنی، انگار «کسی خانه نیست.»</p><p style=\"direction: rtl; \">متن کلیدی آلتوسر در اینجا «سه یادداشت درباره نظریه گفتمان‌ها» از سال ۱۹۶۶ است. آلتوسر در یادداشت نخست، این فرضیه را پیش می‌نهد که هر یک از چهار نوع بنیادین گفتمان، شیوه خاصی از سوبژکتیویته را در خود دارد و اثر سوژه خاص خود را پدید می‌اورد. در گفتمان ایدئولوژیک، سوژه شخصا حاضر است. در گفتمان علمی، شخصا غایب است. در گفتمان زیبایی‌شناختی، از طریق اشخاص واسطه حاضر است. و در گفتمان ناخوداگاه، سوژه نه حاضر است و نه صرفا غایب، بلکه شکافی است که یک جایگاه نمایندگی‌اش می‌کند. اما در یادداشت سوم، آلتوسر ناگهان عقب می‌نشیند و سوژه را به گفتمان ایدئولوژیک محدود می‌کند و تاکید می‌کند که تنها به‌طور استعاری می‌توان از سوژه علم یا سوژه ناخوداگاه سخن گفت. با پذیرش این موضع، ناچاریم خود مفهوم سوژه دوپاره را هم کنار بگذاریم. به گفته آلتوسر، سوژه دوپاره‌ای وجود ندارد، فقط سوژه هست به‌علاوه آن ورطه‌ای که میان سوژه و نظم گفتمان دهان باز کرده؛ فقدان سوژه را نمی‌توان سوژه نامید. خلاصه اینکه لکان به‌ناروا خلا را، یعنی همان شکافی که این‌همانی سوژه را ویران می‌کند، با خود سوژه یکی می‌گیرد.</p><p style=\"direction: rtl; \">موضع لکانی در اینجا ما را وامی‌دارد که کمی با آلتوسر، یعنی همان آلتوسر صاحب چهار اثر سوژه، همراه شویم، نه با آلتوسر دوم که سوژه را محدود به ایدئولوژی می‌کند. محدود کردن سوژه به ایدئولوژی یک عقب‌گرد نظری اشکار است. چهار اثر سوژه در آلتوسر یکم وزن یکسانی ندارند. برای نقش سوژه اصلی دو نامزد وجود دارد: یا سوژه ایدئولوژیک که شخصا حاضر است، یا سوژه ناخوداگاه که شکافی در ساختار ($) است و تنها با یک دال نمایندگی می‌شود. آلتوسر گزینه اول، یعنی جایگاه ایدئولوژیک سوژه را برگزید، حال‌انکه از دیدگاه لکانی گزینه دوم بسیار پربارتر است. این گزینه به ما امکان می‌دهد سه اثر سوژه دیگر را همچون اشتقاقات و استتارهای همان شکاف در ساختار بفهمیم، یعنی همچون سه شیوه‌ای که سوژه با آن شکافِ ساختاری‌ای که خود همان سوژه است کنار می‌اید.</p><p style=\"direction: rtl; \">خوانش سمپتومی خود آلتوسر نیز استدلالی اضافی به سود گزینه لکانی به دست می‌دهد. ایا چرخشی که در نظریه آلتوسر با مقاله «لنین و فلسفه» اعلام می‌شود، یعنی کنار گذاشتن انتقادی انحراف نظریه‌گرایانه، تاکید بر مبارزه طبقاتی در نظریه، و خودارجاعی نظریه، به این معنا که نظریه در درون ابژه خودش قرار دارد، نوعی بازگشت واپس‌رانده و بازگشت بُعد سوژهِ دال نیست؟ انچه در اینجا معنا‌دار است، تعریف تازه آلتوسر از فلسفه است که این چرخش را فشرده می‌کند: فلسفه دیگر نظریه‌یِ کردار نظری نیست، بلکه بازنمایی سیاست، یعنی همان مبارزه طبقاتی، در نظریه است. ایا این روایت روشنی از قاعده لکانی نیست که یک دال، سوژه را برای دالی دیگر بازنمایی می‌کند؟ مبارزه طبقاتی در مقام شکافی که از تمامیت‌یافتن جلوگیری می‌کند، تنها سوژه راستین تاریخ است، و فلسفه همان دال ارباب (S<sub>1</sub>)&nbsp;است که سوژه، یعنی مبارزه طبقاتی را برای نظریه، درون میدان دانش (S<sub>2</sub>) بازنمایی می‌کند.&nbsp;</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>کوندرا، یا، چطور از بوروکراسی لذت ببریم</b></p><p style=\"direction: rtl; \">باید بر بعد ذاتا سیاسیِ مفهوم لذت تاکید گذاشت - بر نحوه‌ای که این هسته لذت همچون یک عامل سیاسی عمل میکند. بیایید این بعد را از طریق یکی از معماهای زندگی فرهنگی در اروپای شرقی پسا-سوسیالیستی بررسی کنیم: چرا میلان کوندرا حتی حالا، پس از پیروزی دموکراسی، به نوعی طردشدگی در بوهم دچار است؟ اثارش به ندرت منتشر می‌شوند، رسانه‌ها در سکوت از کنارشان می‌گذرند، همه به شکلی از حرف زدن درباره‌اش خجالت می‌کشند... برای توجیه این برخورد، داستانهای قدیمی را پیش می‌کشند: همکاری پنهانش با رژیم کمونیستی، پناه بردنش به لذت‌های خصوصی و اجتناب از درگیری اخلاقی سرراست به شیوه هاول، و چیزهایی از این دست. بااینحال، ریشه این مقاومت عمیق‌تر است - کوندرا پیامی را منتقل میکند که برای اگاهی دموکراتیک «عادی‌سازی‌شده» تحمل‌ناپذیر است:</p><p style=\"direction: rtl; \">• در نگاه نخست، به نظر میرسد محور اساسی‌ای که به جهان آثار او ساختار می‌دهد، تقابل است میان پاتوس پرطمطراق ایدئولوژی رسمی سوسیالیستی و جزیره‌های زندگی خصوصی روزمره، با شادی‌ها و لذت‌های کوچکش، خنده‌ها و اشک‌هایش، که دور از دسترس ایدئولوژی هستند. این جزیره‌ها به ما امکان می‌دهند فاصله‌ای بگیریم که این فاصله، ائین ایدئولوژیک را در تمامی خودنماییِ پوچ، مضحک و بی‌معناییِ گروتسک‌اش مرئی می‌سازد: ارزشش را ندارد که علیه یک ایدئولوژی رسمی با سخنرانی‌های رقت‌انگیز درباره آزادی و دموکراسی شورش کرد - دیر یا زود، چنین شورشی به نسخه‌‎ای تازه از «راهپیماییِ بزرگ»، از وسواس ایدئولوژیک می‌انجامد... اگر کوندرا را به چنین رویکردی فرو‌ بکاهیم، انگاه به راحتی می‌توان با توسل به بینش اساسا «آلتوسری» واتسلاو هاول ردش کرد: بینشی که میگوید نهایی‌ترین شکل هم‌نوایی دقیقا همین موضع «غیرسیاسی» است که در ملاعام از ائین تحمیلی اطاعت میکند و در خلوت خود را به طنز کلبی‌وار می‌سپارد. کافی نیست بگوییم ائین ایدئولوژیک صرفا ظاهری است که هیچکس جدی‌اش نمی‌گیرد - همین ظاهر اساسی است، و به همین دلیل باید ریسک کرد و از مشارکت در ائین عمومی سر باز زد (نمونه معروف هاول را ببینید از مقاله‌اش بنام «قدرت ناتوانان»، درباره مردی معمولی، یک سبزی‌فروش، که البته به سوسیالیسم باور ندارد؛ اما وقتی موقعیت ایجاب کند، با وظیفه‌شناسی ویترین فروشگاهش را با شعارهای رسمی حزب تزئین می‌کند و غیره).</p><p style=\"direction: rtl; \">• بنابراین باید یک قدم فراتر رفت و در نظر گرفت که به‌هیچوجه نمیتوان به سادگی از ایدئولوژی کنار کشید: غرق شدن خصوصی در کلبی‌گری، غرق شدن در لذت‌های خصوصی، و چیزهایی از این قبیل - همه این‌ها دقیقا همان نحوه‌ عملکرد ایدئولوژی توتالیتر در زندگی روزمره «غیرایدئولوژیک» است، همان نحوه که این زندگی توسط ایدئولوژی تعین می‌یابد، همان نحوه که ایدئولوژی «در آن در غیاب حضور دارد»، اگر بشود به این ترکیب از دوران قهرمانی ساختارگرایی متوسل شد. سیاست‌زدایی از حوزه خصوصی در جوامع سوسیالیستی متاخر «اجباری» است، و با منع اساسی بحث سیاسی آزاد نشان‌دار شده است؛ به همین دلیل، چنین سیاست‌زدایی‌ای همواره همچون فرار از انچه واقعا در میان است عمل می‌کند. این نکته بارزترین ویژگی رمان‌های کوندرا را توضیح می‌دهد: حوزه خصوصی سیاست‌زدایی‌شده به‌هیچروی همچون قلمرو آزاد لذت‌های معصومانه عمل نمی‌کند؛ همیشه چیزی مرطوب، کلاستروفوبیک، غیراصیل، و حتی نومیدانه در تلاش شخصیت‌ها برای لذت‌های جنسی و دیگر لذت‌ها وجود دارد. از این منظر، درس رمان‌های کوندرا دقیقا نقطه مقابل تکیه ساده‌لوحانه بر حوزه خصوصی معصومانه است: ایدئولوژی سوسیالیستی توتالیتر از درون، همان حوزه‌ خصوصی‌ای را که به آن پناه می‌بریم، فاسد می‌کند.</p><p style=\"direction: rtl; \">بااین‌حال، این بینش هنوز قطعی نیست. یک گام دیگر در اینجا لازم است، چرا که درس کوندرا حتی مبهم‌تر از اینهاست. علیرغم آن حس مفلوکانه حوزه خصوصی، این واقعیت همچنان پابرجاست که موقعیت توتالیتر مجموعه‌ای از پدیده‌ها را پدید اورد که روایت‌های پرشمار زندگی روزمره در شرق سوسیالیست گواه آن هستند: در واکنش به سلطه ایدئولوژیک توتالیتر، نه‌تنها گریزی کلبی‌وار به «زندگی خوب» و لذت‌های خصوصی روی داد، بلکه شکوفایی خارق‌العاده‌ای از دوستی اصیل، دیدارهای مکرر، شام‌های مشترک، و گفت‌وگوهای پرشور فکری در محافل بسته نیز شکل گرفت - ویژگی‌هایی که معمولا بازدیدکنندگان غربی را مسحور می‌کرد. البته مشکل اینجاست که هیچ راهی برای کشیدن خط تمایزی روشن میان این دو سوی ماجرا نیست: این‌ها دو روی یک سکه‌اند، و به همین دلیل با فرارسیدن دموکراسی، هر دو از دست می‌روند. از اعتبار کوندرا است که این ابهام را پنهان نمی‌کند: روح «اروپای میانه»، روح دوستی اصیل و معاشرت فکری، تنها در بوهم، مجارستان و لهستان، همچون شکلی از مقاومت در برابر سلطه ایدئولوژیک توتالیتر جان به در برد.</p><p style=\"direction: rtl; \">• شاید گامی دیگر نیز در اینجا لازم باشد: نفسِ تبعیت از نظم سوسیالیستی لذتی خاص پدید می‌اورد - نه‌تنها لذت حاصل از این اگاهی که مردم در جهانی می‌زیستند که از عدم‌قطعیت مبرا بود، چون نظام پاسخی برای همه‌چیز داشت (یا وانمود می‌کرد که دارد)، بلکه بیش از همه لذت ناشی از خودِ حماقت نظام - کیف‌کردن از تهی‌بودگی ائین رسمی، از کلیشه‌های نخ‌نما و سبکی گفتمان ایدئولوژیک غالب. (کافی است به یاد بیاوریم که برخی از ترکیب‌های کلیدی استالینیستی تا چه حد به بخشی از اصطلاحات طنزامیز حتی میان روشنفکران غربی بدل شدند: «مسئولیت عینی» و چیزهایی از این قبیل).</p><p style=\"direction: rtl; \">نمونه‌ای مثال‌زدنی از این لذت که به ماشین بوروکراتیک «توتالیتر» تعلق دارد را صحنه‌ای از فیلم برزیل ساخته تری گیلیام به دست می‌دهد: در راهروهای هزارتوی یک ساختمان عظیم دولتی، یک مقام بلندپایه با گام‌های سریع پیش می‌رود و عده‌ای کارمند دون‌پایه به دنبالش روانه‌اند و مستاصلانه می‌کوشند خودشان را به او برسانند؛ آن مقام نقش یک مرد به‌شدت پرمشغله را بازی می‌کند، اسناد را بازبینی می‌کند و به افراد دوروبرش فرمان می‌دهد، درحالی‌که تند و با عجله راه می‌رود، انگار که می‌خواهد به جلسه مهمی برسد ولی دیرش شده است. وقتی این مقام به قهرمان فیلم (جاناتان پرایس) برمی‌خورد، چند کلمه‌ای با او ردوبدل می‌کند و بعد با همان شتاب همیشگی به جلو می‌رود... اما نیم ساعت بعد، قهرمان فیلم دوباره او را در راهرویی دور می‌بیند که همچنان همان راهپیمایی ائینی بی‌معنایش را ادامه می‌دهد. لذت درست در همین بی‌معنایی رفتار آن مقام نهفته است: هرچند راه رفتن-ادای انجام وظیفه را در اوردن به شیوه‌ای دیوانه‌وار، از «استفاده بهینه» از تک تک دقایق تقلید می‌کند، اما به‌معنای دقیق کلمه بی‌هدف است - ائینی محض که تا بی‌نهایت تکرار می‌شود.</p><p style=\"direction: rtl; \">اهنگساز معاصر روس، الفرد اشنیتکه، در اپرایش «زندگی با یک ابله» موفق شد این ویژگی را افشا کند: انچه «استالینیسم» نامیده می‌شود، ما را با همان چیزی روبه‌رو می‌کند که لکان آن را حماقت ذاتیِ خودِ دال می‌نامید. اپرا داستان مردی متاهل و معمولی («من») را روایت می‌کند که تحت مجازاتی که حزب تعیین کرده، ناچار می‌شود فردی را از تیمارستان به خانه‌اش بیاورد تا با خانواده‌اش زندگی کند؛ این ابله، ووا، که به نظر یک روشنفکر عادی ریشو و عینکی می‌اید و مدام عبارات سیاسی بی‌معنا تحویل می‌دهد، خیلی زود رنگ واقعی خود را همچون مزاحمی مستهجن نشان می‌دهد، به این ترتیب که نخست با زن «من» و سپس با خود «من» رابطه جنسی برقرار می‌کند. تا انجا که ما در جهان زبان زندگی می‌کنیم، محکوم به این حماقت سوپرایگویی هستیم: می‌توانیم حداقلی از فاصله را نسبت به آن بگیریم و بدین ترتیب تحمل‌پذیرترش کنیم، اما هرگز نمی‌توانیم از شرش خلاص شویم...</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><span style=\"font-weight: 700;\">«</span><b>میل خودت را رها نکن</b><span style=\"font-weight: 700;\">!</span><span style=\"font-weight: 700;\">»</span></p><p style=\"direction: rtl; \">با بررسی دقیق‌تر، سوپرایگو چگونه ساختاربندی شده است؟ یون الستر در خوانش موشکافانه‌اش از زینوویف، تعریفی صوری از سازوکار ابتدایی «توتالیتر» پیش می‌نهد: اتصال کوتاهی میان نفی بیرونی و نفی درونی - یعنی، در سطح منطق وظیفه‌ای، اتصال کوتاهی میان عدم-الزام و ممنوعیت. نفی بیرونیِ الزام ما به انجام D این است که ما مجبور نیستیم D را انجام دهیم؛ نفی درونی این است که ما مجبوریم غیر-D&nbsp; را انجام دهیم. در یک جامعه توتالیتر، هر عدم-الزامی گرایش دارد که همچون ممنوعیت تفسیر شود. این گرایش را می‌توان با نمونه‌های پرشماری، از انتخابات و امکان انتقاد گرفته تا وسواس توتالیتر درباره «توطئه‌ها» توضیح داد. انتخابات رسما آزاد است، هرکس می‌تواند رای موافق یا مخالف بدهد؛ بااین‌حال همه می‌دانند که در واقع چگونه باید رای دهند - یعنی می‌دانند که رای مخالف دادن برایشان ممنوع است. رسما انتقاد نه‌تنها مجاز که حتی تشویق هم می‌شود، اما همه می‌دانند که تنها انتقاد «سازنده» - یعنی هیچ انتقادی - عملا تحمل می‌شود. بدین ترتیب، شکستِ قصد ما، تغییر شکل می‌دهد (به زبان هگلی: «در خود بازتابیده می‌شود») به شکستی قصدشده: وقتی فلان پروژه رژیم کمونیستی به طرز فلاکت‌باری شکست می‌خورد چون اهداف ناممکن‌اش مقاومتی منفعلانه در میان مردم پدید اورد، این شکست بی‌درنگ همچون نتیجه توطئه‌ای تفسیر می‌شود که دشمنان رژیم طراحی کرده‌اند.</p><p style=\"direction: rtl; \">ساختار زیرین چنین اتصال کوتاهی متضمن نوعی دگردیسی روان‌پریشانه در «مربع نشانه‌شناختی» ضرورت، امکان، ناممکنی و پیشامد است: در یک جهان کاملا «توتالیتر» ما تنها با ضرورت و ناممکنی سروکار داریم. تصمیم تصادفی و غیرضروری رهبری حزب خود را همچون بیانی از ضرورت تاریخی جا می‌زند، و به همین دلیل هر شکلی از مقاومت در برابر چنین تصمیمی - هرچند رسما ممکن است - در واقع ناممکن است، یعنی ممنوع است. این دگردیسی بدین ترتیب پارادوکس انتخاب اجباری را پدید می‌اورد، که بنا بر آن در واقع به ما اجازه داده می‌شود تنها یکی از دو گزینه را برگزینیم، و گزینه دیگر مجموعه‌ای تهی باقی می‌ماند (این پارادوکس چیزی جز همان بندگی خودخواسته نیست). و همین اتصال کوتاه است که ابتدایی‌ترین تعریف سوپرایگو را به دست می‌دهد: سوپرایگو قانونی است که «از کوره در رفته»، تا انجا که انچه را رسما مجاز می‌شمرد ممنوع می‌کند.</p><p style=\"direction: rtl; \">جایگاه سوپرایگو در ماتریس نگرش‌های اخلاقی گوناگون کجاست؟ در اینجا ارجاع به فیلم‌های اورسن ولز می‌تواند یاری‌رسان باشد. ولز وسواس زیادی نسبت به شخصیت «فراتر از زندگی» دارد، از کورتس در نخستین پروژه سینمایی (تحقق‌نیافته)‌اش، قلب تاریکی، گرفته تا همشهری کین، امبرسن‌های باشکوه، نشانی از شر، اقای ارکادین، و سرانجام فالستف در ناقوس‌های نیمه‌شب. این شخصیتِ «فراتر از زندگی» با رابطه دوسویه‌اش با اخلاقیات مشخص می‌شود: او بی‌اعتنا هنجارهای اخلاقی رایج را زیر پا می‌گذارد و به خیر هم‌نوعانش بی‌توجهی می‌کند، و بی‌رحمانه ان‌ها را برای اهداف خود بهره می‌کشد، بااین‌حال یکسره وقف هدف خود و همچنین سخاوتمند است، درست نقطه مقابل یک نگرش سوداگرانه حقیر محاسبه‌گر، چنان‌که نمی‌توان گفت صرفا غیراخلاقی است - اعمال او، «اخلاق خودِ زندگی» ژرف‌تری را متشعشع می‌کند که خود را درگیر ملاحظات کوته‌نظرانه ما نمی‌کند. ولز این اشخاص را «عقرب‌ها» می‌نامید، برگرفته از داستان عقربی که قورباغه‌ای را که او را بر پشت خود از عرض جوی اب می‌برد نیش می‌زند: عقرب می‌داند که در نتیجه خودش هم غرق خواهد شد، اما نمی‌تواند جلو خود را بگیرد، چون طبیعتش چنین است. ولز در مصاحبه‌ای با کایه دو سینما حتی بر تفاوتی میان گورینگ و هیملر اصرار می‌ورزید: هیملر «ابتذال شر» بود، کارمندی که ماشین کشتار گشتاپو را مثل یک اداره پست شهری کوچک می‌چرخاند؛ حال‌انکه گورینگ شخصیتی رنسانسی بود، در عین شریر بودن روشن‌اندیش و فراخ‌نظر.</p><p style=\"direction: rtl; \">اگر تقابل اخلاق<a href=\"#3\">[3]</a>&nbsp;و اخلاقیات<a href=\"#4\">[4]</a>&nbsp;را به صورت مربع نشانه‌شناختی گریماسی، نشان دهیم، ماتریس مفهومی زیرین اشکار می‌شود:</p><p style=\"direction: rtl; \"><img src=\"https://i.postimg.cc/ZY8fxGBL/zizek-s-thing.png\" style=\"width: 427.714px; height: 411.672px;\"></p><p style=\"direction: rtl; \"><img src=\"https://i.postimg.cc/Tw9DpJ1g/image.png\" style=\"width: 369.857px; height: 192.017px;\"><br></p><p style=\"direction: rtl; \"> در بالا و پایین دو موضع تخت داریم: قدیس هم اخلاقی است (میل خود را به سازش نمی‌کشد) و هم پایبند به اخلاقیات (خیر دیگران را در نظر می‌گیرد)، حال‌انکه شرور بدون اخلاقیات است (هنجارهای اخلاقی را نقض می‌کند) و نااخلاقی (انچه در پی آن است نه میل، بلکه لذت‌ و سود، در نتیجه فاقد هرگونه اصول استوار است). بسیار جالب‌تر دو موضع افقی‌اند که انتاگونیسمی درونی را بیان می‌کنند: قهرمان بدون اخلاقیات {Morals} است، بااین‌حال اخلاقی {Ethics} - به این معنا که هنجارهای اخلاقی اشکار موجود را به نام اخلاق والاتر زندگی، ضرورت تاریخی و امثالهم نقض می‌کند (یا بهتر بگوییم، اعتبارشان را به تعلیق درمی‌اورد)، حال‌انکه سوپرایگو درست نقطه مقابل قهرمان را مشخص می‌کند، یک قانونِ اخلاقیاتی {Morals} نااخلاقی {Ethics}، قانونی که در آن لذتی مستهجن به اطاعت از هنجارهای اخلاقی چسبیده است (مثلا معلمی سخت‌گیر که شاگردانش را به خاطر خیر خودشان شکنجه می‌دهد، و حاضر نیست سرمایه‌گذاری سادیستیک خود را بر روی این شکنجه به رسمیت بشناسد.).</p><p style=\"direction: rtl; \">بااین‌حال، این به هیچ‌وجه به این معنا نیست که در قلمرو اخلاقی، راهی برای احتراز از تنش میان قانون و سوپرایگو وجود ندارد. اصل موضوعه لکان برای اخلاق روان‌کاوی («میل خود را به سازش نکشاندن») را نباید با فشار سوپرایگو اشتباه گرفت. به این معنا که، در یک نگاه نخست ممکن است به نظر برسد که اصل «میل خود را رها نکن!» با فرمان سوپرایگویی «لذت ببر!» هم‌پوشانی داشته باشد - ایا ما دقیقا با چشم‌پوشی از لذت نیست که میل خود را به سازش می‌کشیم؟ ایا این یکی از تزهای بنیادین فروید، نوعی از پیش‌پاافتاده‌ترین باورهای فرویدی نیست که سوپرایگو هسته اصلی و «بدوی» کارگزاری اخلاقی را می‌سازد؟ لکان برخلاف این باورهای پیش‌پاافتاده حرکت می‌کند: او میان اخلاقِ میل و سوپرایگو، رابطه‌ای از جنس طرد رادیکال قرار می‌دهد. به این معنا که، لکان «پارادوکس اقتصادی» فرویدیِ سوپرایگو را جدی و تحت‌اللفظی می‌گیرد - یعنی همان دور باطلی را که مشخصه سوپرایگو است: هرچه بیشتر خود را تسلیم الزام سوپرایگویی کنیم، فشار آن بیشتر می‌شود و بیشتر احساس گناه می‌کنیم. بنا به نظر لکان، این «احساس گناه» خودفریبی‌ای نیست که در جریان درمان روان‌کاوی زدوده شود - ما واقعا گناهکاریم: سوپرایگو انرژی فشاری را که بر سوژه وارد می‌کند از همین واقعیت می‌گیرد که سوژه به میل خود وفادار نبوده، که آن را ترک کرده است. فداکاری ما برای سوپرایگو، ادای سهم ما به آن، تنها گناه ما را تایید می‌کند. به همین دلیل بدهی ما به سوپرایگو قابل بازپرداخت نیست: هرچه بیشتر بازپرداخت کنیم، بیشتر بدهکار می‌شویم. سوپرایگو مثل اخاذی است که ارام‌ارام خون ما را تا سر حد مرگ می‌مکد - هرچه بیشتر به او برسد، چنگش بر ما محکم‌تر می‌شود.</p><p style=\"direction: rtl; \">الگوی نمونه‌وار این پارادوکس سوپرایگو، بی‌گمان، اثر ادبی فرانتس کافکاست: «گناه نامعقول» مشهور قهرمان کافکایی گواهی می‌دهد بر اینکه او جایی میل خود را به سازش کشانده است. بااین‌حال، برای پرهیز از کلیشه‌ها، بهتر است به اثر کلودلو دو لاکلو، روابط خطرناک، رجوع کنیم: وقتی والمون به مارکیز دو مرتوی می‌گوید که «تقصیر من نیست»، «از کنترل من خارج است»، به‌عنوان بهانه‌ای برای اینکه چرا عاشق پرزیدنت دو تورول شده، از این طریق تایید می‌کند که «میل خود را به سازش کشانده» و به امری بیمارگون تن داده - یعنی گناهکار است. او برای تبرئه خود در چشمان مارکیز، سپس پرزیدنت را قربانی می‌کند و با همان کلمات طردش می‌کند («تقصیر من نیست» اگر دیگر دوستت ندارم، چون از کنترل من خارج است). بااین‌حال، این قربانی‌کردن به‌هیچ‌وجه او را قادر نمی‌سازد از گناهش خلاص شود - درست برعکس، گناهش دوبرابر می‌شود؛ او به پرزیدنت خیانت می‌کند بی‌انکه ذره‌ای از گناهش در چشمان مارکیز بکاهد. دور باطلی که وقتی «میل خود را ترک می‌کنیم» در آن گرفتار می‌اییم از همین قرار است: هیچ راه ساده‌ای برای بازگشت نیست، چرا که هرچه بیشتر بکوشیم با قربانی کردن ابژه بیمارگونی که ما را به خیانت به میلمان واداشت خود را تبرئه کنیم، گناهمان بیشتر می‌شود.</p><p style=\"direction: rtl; \">اخلاق لکانی بدین ترتیب مستلزم گسستی رادیکال میان وظیفه و در نظر گرفتن خیر است. به همین دلیل لکان به کانت ارجاع می‌دهد، به ژست کانتیِ کنار گذاشتن خیر همچون انگیزه یک کنش اخلاقی: لکان اصرار می‌ورزد که خطرناک‌ترین شکل خیانت نه تسلیم مستقیم به تکانه‌های «بیمارگون» ما، بلکه توسل به نوعی خیر است، مثلا وقتی با این بهانه که ممکن است به خیر (خود یا عموم) اسیب بزنم، از وظیفه‌ام شانه خالی می‌کنم - لحظه‌ای که «شرایط» یا «پیامدهای نامطلوب» را بهانه می‌اورم، در مسیر تباهی گام نهاده‌ام. دلایلی که به خاطر ان‌ها میلم را به سازش می‌کشم می‌توانند بسیار قانع‌کننده و موجه، حتی شرافتمندانه باشند؛ می‌توانم هر چیزی را بهانه کنم، از جمله اسیب زیست‌محیطی را. شگرد تراشیدن بهانه بی‌مرز است؛ ممکن است کاملا «حقیقت» داشته باشد که رفاه هم‌نوعانم با کنش من به خطر افتاده، بااین‌حال ورطه‌ای که اخلاق را از در نظر گرفتن خیر جدا می‌کند، همچنان ناممکنِ گذر باقی می‌ماند. میل و صلابت اخلاقی کانتی در اینجا در بی‌اعتنایی‌شان به «مطالبات واقعیت» با یکدیگر هم‌راستا می‌شوند: هیچ‌ یک از بهانه‌های شرایط یا پیامدهای نامطلوب را نمی‌پذیرند، و به همین دلیل لکان در نهایت ان‌ها را این‌همان می‌گیرد («قانون اخلاقی، اگر دقیق‌تر بنگریم، صرفا میل است در حالت ناب خود»).</p><p style=\"direction: rtl; \">پس ادعای بدنام فروید مبنی بر اینکه زنان فاقد سوپرایگو هستند - یا دست‌کم سوپرایگوی زن ضعیف‌تر از سوپرایگوی مرد است - در نوری کاملا تازه ظاهر می‌شود: فقدان سوپرایگو در زنان گواهی است بر اخلاق ان‌ها. زنان نیازی به سوپرایگو ندارند، چون گناهی ندارند که سوپرایگو بر آن انگل‌وار تغذیه کند - چون، به این معنا، بسیار کمتر مستعد به سازش کشاندن میل خود هستند. اصلا تصادفی نیست که لکان به‌عنوان نمونه یک نگرش اخلاقی ناب، انتیگونه را فرامی‌خواند، زنی که {میل خود را -م} «ترک نکرد»: پیشاپیش، در سطحِ شهودی و پیشا-نظری، روشن است که او کاری را که می‌کند به خاطر فشار سوپرایگو نمی‌کند - سوپرایگو اینجا کاری ندارد. انتیگونه گناهکار نیست، هرچند اصلا خود را به خیر اجتماع، به پیامدهای فاجعه‌بار محتمل کنش خود مشغول نمی‌کند. پیوند میان سوپرایگوی مردانه و این واقعیت که در مرد حس خیر اجتماع بسیار بیش از زن ابراز می‌شود، در همین‌جاست: «خیر اجتماع» بهانه استاندارد برای به سازش کشاندن میل ماست. سوپرایگو انتقامی است که گناه ما را به سرمایه تبدیل می‌کند - یعنی بهایی که برای گناهی می‌پردازیم که با خیانت به میلمان به نام خیر مرتکب می‌شویم. به بیان دیگر، سوپرایگو سویه معکوس ضروری، سویه زیرین ضروریِ اگو-ایدئال است، همان هنجارهای اخلاقی‌ای که بر خیر اجتماع مبتنی‌اند.</p><p style=\"direction: rtl; \">این اخلاقِ پابرجا ماندن در میل خود صرف‌نظر از خیر عمومی، ناگزیر اضطراب پدید می‌اورد: ایا چنین نگرشی رادیکال به حوزه انحصاری چند «قهرمان» تعلق ندارد، حال‌انکه ما ادم‌های معمولی نیز حق داریم زنده بمانیم؟ در نتیجه، ایا ما به اخلاقی «معمولی» از «خیر عمومی» و عدالت توزیعی هم نیاز نداریم که نیازهای اکثریت را براورده کند، هرچند در چشمان اخلاق قهرمانانه خودکشی‌خواهانه‌ای که لکان از آن دفاع می‌کند حقیر به نظر برسد؟ ترس از این خصلت «افراطی» اخلاق میل لکانی، از این «بگذار ارزوی من براورده شود، حتی اگر جهان نابود گردد»، را می‌توان حتی در کانت نیز مشاهده کرد، کسی که به گفته لکان نخستین کسی بود که اخلاق میل را، که ملاحظات بیمارگون را نادیده می‌گیرد، صورتبندی کرد: ایا این محدودیتی که «چه می‌شد اگر همه مثل من عمل می‌کردند؟» تحمیل می‌کند، شکل ابتدایی شیوه‌ای نیست که ما میلمان را ترک می‌کنیم؟ میلت را ترک کن، چون تعمیم‌پذیر نیست!</p><p style=\"direction: rtl; \">ایا این به حساب اوردن امکان تعمیم‌پذیری کنش ما، بی‌سروصدا ملاحظه پاتولوژیک پیامدهایِ کنش ما در واقعیت را وارد نمی‌کند؟ در همین سطح است که می‌توانیم لحظه دقیق سازش اخلاقی بودیسم را نیز مشخص کنیم: در بودیسم مهایانه، وقتی تمایز میان چرخ «بزرگ» و «کوچک» را پذیرفتند - یعنی ضرورت صورتبندیِ یک اخلاق «فرعی»، یعنی قواعد رفتاری برای مردم عادی که ناتوان از چشم‌پوشی از سکسوالیته و جز اینها هستند، در کنار یک اموزه «ناب» برای کسانی که پیشاپیش قادر به غلبه بر زیاده‌خواهی در همین زندگی هستند. در تقابل اشکار با این، لکان بر الزامِ مسئله‌ساز «میل خود را رها نکن» پافشاری می‌کند، هرچند می‌داند که این الزام تعمیم‌پذیر نیست.</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>ایگو-شر، سوپرایگو-شر، اید-شر</b></p><p style=\"direction: rtl; \">تجربه دوران معاصر، ما را وامی‌دارد که این تصویر را پیچیده‌تر کنیم. به بیان دیگر، انچه در موج تازه خشونت علیه مهاجران به چشم می‌خورد، سطح «بدوی» زیرلایه‌ی اقتصاد لیبیدینال است - «بدوی» نه به معنای «واپس‌روی» به لایه‌ای باستانی، بلکه به معنای سرشتِ به‌غایت ابتدایی رابطه میان لذت و ژوئیسانس، میان دایره اصل لذت که در پی تعادل است، در پی بازتولید مدار بسته خود، و بدن بیگانهِ بیرون بوده‌یِ درونی {ex-timate}. اقتصاد لیبیدینالی که شعار ننگین «خارجی‌ها بیرون!» را پشتیبانی می‌کند، می‌تواند با طرحواره تور حلقه‌ای لکان مثال زده شود، جایی که a مانع بسته شدن دایره می‌شود، یا، حتی بهتر، با طرحواره رابطه میان ایگو و لذت، جایی که عدم لذت بر حسب (عدم) جذب تعریف می‌شود، همچون «انچه جذب‌ناشدنی می‌ماند، فروکاست‌ناپذیر به اصل لذت». واژگانی که فروید و لکان برای توصیف رابطه میان ایگو و ژوئیسانس به کار می‌برند، به‌خوبی با استعاره‌پردازی نگرش نژادپرستانه نسبت به خارجی‌ها جور درمی‌اید: جذب، و مقاومت در برابر جذب، بیرون راندن یک بدن بیگانه، تعادل مختل‌شده...</p><p style=\"direction: rtl; \">برای پیدا کردن جایِ این نوع شر در میان انواع معمول شر، وسوسه می‌شویم که از سه‌گانه فرویدی ایگو، سوپرایگو و اید همچون اصل طبقه‌بندی استفاده کنیم:</p><p style=\"direction: rtl; \">• رایج‌ترین نوع شر، شر ایگو است: رفتاری که با انگیزه محاسبه خودخواهانه و طمع پیش می‌رود - یعنی با بی‌اعتنایی به اصول اخلاقی عام؛</p><p style=\"direction: rtl; \">• شری که به اصطلاح «متعصبان بنیادگرا» مرتکب می‌شوند، برعکس، شر سوپرایگو است: شری که به نام وفاداری متعصبانه به فلان ارمان ایدئولوژیک انجام می‌شود؛</p><p style=\"direction: rtl; \">• اما در اسکین‌هدی {نئونازی‌های سفیدپوست -م} که خارجی‌ها را کتک می‌زند، نه می‌توان محاسبه خودخواهانه روشنی تشخیص داد و نه همذات‌پنداری ایدئولوژیک اشکاری. تمام آن حرف‌ها درباره اینکه خارجی‌ها کار ما را می‌دزدند یا تهدیدی برای ارزش‌های غربی ما هستند، نباید فریبمان دهد: با بررسی دقیق‌تر خیلی زود روشن می‌شود که این حرف‌ها عقلانی‌سازی ثانویه‌ای نسبتا سطحی فراهم می‌کنند. پاسخی که در نهایت از یک اسکین‌هد می‌شنویم این است که کتک زدن خارجی‌ها به او احساس خوبی می‌دهد، که حضورشان اشفته‌اش می‌کند... انچه در اینجا با آن روبروییم، شر اید است، شری که بر اساس ابتدایی‌ترین عدم تعادل در رابطه میان ایگو و ژوئیسانس ساختاربندی و برانگیخته می‌شود، بر اساس تنش میان لذت و بدن بیگانهِ ژوئیسانس، درست در قلب آن. شر اید بدین ترتیب ابتدایی‌ترین «اتصال کوتاه» را در رابطه سوژه با ابژه-علت میل اولیه و گمشده‌اش به صحنه می‌اورد: انچه ما را در «دیگری» (یهودی، ژاپنی، افریقایی، ترک...) «ازار می‌دهد» این است که او به نظر می‌رسد رابطه‌ای ممتاز با آن ابژه دارد - دیگری یا صاحب آن ابژه-گنج است، و آن را از چنگ ما ربوده (به همین دلیل ما آن را نداریم)، یا تهدیدی برای مالکیت ما بر آن ابژه است. خلاصه اینکه «تاب‌ نیاوردن» اسکین‌هد در برابر دیگری را نمی‌توان بدون ارجاع به ابژه-علت میل که بنا بر تعریف گمشده است، به‌ درستی فهمید.</p><p style=\"direction: rtl; \">چگونه می‌توان به‌طور موثر با این شر اید مبارزه کرد، شری که به دلیل سرشت «ابتدایی‌»اش در برابر هرگونه استدلال عقلانی یا حتی صرفا خطابی نفوذناپذیر می‌ماند؟ به این معنا که، نژادپرستی همواره در فانتزی‌ای خاص (فانتزیِ کوزا نوسترا، چیزِ قومی ما که از سوی «ان‌ها» تهدید می‌شود، «ان‌ها» که با لذت افراطی خود تهدیدی برای «شیوه زندگی» ما هستند) ریشه دارد که بنا بر تعریف در برابر تعمیم ‌یافتن مقاومت می‌کند. {تلاش برای -م} ترجمه فانتزی نژادپرستانه، به رسانه عام بیناسوبژکتیویته نمادین (اخلاق گفت‌وگویی هابرماسی) به‌هیچ‌وجه چنگ فانتزی نژادپرستانه بر ما را ضعیف نمی‌کند. اگر بخواهیم این قدرت فانتزی را تضعیف کنیم، راهبردی سیاسی متفاوت لازم است، راهبردی که بتواند انچه را لکان «عبور از فانتزی» می‌نامید در خود جای دهد، راهبردی از جنس همذات‌پنداری افراطی، که این واقعیت را به حساب می‌اورد که سوپرایگوی مستهجن در مقام بنیاد و پشتیبان قانون عمومی، تنها تا جایی عمل می‌کند که ناگفته و پنهان از چشم عموم باقی بماند. چه می‌شود اگر به‌جای کالبدشکافی انتقادی و طنزی که ناتوانی خود را در برابر هسته فانتزی نژادپرستی اشکار می‌کند، برعکس عمل کنیم و اشکارا با سوپرایگوی مستهجن همذات‌پنداری کنیم؟</p><p style=\"direction: rtl; \">در فرایند فروپاشی سوسیالیسم در اسلوونی، گروه پست‌پانک لایباخ ترکیبی تهاجمی و ناسازگار از استالینیسم، نازیسم و ایدئولوژی خون و خاک را به صحنه اورد. نخستین واکنش منتقدان چپ روشن‌اندیش این بود که لایباخ را تقلیدی طنزامیز از ائین‌های توتالیتر بفهمند؛ بااین‌حال، پشتیبانی ان‌ها از لایباخ همواره با حسی از ناراحتی همراه بود: «اگر ان‌ها واقعا جدی باشند چه؟ اگر واقعا با ائین توتالیتر همذات‌پنداری کنند چه؟» - یا (روایتی حیله‌گرانه‌تر) فرافکنی شک خود بر دیگری: «اگر لایباخ مخاطبشان را دست بالا گرفته باشند چه؟ اگر مخاطبان انچه لایباخ به‌تمسخر تقلید می‌کنند را جدی بگیرند چه، در نتیجه لایباخ عملا چیزی را تقویت کنند که ادعای تضعیفش را دارند؟» این حس ناراحتی بر این فرض تغذیه می‌شود که فاصله طنزامیز خودبه‌خود نگرشی براندازانه است. اما اگر، برعکس، نگرش غالب در جهان «پساایدئولوژیک» معاصر دقیقا فاصله‌ای کلبی‌وار نسبت به ارزش‌های عمومی باشد چه؟ اگر این فاصله، به‌هیچ‌وجه تهدیدی برای نظام محسوب نشود، بلکه عالی‌ترین شکل همنوایی را مشخص کند، چه، چون کارکرد عادی نظام مستلزم فاصله کلبی‌وار است؟ در این صورت، استراتژی لایباخ در نوری تازه ظاهر می‌شود: این استراتژی نظام (ایدئولوژی حاکم) را دقیقا تا جایی «دچار مایوس‌سازی» می‌کند که نه تقلیدی طنزامیز، بلکه همذات‌پنداری افراطی با آن باشد - همذات‌پنداری افراطی با اشکار کردن سویه مستهجن سوپرایگویی نظام، کارایی آن را به حالت تعلیق درمی‌اورد.</p><p style=\"direction: rtl; \">نهایی‌ترین چاره لایباخ، دستکاری ماهرانه انتقال است: مخاطبان ان‌ها (به‌ویژه روشنفکران) وسواس «میل دیگری» را دارند - {مدام از خود می‌پرسند} موضع واقعی لایباخ چیست؟ ایا ان‌ها واقعا توتالیترند یا نه؟ - یعنی، ان‌ها از لایباخ سوالی می‌پرسند و انتظار پاسخ از ان‌ها دارند، و توجه نمی‌کنند که خود لایباخ نه همچون یک پاسخ، بلکه همچون یک پرسش عمل می‌کند. لایباخ با سرشت گریزپای میل خود، با تصمیم‌ناپذیری در مورد اینکه «واقعا کجا ایستاده‌اند»، ما را وامی‌دارد موضع گرفته و درباره میل خود تصمیم بگیریم.</p><p style=\"direction: rtl; \">در اینجا لایباخ در واقع واژگونی‌ای را به انجام می‌رساند که پایان درمان روان‌کاوی را تعریف می‌کند. در اغاز درمان، انتقال قرار دارد: رابطه انتقالی به محض اینکه تحلیل‌گر در کسوتِ سوژه مفروض به دانستن ظاهر می‌شود - دانستنِ حقیقت درباره میل فردِ تحلیل‌شونده - به اجرا درمی‌اید. وقتی در طول روان‌کاوی، تحلیل‌شونده شکایت می‌کند که نمی‌داند چه می‌خواهد، تمام ناله‌ها و شکوه‌هایش متوجه تحلیل‌گر است، با این فرض ضمنی که تحلیل‌گر می‌داند. به بیان دیگر - تا انجا که تحلیل‌گر نماینده دیگری بزرگ است - توهم تحلیل‌شونده در این است که نااگاهی خود درباره میلش را به ناتوانی‌ای «معرفت‌شناختی» فرو می‌کاهد: حقیقت درباره میل او پیشاپیش وجود دارد، جایی در دیگری بزرگ ثبت شده، تنها کافی است اشکارش کرد تا میل‌ورزی‌اش با ارامش به راه افتد... {اما برعکس، نکته اینجاست که -م} پایان روان‌کاوی، فروپاشی انتقال، زمانی رخ می‌دهد که این ناتوانی «معرفت‌شناختی» به ناممکنیِ «هستی‌شناختی» تغییر یابد: تحلیل‌شونده باید تجربه کند که دیگری بزرگ نیز حقیقت درباره میل او را در اختیار ندارد، که میل او بی‌ضمانت، بی‌بنیاد است، تنها از جانب خود مجاز شمرده می‌شود. در این معنای دقیق، فروپاشی انتقال مشخص‌کننده لحظه‌ای است که پیکان پرسشی که تحلیل‌شونده به سوی تحلیل‌گر نشانه رفته بود، به سوی خود تحلیل‌شونده برمی‌گردد: نخست پرسش (هیستریک) تحلیل‌شونده متوجه تحلیل‌گری است که فرض می‌شود پاسخ را در اختیار دارد؛ سپس تحلیل‌شونده ناچار می‌شود تصدیق کند که خود تحلیل‌گر چیزی جز یک علامت پرسش بزرگ خطاب به تحلیل‌شونده نیست. در اینجا می‌توان تز لکان را مشخص‌تر کرد که تحلیل‌گر تنها از جانب خود مجاز شمرده می‌شود: یک تحلیل‌شونده زمانی تحلیل‌گر می‌شود که بپذیرد میلش هیچ پشتیبانی در دیگری ندارد، که مجوز میلش تنها می‌تواند از جانب خودش صادر شود. و تا انجا که همین واژگونی جهت پیکان رانه را تعریف می‌کند، می‌توانیم بگوییم (همان‌طور که لکان می‌گوید) انچه در پایان روان‌کاوی رخ می‌دهد، گذار از میل به رانه است.</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>نگاهِ خیرهِ ناتوان و گناه آن</b></p><p style=\"direction: rtl; \">فانتزی بنیادین جنگ فناورانه معاصر، همان فانتزی‌ای که ادراک ما از جنگ خلیج فارس را ساختاربندی کرد، مستلزم تعلیق خشونت فیزیکی «خام» است. نخستین «تحقق مادی» این فانتزی، ساخت «خط ماژینو» در دهه ۱۹۳۰ بود. نخست، مانعی مطلق داریم که ما را از سوی دیگر، از «دشمن»، جدا می‌کند؛ این مانع با جلوگیری از هرگونه تماس مستقیم با دشمن، جنگ را به‌کلی شخصیت‌زدایی می‌کند و بدین ترتیب سازمان‌دهی جنگ را همچون حرفه‌ای معمولی ممکن می‌سازد. یک سرباز روزی هشت ساعت می‌جنگد (در پست خود پشت توپ و چیزهایی از این قبیل)؛ سپس به اقامتگاه‌های مسکونی می‌رود، استراحت می‌کند، کتاب می‌خواند، به سینما می‌رود، و بعد شیفت هشت ساعته دیگری را شروع می‌کند... به این ترتیب، «هیچ چیز واقعی رخ نمی‌دهد»: واقعیت خام خون و مرگ به داده‌های انتزاعی «رفع» می‌شود - موقعیت هدف، نمره بمباران ما...</p><p style=\"direction: rtl; \">بنابراین، فانتزی بنیادین جنگ فناورانه معاصر، صرفا خودِ فانتزی است، چرا که در فانتزی، سوژه به نگاهی خیره و منفعل فروکاسته می‌شود که شاهد صحنه فانتزی است، صحنه‌ای که واقعیت‌اش به حالت تعلیق درامده. حال، چگونه باید پیوند میان این جایگاه شاهد منفعل - جایگاه نگاه خیره محض - و فوران خشونت «واقعی» را فهمید؟ یکی از کلیشه‌های فمینیسم واسازانه به پیوند میان نگاه خیره و قدرت مربوط می‌شود: آن که «می‌بیند»، آن که نقطه‌دیدش میدان دید را سازمان می‌دهد و بر آن مسلط است، حامل قدرت نیز هست؛ پیشاپیش در فانتزی بنتام از سراسربین، جایگاه قدرت، در نگاه خیره‌یِ مرکزی قرار دارد. بر همین اساس، رابطه قدرت در سینما با این واقعیت تعیین می‌شود که نگاه خیره مردانه میدان دید را کنترل می‌کند، حال‌انکه جایگاه زن، جایگاه ابژه ممتاز نگاه خیره مردانه است. بااین‌حال، درس شاهکارهای بزرگ هیچکاک از بدنام تا پنجره پشتی این است که دیالکتیک نگاه خیره و قدرت بسیار ظریف‌تر از اینهاست: نگاه خیره در واقع دلالت بر قدرت دارد، اما هم‌زمان، و در سطحی بنیادین‌تر، بر چیزی دقیقا در مقابل قدرت - بر ناتوانی - دلالت دارد، تا انجا که متضمن جایگاه شاهدِ بی‌حرکتی است که نمی‌تواند جز مشاهده انچه رخ می‌دهد کاری کند.</p><p style=\"direction: rtl; \">جنگ اخیر در بوسنی، پرسشِ گناه نگاه خیره را به‌ شدت حاد مطرح کرد: چرا نظاره‌گرِ ناتوانی که ناچار به تماشای وحشتی وصف‌ناپذیر است، ناگزیر الوده به گناه به نظر می‌رسد، حتی اگر «تقصیر او نباشد»؟ منظور ما در اینجا تجاوز به‌عنوان «سلاح» است، که به‌ویژه صرب‌ها علیه مسلمان‌ها به کار می‌بردند. شکلی که این امر به خود می‌گیرد - تجاوز به دختری (یا پسری، علی‌السویه) در حضور پدرش، که ناچار به تماشای ماجراست - محکوم است که دور باطل گناه را به راه اندازد: پدر - نماینده اقتدار، نماینده دیگری بزرگ - در ناتوانی کامل خود عریان می‌شود، و این امر او را هم در چشمان خودش و هم در چشمان دخترش گناهکار می‌کند؛ دختر به خاطر تحقیر پدرش گناهکار است. بنابراین، تجاوز، علاوه بر رنج جسمی و روانی دختر، مستلزم فروپاشی کل شبکه اجتماعی-نمادین خانوادگی است.</p><p style=\"direction: rtl; \">نگاه خیره ناتوان، پیشاپیش در «صحنه نخستین» داستان «نامه ربوده‌شده»ی پو، یعنی در ربودن نامه توسط وزیر در حضور ملکه و پادشاه، در کار است: در اینجا نگاه خیره ناتوان، نگاه خود ملکه است که تنها می‌تواند عمل را تماشا کند، ناتوان از هر اقدامی برای جلوگیری از آن، چرا که هر کنشی از سوی او همدستی‌اش را نزد پادشاه فاش می‌کرد. نگاه خیره‌یِ ناتوان بدین ترتیب، عنصری است در مثلثی که همچنین شامل نگاه جاهلانه‌یِ دیگری بزرگ و عمل تبهکار-شکنجه‌گر می‌شود. به‌طور دقیق، چه کسی در اینجا ناتوان است؟ در وهله نخست، مسلما سوژه‌ی نگاه خیره ناتوان. اما در سطحی عمیق‌تر، ناتوانی‌ای رادیکال‌تر به شخص ثالثِ جاهل، به دیگری بزرگ، به عامل اقتدار اجتماعی (پادشاه در «نامه ربوده‌شده») تعلق دارد: عملِ تبهکار، ناتوانی دیگری بزرگ را عریان می‌کند، بی‌انکه خود دیگری بزرگ از آن اگاه باشد. سوژه‌یِ نگاه خیره ناتوان، تنها می‌تواند منفعلانه ماجرا را تماشا کند، چرا که دستانش به دلیل همدستی پنهان، همبستگی‌اش با تبهکار، بسته است: بی‌انکه دیگری بزرگ بداند، خود او {نگاهِ خیره} نیز علیه دیگری بزرگ خطا کرده است.</p><p style=\"direction: rtl; \">این جایگاهِ «شاهد ناتوان»، همچنین مولفه‌ای کلیدی از تجربه امر والا است: این تجربه زمانی رخ می‌دهد که خود را در برابر رویدادی هراس‌انگیز می‌یابیم که فهم آن از ظرفیت بازنمایی ما فراتر است؛ چنان سهمگین است که نمی‌توانیم کاری جز خیره شدن به آن با وحشت انجام دهیم؛ بااین‌حال هم‌زمان این رویداد هیچ تهدید بی‌واسطه‌ای برای سلامت جسمی ما ایجاد نمی‌کند، به‌طوری‌که می‌توانیم فاصله امن یک مشاهده‌گر را حفظ کنیم. کانت تجربه امر والا را به نمونه‌هایی از طبیعت محدود می‌کند (دریای طوفانی، پرتگاه‌های کوهستانی...)، و این واقعیت را نادیده می‌گیرد که یک عمل انسانی نیز می‌تواند چنین تجربه‌ای را برانگیزد: عمل شکنجه و قتل - در اینجا نیز، تنها می‌توانیم با وحشت به آن خیره شویم. توماس د کوئینسی نظریه خود درباره «هنر والای قتل» را با ارجاع به کانت بیان کرد؛ در عمل ادبی‌اش، او این بُعد والا را با ارائه قتل از دیدگاه یک مشاهده‌گر به تصویر کشید (کلفتی که می‌داند قاتلی که همین حالا اربابش را کشته، پشت درها کمین کرده؛ مهمان هتلی که از گوشه‌ای تاریک در بالای پله‌ها تماشا می‌کند که قاتل چگونه تمام خانواده صاحب هتل را سلاخی می‌کند). و درس روان‌کاوی این است که باید لذت (جنسی) شدید را نیز به شکنجه و قتل همچون منابع بالقوه تجربه امر والا افزود.</p><p style=\"direction: rtl; \">جایگاه مشاهده‌گر ناتوان همچنین ماتریس یکی از صحنه‌های استاندارد در فیلم نوار است. برای نمونه، در فیلم خواب بزرگ هاوارد هاکس، مارلو که پشت حصاری چوبی پنهان شده، تماشا می‌کند که ادم‌کشی حرفه‌ای، کلاهبرداری را که ترجیح می‌دهد جانش را از دست بدهد تا به دختری که دوستش دارد خیانت کند، می‌کشد. شاید روشن‌ترین نمونه در ابتدای فیلم خیابان اسکارلت فریتس لانگ رخ دهد، زمانی که ادوارد رابینسون شاهد طغیان خشونت‌بار دن دوریا علیه جون بنت است: رابینسون که قاب فانتزی‌اش کورش کرده، یک «دعوای ساده عشاق» را که جون بنت اشکارا از آن لذت می‌برد، به‌ اشتباه همچون رنجی ادراک می‌کند که باید او را از آن نجات داد. این صحنه کلید صورت فلکی نگاه خیره ناتوان را به دست می‌دهد: عنصر تحمل‌ناپذیر و تروماتیکی که این نگاه شاهد آن است، در نهایت همان لذت زنانه‌ای است که حضورش اقتدار دیگری بزرگ، اقتدار نام-پدر را به تعلیق درمی‌اورد، و فانتزی (فانتزی «تهدیدی» که زن باید از آن «نجات» داده شود) سناریویی است که برای گریز از لذت زنانه می‌سازیم. فانتزی «کودکی را می‌زنند» فروید را باید با انچه شاید نمونه‌ای حتی ابتدایی‌تر از صحنه فانتزی است تکمیل کرد: «زنی شکنجه-نزدیکی (جنسی) می‌شود.»</p><p style=\"direction: rtl; \">پس چرا مشاهده‌گر منفعل و ناتوان است؟ زیرا میل او دوپاره است، میان شیفتگی به لذت و بیزاری از آن تقسیم شده؛ یا - به بیانی دیگر - به این دلیل که اشتیاق او به نجات زن از چنگ شکنجه‌گرش با این اگاهی ضمنی مهار می‌شود که قربانی از رنج خود لذت می‌برد. تواناییِ مشاهده‌گر برای اقدام - برای نجات زن-قربانی از شکنجه‌گر یا از خودش - گواهی می‌دهد بر اینکه او «فریب فانتزی خودش را خورده» (چنان‌که لکان در باب ساد می‌گوید): ضربه، لذتِ مآزاد تحمل‌ناپذیر را نشانه می‌گیرد.</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>جنگ فانتزی‌ها</b></p><p style=\"direction: rtl; \">باور عمومی درباره خشونت در «جامعه نمایش» پسامدرن چنین است: امروزه ادراک ما از واقعیت چنان با دستکاری‌های رسانه‌ایِ زیبایی‌شناختی‌شده، واسطه‌مندی یافته که دیگر ممکن نیست واقعیت را از تصویر رسانه‌ای‌اش تمایز دهیم - خودِ واقعیت همچون نمایشی زیبایی‌شناختی تجربه می‌شود. فوران‌های خشونت «نامعقول» را باید در برابر این پس‌زمینه فهمید: همچون تلاش‌هایی نومیدانه برای کشیدن خط تمایزی میان داستان و واقعیت از طریق گذار به کنش - یعنی برای زدودن تار عنکبوت شبه‌واقعیت زیبایی‌شناسی‌شده و رسیدن به واقعیتِ سخت و راستین. این باور عمومی، به‌هیچ‌روی صرفا نادرست نیست، بلکه به دلایل نادرستی درست است: انچه در آن غایب است، تمایز کلیدی میان نظم خیالی و داستان نمادین است. مشکل رسانه‌های معاصر نه در این است که ما را به خلط داستان و واقعیت می‌کشانند، بلکه در سرشت «فراواقعیت»یِ ان‌هاست که از رهگذر آن، خلایی را که فضا را برای داستان نمادین گشوده نگه می‌دارد، اشباع می‌کنند. نظم نمادین تنها با حفظ فاصله‌ای حداقلی نسبت به واقعیت می‌تواند کار کند، و به همین دلیل در نهایت جایگاه یک داستان را دارد. کافی است اضطرابی را به یاد اوریم که وقتی کلماتمان «عینا» تحقق می‌یابند پدید می‌اید. در طناب هیچکاک، پروفسور کادل هنگامی که دو تن از شاگردانش نظریه‌های او درباره حق ابرانسان‌ها برای قتل را «لفظا» و عینا درک کرده و به اجرا درمی‌اورند، به‌طرز ناخوشایندی غافلگیر می‌شود: این غافلگیری گواه «نرمال بودن» کادل است. بنابراین نظم نمادین اگر بناست به‌طور عادی کار کند، نباید «لفظا» گرفته و درک شود. برای نمونه، وقتی پیش‌خدمتی با «حال شما امروز چطور است؟» از روی تعارف به من خوش‌امد می‌گوید، بهترین راه برای ایجاد تعجب این است که این پرسش را جدی بگیرم و پاسخش دهم («واقعا روز بدی داشتم. اول صبح یک سردرد وحشتناک. بعد...»). در «جامعه نمایش»، رشد بیش از حد «بازنمایی‌های فراواقعیت»یِ خیالی، فضای کمتر و کمتری برای این داستان نمادین، گشوده باقی می‌گذارد. انچه با واقع‌گرایی رسانه‌ای، از اسباب‌بازی‌ها گرفته تا ویدئوها، از دست می‌رود، تجربه «کمتر، بیشتر است» می‌باشد: وقتی به اپرایی روی سی‌دی گوش می‌دهید، درست همین واقعیت که «چیزی نمی‌بینید» شما را قادر می‌سازد این خلا را با داستان خلاقانه پر کنید. در مقابل، همیشه چیزی مبتذل در اپرای ویدئویی وجود دارد، درست به دلیل اینکه «همه‌چیز را می‌توانید ببینید».</p><p style=\"direction: rtl; \">پس، وقتی این رشد بیش از حد امر خیالی، فضای داستان نمادین را اشباع می‌کند، چه رخ می‌دهد؟ خلایی که با داستان نمادین خلاقانه پر می‌شود، همان ابژه کوچک a است، ابژه-علت میل، همان قاب تهی‌ای که فضا را برای بیان میل فراهم می‌کند. وقتی این خلا اشباع می‌شود، فاصله‌ای که a را از واقعیت جدا می‌کند از دست می‌رود: a به درون واقعیت سقوط می‌کند. بااین‌حال، خود واقعیت با عقب‌نشینی ابژه a برساخته می‌شود: ما تنها تا جایی می‌توانیم با واقعیت «عادی» رابطه داشته باشیم که ژوئیسانس از آن تخلیه شده باشد، که ابژه-علت میل در آن غایب باشد. پیامد ضروری نزدیکی بیش از حد a به واقعیت، که فعالیت داستان نمادین را خفه می‌کند، بنابراین «واقعیت‌زدایی» از خود واقعیت است: واقعیت دیگر با داستان‌های نمادین ساختاربندی نمی‌شود؛ فانتزی‌هایی که رشد بیش از حد خیالی را تنظیم می‌کنند، مستقیما بر آن چنگ می‌اندازند. و در همین‌جاست که خشونت در کسوت گذار روان‌پریشانه به کنش، وارد صحنه می‌شود.</p><p style=\"direction: rtl; \">وقتی هملتِ هیستریک، پنهان در پشت پرده، تماشاگر کلادیوس در حال نیایش است، نمی‌تواند تصمیم بگیرد که با شمشیر به او ضربه بزند یا نه: ایا کشتن کلادیوس در مقام گوشت‌وخون، ضربه‌ای نیز به جوهر والای درون کلادیوس، به انچه «در او بیش از خود اوست»، یعنی ابژه کوچک a، وارد خواهد کرد؟ تردید هملت ما را قادر می‌سازد از طریق نفی، گذار روان‌پریشانه به کنش را دریابیم. در روان‌پریشی، a از واقعیت طرد نشده و همچون خلا قاب صوری آن عمل نمی‌کند. در نتیجه، روان‌پریش، برخلاف هیستریک، تردید نمی‌کند، او می‌داند که a در واقعیت مندرج است؛ به همین دلیل می‌تواند کنش کند و بالفعل، دیگری را بکشد، و بدین ترتیب ضربه‌ای به a وارد کند. گذار روان‌پریشانه به کنش را باید همچون تلاشی نومیدانه از سوی سوژه فهمید تا ابژه a را به زور از واقعیت بیرون براند، و بدین ترتیب به واقعیت دسترسی پیدا کند. («از دست رفتن واقعیت» در روان‌پریشی نه زمانی پدید می‌اید که چیزی در واقعیت گم شده، بلکه برعکس، زمانی است که چیزِ بیش از حد زیادی در واقعیت هست.) این بیرون راندن a همچنین ماتریس خشونت «نامعقول» جنگی را تولید می‌کند. در اینجا، شاید خوانش ریچارد رورتی از ۱۹۸۴ اورول بتواند کمکی باشد: رورتی درباره فروپاشی وینستون در دستان اوبراین، شکنجه‌گرش، اشاره می‌کند که:</p><p style=\"direction: rtl; \">\"مردم می‌توانند حقارتِ نهایی را تجربه کنند، آنگاه که به طور واپس‌نگر به خود می‌گویند: «حالا که من این را باور کرده یا خواسته‌ام، دیگر هرگز نمی‌توانم انی باشم که امید داشتم باشم، انی که فکر می‌کردم هستم. داستانی که درباره خودم برای خودم تعریف می‌کردم... دیگر معنا ندارد. دیگر خودی ندارم که به آن معنا ببخشم. هیچ جهانی نیست که بتوانم خودم را در حال زندگی در آن تصور کنم، زیرا هیچ واژگانی نیست که با آن بتوانم داستانی منسجم درباره خودم تعریف کنم.» برای وینستون، جمله‌ای که نمی‌توانست صادقانه ادا کند و همچنان بتواند خودش را دوباره سر هم کند این بود: «این کار را با جولیا بکن!» و بدترین چیز در جهان خبرچین بودن است. اما احتمالا هر یک از ما در رابطه مشابه‌ای با جمله‌ای، و با چیزی، ایستاده‌ایم.</p><p style=\"direction: rtl; \">یکی از گزاره‌های بنیادین روان‌کاوی لکانی این است که این جمله یا چیز که هسته‌یِ هستی سوژه را فراسوی همذات‌پنداری‌های خیالی در بر می‌گیرد، به‌طور فروکاست‌ناپذیری نسبت به بافت نمادینی که هویت سوژه را تعریف می‌کند، برون‌مرکز است: سوژه تنها به بهای ناپدیدشدگی موقت خود می‌تواند با این هسته بیرون بوده‌یِ درونی {ex-timate} روبه‌رو شود. این همان چیزی است که فرمول فانتزی لکان -𝑎♦$- نشان می‌دهد: محو شدگی سوژه در برابر این بدن (باور، میل، گزاره) غریب و «بیرون بوده‌یِ درونی» که هسته هستی او را می‌سازد. کافی است به یاد اوریم که چگونه وقتی خصوصی‌ترین شیوه لذت ما علنا فاش می‌شود، مثل گل سرخ، سرخ می‌شویم: دلمان می‌خواهد در زمین فرو برویم. به بیان دیگر ناپدیدشدگی، گواه ناهماهنگیِ فروکاست‌ناپذیر میان هسته سخت فانتزی و بافت روایت نمادین است: وقتی خطر رویارویی با این هسته سخت را به جان می‌خرم، «داستانی که درباره خودم برای خودم تعریف می‌کردم دیگر معنا ندارد»، «دیگر خودی ندارم که به آن معنا ببخشم» - یا، به زبان لکانی، دیگری بزرگ (نظم نمادین) به درون دیگری کوچک، ابژه کوچک a، ابژه-فانتزی فرو می‌ریزد. بیرون کشیده شدن ابژه a از میدان واقعیت است که به این میدان انسجام می‌بخشد: در ناپدیدشدگی، ابژه a دیگر بیرون کشیده نمی‌شود، بلکه حضوری تمام‌عیار پیدا می‌کند - در نتیجه، نه‌تنها بافت نمادینی که واقعیت مرا می‌ساخت از هم می‌پاشد، بلکه خودِ هسته فانتزیِ لذت من نیز عریان می‌شود و اماج حمله قرار می‌گیرد.</p><p style=\"direction: rtl; \">شاید، به یک معنا، هیچ خشونتی بزرگ‌تر از آن نباشد که سوژه‌ای، برخلاف میلش، ناچار شود ابژه a درون خود را در معرض دید عمومی قرار دهد. و در ضمن، نهایی‌ترین استدلال علیه تجاوز نیز در همین است: حتی اگر، به یک معنا، مردسالاری به حق باشد - حتی اگر برخی زنان به‌ نحوی و گاهی بخواهند که با خشونت با ان‌ها رفتار شود- دقیقا به همین دلیل، هیچ‌چیز تحقیرامیزتر از این نیست که زنی را، برخلاف میلش واداریم به میل خود تن دهد. این همان چیزی است که شکسپیر در کوریولانوس در نظر داشت وقتی از «شنیدن هیولاوار هیچ‌هایم» سرباز زد: او ترجیح داد خائن شود تا اینکه به خودستایی عمومی متوسل شود و آن «هیچ» را که هسته هستی‌اش بود عریان سازد.</p><p style=\"direction: rtl; \">پس جنگ کنونی در بوسنی موردی نمونه‌وار از یک جنگ «پسامدرن» است: این جنگ به‌نحوی مثال‌زدنی سه‌گانه ایگو-شر، سوپرایگو-شر و اید-شر را محقق می‌سازد. در اینجا با خشونت فیزیکی شدید، تصرف سرزمین، غارت، با خشونت نمادین، ویرانی جهان نمادین دشمن، «فرهنگ‌کشی»، که در نتیجه آن «داستانی که آن جماعت درباره خودش برای خودش تعریف می‌کرد دیگر معنا ندارد»؛ و در رادیکال‌ترین سطح، با تلاشی برای وارد اوردن ضربه‌ای به لذتِ مآزاد تحمل‌ناپذیر، یعنی a، که در دیگری مندرج است، سروکار داریم. از ان‌جا که نفرت به «ویژگی‌های بالفعل» ابژه‌اش محدود نیست، بلکه هسته واقع آن، ابژه a، یعنی انچه «در ابژه بیش از خود آن است» را هدف می‌گیرد، ابژه نفرت، به‌معنای دقیق کلمه، نابودناشدنی است: هرچه بیشتر ابژه را در واقعیت نابود کنیم، هسته والای آن با قدرت بیشتری در برابرمان قد می‌افرازد.</p><p style=\"direction: rtl; \">این پارادوکس، که پیش‌تر در مورد یهودیان در المان نازی ظهور کرده بود (هرچه بی‌رحمانه‌تر نابود می‌شدند، ان‌هایی که باقی مانده بودند، ابعاد هراس‌انگیزتری به خود می‌گرفتند)، امروز می‌توان آن را در مورد مسلمانان در بوسنی مشاهده کرد: هرچه بیشتر سلاخی و از گرسنگی تلف شوند، خطر «بنیادگرایی اسلامی» در چشمان صرب‌ها قدرتمندتر می‌شود. رابطه ما با این هسته امر واقع-تروماتیکِ لذتِ مآزاد که «ازارمان می‌دهد» در دیگری، در فانتزی‌ها ساختاربندی می‌شود (فانتزی‌هایی درباره قدرت مطلق دیگری، درباره کردارهای جنسی غریب «ان‌ها» و امثال اینها). به این معنای دقیق، جنگ همواره هنچنین جنگی است، جنگی بر سر فانتزی‌ها.</p><p style=\"direction: rtl; \">اتین بالیبار درباره پس‌زمینه اجتماعی این جنگ «پسامدرن»، جابه‌جایی دوگانه نژادپرستی معاصر را نسبت به نژادپرستی «کلاسیک» به‌روشنی بیان کرده است. نژادپرستی کلاسیک همچون مکملی برای ناسیونالیسم عمل می‌کند: این شکلی ثانویه است که در برابر پس‌زمینه ابراز هویت ملی ظهور می‌کند و تشدید «بیمارگون» آن، سویه منفی‌اش، وارونگی‌اش، تغییر جهت آن به سوی «دیگربودگی درونی»، به سوی بدن بیگانه‌ای را که ملت-بدن ما را از درون تهدید می‌کند، مشخص می‌شود. امروز، به نظر می‌رسد رابطه وارونه شده است - یا، به زبان هگلی، در خود بازتابیده شده: خودِ ناسیونالیسم، همچون گونه‌ای یا مکملی برای نژادپرستی عمل می‌کند، همچون مرزبندی‌ای از بدنِ بیگانه‌یِ «درونی». بر این اساس، «ناسیونالیسمِ غیرنژادپرستانه» امروز رسما ناممکن است، چرا که خود ناسیونالیسم، در همان مفهوم خود، همچون گونه‌ای از نژادپرستی وضع می‌شود («دیگری» که ما هویت ملی خود را در برابر او ابراز می‌کنیم، همواره ما را «از درون» تهدید می‌کند). بنابراین دلواپسی‌های چپ‌ها درباره ملی‌گرایی {ناسیونالیسم} «غیرتهاجمی» و «خوب» - درباره امکان کشیدن خط تمایزی روشن میان ملی‌گرایی «خوب» ملت‌های کوچکِ در معرض تهدید و ملی‌گرایی «بد» تهاجمی - کاملا موجه است.</p><p style=\"direction: rtl; \">در درون خود میدان نژادپرستی، همتای این جابه‌جایی، تغییر ساختاری در نقش یهودستیزی است. در نژادپرستی کلاسیک، یهودستیزی همچون یک استثنا عمل می‌کند: برای نمونه، در گفتمان نازی، نگرش نسبت به یهودیان (که همزاد شوم خود المانی‌ها هستند و، به همین دلیل، باید نابود شوند) به‌طور رادیکالی با نگرش نسبت به دیگر ملل «پست‌تر» تفاوت دارد، که در مورد ان‌ها هدف نه نابودی بلکه صرفا فرودست‌سازی است - ان‌ها باید «جایگاه مناسب» خود را در سلسله‌مراتب ملل بپذیرند. یهودیان عنصر برهم‌زننده‌ای هستند که دیگر ملل پست‌تر را به نافرمانی تحریک می‌کنند، بنابراین تنها از طریق نابودی یهودیان است که ملل دیگر جایگاه فرودست مناسب خود را خواهند پذیرفت. بااین‌حال، در اینجا نیز وارونگی خاصی امروز در حال وقوع است: ما با یهودستیزی تعمیم‌یافته سروکار داریم - یعنی، هر «دیگربودگی» قومی همچون همزادی شوم فهمیده می‌شود که لذت ما را تهدید می‌کند؛ خلاصه اینکه، نژادپرستی «عادی»، غیراستثنایی، و غیریهودستیزانه دیگر ممکن نیست. تعمیم‌یافتن استعاره هولوکاست (اینکه درباره هر پاک‌سازی قومی‌ای ادعا می‌شود که با هولوکاست نازی قابل مقایسه است)، هرچند ممکن است افراطی به نظر برسد، در منطق درونی خود چیز، در تعمیم‌یافتن یهودستیزی، ریشه دارد.</p><p style=\"direction: rtl; \">این وارونگی، این جابه‌جایی میان جنس و گونه، بر فروپاشی تدریجی دولت-ملت در مقام قالب اصلیِ همذات‌پنداری با چیزِ قومی استوار است. امروز این قالب از هر دو سو زیر حمله قرار دارد: هم از طریق فرایندهای فراملی یکپارچگی و هم از طریق ظهور شکل‌های تازه محلی، درون‌ملی، قومی و شبه‌قومیِ همذات‌پنداری. درون این میدان جهانی، هر تفاوت قومی به‌خودی‌خود «درونی» تلقی می‌شود - به همین دلیل هر ناسیونالیسمی پیشاپیش گونه‌ای از نژادپرستی است، و هر نژادپرستی‌ای پیشاپیش ساختار یهودستیزی را دارد.</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>عبور از فانتزی</b></p><p style=\"direction: rtl; \">کتاب عالیجناب خاکستریِ الدوس هاکسلی، زندگینامه پر ژوزف، مشاور سیاسی کاردینال ریشلیو، باید در فهرست مطالعاتی هر کسی باشد که می‌خواهد نوری بر رابطه مبهم میان اخلاق و فانتزی بیفکند. اگر در یک بازسازی داستانی از تاریخ اروپای مدرن، می‌خواستیم آن اپیزودی را ایزوله کنیم که روند «عادی» رویدادها را مختل کرد و آن عدم تعادلی را وارد کرد که پیامد نهایی‌اش دو جنگ جهانی در قرن ما بود، نامزد اصلی این نقش بی‌گمان تکه‌تکه شدن قلمرو المان در جنگ سی‌ساله در نیمه اول قرن هفدهم است - در نتیجه این تکه‌تکه شدن، تثبیت دولت-ملت در المان به تاخیر افتاد. و اگر یک نفر باشد که، در درون این بازسازی داستانی، بتوان او را مسئول این نتایج فاجعه‌بار دانست، نامزد اصلی این نقش پر ژوزف است که، با ظرفیت خارق‌العاده‌اش برای دسیسه‌چینی، موفق شد گسستی در اردوگاه پروتستان ایجاد کند، پیمانی میان فرانسه کاتولیک و سوئد پروتستان منعقد سازد، و بدین ترتیب مرکز ثقل جنگ را به قلمرو المان منتقل کند.</p><p style=\"direction: rtl; \">پر ژوزف تجسم نهایی سیاست‌مدار دسیسه‌گر ماکیاولیایی‌ است که اماده است هزاران زندگی را فدا کند و به جاسوسی، دروغ، قتل و اخاذی برای مصلحت دولت متوسل شود. اما - و این همان ویژگی‌ای بود که هاکسلی را مسحور می‌کرد - سویه دیگری نیز در همین پر ژوزف وجود داشت: او نه‌تنها یک کشیش، بلکه عارفی از اصیل‌ترین نوع بود. هر شب، پس از روزی پر از دسیسه‌های دیپلماتیک دردناک و پیچاپیچ، غرق در مراقبه عمیق می‌شد؛ رویاهای عرفانی‌اش گواه اصالتی درخور قدیسه ترزا یا یوحنای صلیب است؛ او به‌طور مرتب با خواهران یک صومعه کوچک فرانسوی مکاتبه می‌کرد، و همیشه وقتی برای راهنمایی ان‌ها در هنگام پریشانی روحی‌شان می‌یافت... چگونه باید این دو سویه را با هم اندیشید؟ در این نقطه کلیدی، خود هاکسلی از پارادوکس واقعی می‌گریزد و راه اسان را برمی‌گزیند و تقصیر را به گردن نقطه‌ ضعف مفروض خود تجربه عرفانی پر ژوزف می‌اندازد: توجه افراطی بر مسیح، وسواسش نسبت به رنج مسیح در مسیر صلیب، مسئولِ ممکن‌سازی دستکاری بی‌پروای رنج دیگران شمرده می‌شود. (به همین دلیل، هاکسلی از مسیحیت روی برگرداند و در طلب نجات روحی در حکمت شرقی برامد.) بااین‌حال، انچه باید انجام دهیم دقیقا پافشاری بر همین پیوند به‌ظاهر ناممکن است: یک شخص می‌تواند دسیسه‌گری هیولایی باشد، بااین‌حال «خودفهمی»‌اش، تجربه وجودی-دینی‌اش، می‌تواند بی‌عیب‌ونقص «اصیل» باشد. هیچ «تجربه‌ی خود» غیرایدئولوژیک، هرچند «اصیل»، نمی‌تواند تضمین کند که سیاست‌هایی هراس‌انگیز به نام آن به اجرا درنخواهند امد. ایا نمونه اعلای ادبی این پارادوکس برادران کارامازوف داستایوفسکی نیست؟ چنان‌که امروز از طرح‌های پس از مرگ منتشرشده می‌دانیم، این الیوشا، الگوی معنویت بی‌گناه و فروتن است که در ادامه نانوشته رمان، می‌بایست به تروریستی انقلابی بدل می‌شد.</p><p style=\"direction: rtl; \">امروزه مُد شده که با اسکین‌هدها «در خانه» مصاحبه کنند و نشان دهند که ان‌ها در محیط خانه‌شان «ادم‌هایی عادی مثل ما» هستند، اعضایی مراقبت‌گر از خانواده، شوهرانی مهربان یا پسرانی پرمحبت - در اینجا نیز باید تناقضی را تاب اوریم: یک شخص می‌تواند بی‌رحمانه مهاجران را کتک بزند، بااین‌حال در حلقه خانوادگی‌اش شوهری عاشق باشد که از مادرزن پیر و ناتوانش مراقبت می‌کند... مورد اسکین‌هد در خانه، حتی روشن‌تر از پر ژوزف است، چرا که در اینجا با نمونه‌ای مثال‌زدنی از «هم‌زمانی اضداد» هگلی سروکار داریم: یک اسکین‌هد خشن، تقابل بیرونی یا دیگریِ مرد خانواده احساساتی نیست، بلکه خود همین مرد خانواده احساساتی است در دیگریت‌اش؛ یعنی، او واکنش خشن همین مرد را زمانی که پناهگاه امن خانوادگی‌اش تهدید می‌شود، ارائه می‌کند. به بیان دیگر، اسکین‌هدی که به خشم می‌اید و شروع به کتک‌زدن «ان‌ها» می‌کند، بی‌انکه هیچ بنیاد «عمیق‌تر» عقلانی یا ایدئولوژیکی داشته باشد، صرفا به این دلیل که «این کار به او احساس خوبی می‌دهد»، کسی نیست جز همان فرد خودشیفته به‌اصطلاح «جامعه مصرفی» در مدالیته‌ای دیگر: خطی که ان‌ها را جدا می‌کند بسیار باریک است؛ این خط شامل تبدیلی صرفا صوری است، چرا که با یک نگرش بنیادین واحد سروکار داریم که یا در درون چارچوب ایدئولوژیک انچه «از نظر اجتماعی مجاز» است ثبت می‌شود یا در بیرون آن.</p><p style=\"direction: rtl; \">تشخیص اینکه این نمونه اسکین‌هد چه تفاوتی با دیگر نمونه‌های پیش‌تر ذکرشده شکاف سازنده ایدئولوژی به قانون عمومی و سویه مستهجن پنهان از چشم عموم دارد («کد قرمز»، لینچ‌های کوکلاکس‌کلان) دشوار نیست. نمونه اسکین‌هد تقریبا به‌طور متقارن نمونه‌های پیشین را وارونه می‌کند: در آن، خود سطح «لکه‌دار» می‌شود - اسکین‌هد انچه را دو سرباز در چند مرد خوب یا اعضای کوکلاکس‌کلان در پوشش تاریکی انجام می‌دهند، در برابر چشم عموم انجام می‌دهد - حال‌انکه سویه «صادق» و «انسانی» به حوزه خصوصی عقب می‌نشیند. علی‌رغم بی‌رحمی اعمال عمومی‌اش، اسکین‌هد در خلوت فردی گرم مانند خود ماست که مادرش را دوست دارد، و امثالهم - به‌جای چهره عمومی حافظ قانون و نظم با سویه‌ای مستهجن، چهره‌ای هراس‌انگیز داریم که سویه‌ای لطیف، صادق و «انسانی» را پنهان می‌کند. چیزی مشابه در هیجیوگرافی {زندگی‌نامه -م} استالینیستیِ لنین در کار بود: متون استالینیستی اشکارا اذعان می‌کنند که لنین، در تلاشش برای تحقق ضرورت تاریخی، ناچار به توسل به تدابیری قاطع بود - یعنی بسیاری از هنجارهای ملایم اخلاقی بورژوایی را زیر پا بگذارد و به اعدام‌های فوری تعداد زیادی از مردم فرمان دهد - بااین‌حال، عمیقا از سونات‌های پیانوی بتهوون منقلب می‌شد، بچه‌ها و گربه‌ها را دوست داشت... این تفاوت بدین ترتیب درست تفاوت میان قدرت سنتی و «توتالیتر» است: در قدرت سنتی، سوپرایگو پنهانی فعال است، حال‌انکه در نظم «توتالیتر»، فضای عمومی را تصرف می‌کند، و به‌اصطلاح «انسانیت گرم» همچون ویژگی خصوصی افرادی ظاهر می‌شود که ضرورت تاریخ، انجام فجایع مستهجن را بر ان‌ها تحمیل می‌کند...</p><p style=\"direction: rtl; \">رویدادهای اخیر در یوگسلاوی سابق ثابت می‌کند که یکی از احمقانه‌ترین ضرب‌المثل‌هایی که در اختیار داریم، این جمله بدنام است که «فهمیدن یعنی بخشیدن». این در مورد کشتار قومی در بوسنی به چه معناست؟ «فهمیدن» صرب‌ها به معنای قرار دادن خود در جایگاه خودفهمی ان‌ها و «بازتجربه» نحوه‌ای است که اعمالشان را ادراک و توجیه می‌کنند - غوطه‌ور شدن در خرده اسطوره‌های صرب است که صرب‌ها از رهگذر آن خودتجربه تاریخی‌شان را روایت‌پردازی می‌کنند. پارادوکسی که در اینجا باید تاب اورد این است که جنایات وحشیانه و هیولاوارانه صرب‌ها، به‌هیچ‌ وجه از اصالت، و نوعی زیبایی تراژیک، که به این اسطوره‌ها تعلق دارد، نمی‌کاهد.</p><p style=\"direction: rtl; \">نگرش اخلاقی روان‌کاوی در همین‌جاست، همان واژگونی‌ای که لکان آن را «عبور از فانتزی» نامید: در فاصله‌ای که ناچاریم نسبت به «اصیل‌ترین» رویاهایمان، نسبت به اسطوره‌هایی که انسجام جهان نمادین ما را تضمین می‌کنند، اتخاذ کنیم.</p><p style=\"direction: rtl; \"><br></p><p style=\"direction: rtl; \"><b>یادداشت‌ها</b></p><p class=\"MsoFootnoteText\" style=\"text-align: left; direction: ltr;\"><span class=\"MsoFootnoteReference\"><span class=\"MsoFootnoteReference\"><span style=\"line-height: 115%;\"><a href=\"#back1\" style=\"\">1.</a>&nbsp;</span></span></span>The Thing</p><p class=\"MsoFootnoteText\" style=\"\"><o:p></o:p></p><p class=\"MsoFootnoteText\" style=\"text-align: left; direction: ltr;\"><a href=\"#back2\">2</a><a href=\"#back2\">.</a>&nbsp;vanishing mediator</p><p class=\"MsoFootnoteText\" style=\"text-align: left; direction: ltr;\"><a href=\"#back3\">3.</a> Ethics<o:p></o:p></p><p class=\"MsoFootnoteText\" style=\"text-align: left; direction: ltr;\"><span style=\"line-height: 115%;\"><a href=\"#back4\">4.</a> </span><span style=\"line-height: 115%;\">Morals&nbsp;</span></p><p class=\"MsoFootnoteText\"><span lang=\"FA\" dir=\"RTL\" style=\"font-family:&quot;Arial&quot;,sans-serif;\r\nmso-ascii-font-family:Aptos;mso-ascii-theme-font:minor-latin;mso-hansi-font-family:\r\nAptos;mso-hansi-theme-font:minor-latin;mso-bidi-theme-font:minor-bidi;\r\nmso-bidi-language:FA\"><o:p></o:p></span></p><p style=\"direction: rtl; \"><b>منبع</b></p><p style=\"direction: rtl; \">ترجمه فصل سوم کتاب متاستازهای لذت: شش جستار درباره زن و علیت، نوشته اسلاوی ژیژک:</p><p style=\"direction: ltr;\">Žižek, S. (1994). <i>The metastases of enjoyment: Six essays on woman and causality</i>. Verso.</p>","category":["روانکاوی","سوپرایگو","قانون","ایدئولوژی"],"date":"20 خرداد 1405","thumbnail":"https://i.postimg.cc/5yKYxKrn/HD-Amy-Spain-H650930p613c.jpg","authorId":"6","translatorId":"5","type":"translated"},{"id":"5","slug":"necessity-of-contradiction-for-hegel","title":"تناقض، نه سنتز: ضرورت تناقض برای هویت در هگل","excerpt":"چه خوب می‌شد اگر می‌توانستیم فلسفه هگل را فقط با تکرار این شعار ساده‌لوحانه توضیح دهیم: «تز، انتی‌تز، سنتز». این کار نه‌تنها فهم هگلِ به‌غایت دشوار را ساده‌تر می‌کند، بلکه تصویری ارامش‌بخش هم به دست می‌دهد از اینکه تعارض‌ها و تناقض‌ها اخر سر چطور به خیر و خوشی تمام می‌شوند. بدبختانه هرکس کمترین شناختی از هگل داشته باشد می‌داند که برداشت رایج از اندیشه او - همچون حرکتی از تز به انتی‌تز به سنتز - چیزی جز یک کاریکاتور نیست. می‌شود فهمید چرا این کژفهمی شکل گرفت: هگل به سه‌تایی‌ها دلبستگی عمیقی دارد، و دیالکتیک او در بسط خود اغلب چنان به نظر می‌رسد که از یک ادعای یک‌سویه به ادعایی یک‌سویه در برابر آن، و سپس به ادعای سومی می‌رود که کاستی‌های هر دو را برطرف می‌کند. این‌گونه است که تصویر تز، انتی‌تز، سنتز جا می‌افتد...","content":"<p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>توضیح مترجم</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">این متن ترجمه فصل اول کتاب رهایی پس از هگل: دستیابی به انقلابی متناقض نوشته تاد مک گوان است. کتاب به خوبی با کلیشه‌هایی که خوانش هگل را فرا گرفته‌اند مبارزه می‌کند، به منتقدان پاسخ می‌دهد و ضرورت تناقض درونی در هر هویتی را نشان می‌دهد. فصل اول، این امر را به شیوه‌ای خلاصه نشان می‌دهد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><br></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\"><b>سنتز یک راه‌حل</b></p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">چه خوب می‌شد اگر می‌توانستیم فلسفه هگل را فقط با تکرار این شعار ساده‌لوحانه توضیح دهیم: «تز، انتی‌تز، سنتز». این کار نه‌تنها فهم هگلِ به‌غایت دشوار را ساده‌تر می‌کند، بلکه تصویری ارامش‌بخش هم به دست می‌دهد از اینکه تعارض‌ها و تناقض‌ها اخر سر چطور به خیر و خوشی تمام می‌شوند. بدبختانه هرکس کمترین شناختی از هگل داشته باشد می‌داند که برداشت رایج از اندیشه او - همچون حرکتی از تز به انتی‌تز به سنتز - چیزی جز یک کاریکاتور نیست. می‌شود فهمید چرا این کژفهمی شکل گرفت: هگل به سه‌تایی‌ها دلبستگی عمیقی دارد، و دیالکتیک او در بسط خود اغلب چنان به نظر می‌رسد که از یک ادعای یک‌سویه به ادعایی یک‌سویه در برابر آن، و سپس به ادعای سومی می‌رود که کاستی‌های هر دو را برطرف می‌کند. این‌گونه است که تصویر تز، انتی‌تز، سنتز جا می‌افتد.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">با وجود این شباهت سطحی، هگل هرگز این اصطلاحات را برای توصیف فلسفه خود به کار نمی‌برد و حتی تلویحا این شیوه از سازمان‌دهیِ حرکت اندیشه را نقد هم می‌کند. بااین‌حال، این تصویر برای کسانی که می‌خواهند به هگل حمله کنند محبوب است، چون القا می‌کند که گویی هگل به حل‌وفصل‌های شسته‌رفته و ضرورتا پیش‌رونده تقابل‌ها در جهانی باور دارد که پیوسته این حکم را نقض می‌کند. با داشتن این تصویر از اندیشه‌اش در ذهن، هگل همچون خوش‌باوری ساده‌دل جلوه می‌کند که از فهم اشفتگی‌های حل‌نشده زندگی واقعی ناتوان است.</p><p class=\"\" dir=\"RTL\" style=\"direction: rtl; unicode-bidi: embed;\">خوشبختانه برای انان که حاضر نیستند هگل را به زباله‌دان تاریخ بیندازند، فلسفه او تقریبا درست مسیر معکوس انچه این فرمول تجویز می‌کند را طی می‌کند. از این منظر، این فرمول گ
